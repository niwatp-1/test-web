                        </div>
                    </div>
                    <div className="p-6 max-w-6xl mx-auto space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-zinc-900 p-6 rounded-2xl border border-zinc-800 shadow-lg"><div className="text-zinc-500 text-sm mb-1 flex items-center gap-2"><Wallet size={16} /> ยอดรวมทั้งหมด</div><div className="text-4xl font-bold text-white">{formatCurrency(stats.total)}</div></div>
                            <div className="bg-zinc-900 p-6 rounded-2xl border border-zinc-800 shadow-lg"><div className="text-zinc-500 text-sm mb-1 flex items-center gap-2"><Calculator size={16} /> ค่าคอมมิชชั่น ({user.commission}%)</div><div className="text-4xl font-bold text-green-500">+{formatCurrency(stats.comm)}</div></div>
                            <div className="bg-gradient-to-br from-amber-600 to-yellow-600 p-6 rounded-2xl shadow-lg text-black"><div className="text-black/60 text-sm mb-1 font-bold flex items-center gap-2"><Send size={16} /> ยอดส่งเจ้าของ (สุทธิ)</div><div className="text-4xl font-bold">{formatCurrency(stats.net)}</div></div>
                        </div>
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className="lg:col-span-2 bg-zinc-900 rounded-2xl border border-zinc-800 overflow-hidden flex flex-col h-[500px]">
                                <div className="p-4 border-b border-zinc-800 font-bold flex items-center gap-2 text-zinc-300"><FileText size={18} /> รายการส่งมาล่าสุด</div>
                                <div className="overflow-y-auto custom-scrollbar flex-1 p-2">
                                    <table className="w-full text-sm text-left">
                                        <thead className="text-xs text-zinc-500 uppercase bg-zinc-950/50 sticky top-0"><tr><th className="px-4 py-3">เวลา</th><th className="px-4 py-3">คนคีย์</th><th className="px-4 py-3">เลข</th><th className="px-4 py-3">ประเภท</th><th className="px-4 py-3 text-right">จำนวน</th></tr></thead>
                                        <tbody className="divide-y divide-zinc-800">{myTransactions.map(t => (<tr key={t.id} className="hover:bg-zinc-800/30"><td className="px-4 py-3 text-zinc-500 whitespace-nowrap">{t.timestamp.split(' ')[1]}</td><td className="px-4 py-3 text-zinc-300">{t.sender}</td><td className="px-4 py-3 font-bold font-mono text-lg">{t.number}</td><td className="px-4 py-3 text-zinc-400">{t.type}</td><td className="px-4 py-3 text-right font-bold text-amber-500">{formatCurrency(t.amount)}</td></tr>))}{myTransactions.length === 0 && <tr><td colSpan="5" className="text-center py-8 text-zinc-600">ไม่มีข้อมูล</td></tr>}</tbody>
                                    </table>
                                </div>
                            </div>
                            <div className="space-y-6">
                                <div className="bg-zinc-900 rounded-2xl border border-zinc-800 overflow-hidden h-fit">
                                    <div className="p-4 border-b border-zinc-800 font-bold flex items-center gap-2 text-zinc-300"><PieChart size={18} /> สรุปแยกประเภท</div>
                                    <div className="p-4 space-y-3">{Object.entries(transactionsByType).map(([type, amount]) => (<div key={type} className="flex justify-between items-center text-sm border-b border-zinc-800/50 pb-2 last:border-0"><span className="text-zinc-400">{type}</span><span className="font-bold text-white">{formatCurrency(amount)}</span></div>))}</div>
                                </div>

                                <div className="bg-zinc-900 rounded-2xl border border-zinc-800 overflow-hidden h-fit">
                                    <div className="p-4 border-b border-zinc-800 font-bold flex items-center justify-between text-zinc-300">
                                        <div className="flex items-center gap-2"><Users size={18} /> รายชื่อคนคีย์ ({myOperators.length})</div>
                                    </div>
                                    <div className="p-2 space-y-1 max-h-[300px] overflow-y-auto custom-scrollbar">
                                        {myOperators.map(op => (
                                            <div key={op.username} className="flex justify-between items-center p-3 bg-zinc-800/30 hover:bg-zinc-800/50 rounded-xl border border-zinc-800/50 text-sm transition-colors group">
                                                <div>
                                                    <div className="text-white font-bold flex items-center gap-2"><User size={14} className="text-amber-500" /> {op.name}</div>
                                                    <div className="text-[10px] text-zinc-500 font-mono mt-0.5">ID: {op.username}</div>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <div className="text-right">
                                                        <div className="text-xs text-zinc-400 bg-zinc-950 px-2 py-1 rounded border border-zinc-700 font-mono">Pass: {op.password}</div>
                                                        <div className="text-[10px] text-emerald-400 mt-1 font-medium text-right">ค่าคอม: {op.commission || 0}%</div>
                                                    </div>
                                                    <button onClick={() => setEditingOperator(op)} className="p-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-white transition-colors border border-zinc-700"><Settings size={14} /></button>
                                                </div>
                                            </div>
                                        ))}
                                        {myOperators.length === 0 && (
                                            <div className="text-center text-zinc-600 text-xs py-8 flex flex-col items-center">
                                                <UserPlus size={24} className="opacity-20 mb-2" />
                                                ยังไม่มีคนคีย์ในสาย
                                                <div className="mt-2 text-[10px] text-amber-500/50">กดปุ่ม "เพิ่มคนคีย์" ด้านบนเพื่อสร้าง</div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    {showAddOperatorModal && <AddOperatorModal isOpen={showAddOperatorModal} onClose={() => setShowAddOperatorModal(false)} onSave={onAddOperator} leaderId={user.id} />}
                    {editingOperator && <EditOperatorModal isOpen={!!editingOperator} onClose={() => setEditingOperator(null)} operator={editingOperator} onSave={onUpdateOperator} onDelete={onDeleteOperator} />}
                </div>
            );
        };

        // 5. OWNER VIEW
        const OwnerView = ({ transactions, onLogout, leaders, payoutRates, setPayoutRates, winningNumbers, setWinningNumbers, onAddLeader, onUpdateLeader, onDeleteLeader, onResetData }) => {
            const [tab, setTab] = useState('dashboard'); // dashboard, rewards, rates, leaders, transactions
            const [showAddLeaderModal, setShowAddLeaderModal] = useState(false);
            const [editingLeader, setEditingLeader] = useState(null);
            const [calculatedResults, setCalculatedResults] = useState(null); // Store results only after clicking button
            
            // Add translation mapping
            const RATE_TRANSLATIONS = {
                top3: '3 ตัวบน',
                tod3: '3 ตัวโต๊ด',
                bottom3: '3 ตัวล่าง',
                front3: '3 ตัวหน้า',
                return3: '3 ตัวกลับ',
                top2: '2 ตัวบน',
                bottom2: '2 ตัวล่าง',
                return2: '2 ตัวกลับ',
                runTop: 'วิ่งบน',
                runBottom: 'วิ่งล่าง'
            };

            // 1. Calculations
            const totalSales = useMemo(() => transactions.reduce((acc, t) => acc + t.amount, 0), [transactions]);
            const totalCommission = useMemo(() => {
                return transactions.reduce((acc, t) => {
                    const leader = leaders.find(l => l.id === t.leaderId);
                    const commRate = leader ? leader.commission : 0;
                    return acc + (t.amount * (commRate / 100));
                }, 0);
            }, [transactions, leaders]);
            const netIncome = totalSales - totalCommission;

            // Risk Analysis (Highest exposure per number)
            const exposure = useMemo(() => {
                const map = {}; // { type_number: totalAmount }
                transactions.forEach(t => {
                    const key = `${t.type}_${t.number}`;
                    if(!map[key]) map[key] = { type: t.type, number: t.number, amount: 0, payout: 0 };
                    map[key].amount += t.amount;
                });
                // Calculate Payout Liability
                Object.values(map).forEach(item => {
                    const rateKeyMap = {
                        '2 ตัวบน': 'top2', '2 ตัวล่าง': 'bottom2', '2 ตัวกลับ': 'return2',
                        '3 ตัวบน': 'top3', '3 ตัวโต๊ด': 'tod3', '3 ตัวล่าง': 'bottom3', '3 ตัวหน้า': 'front3', '3 ตัวกลับ': 'return3',
                        'วิ่งบน': 'runTop', 'วิ่งล่าง': 'runBottom'
                    };
                    const rateKey = rateKeyMap[item.type];
                    const rate = payoutRates[rateKey] || 0;
                    item.payout = item.amount * rate;
                });
                return Object.values(map).sort((a,b) => b.payout - a.payout);
            }, [transactions, payoutRates]);

            const maxLiability = exposure.length > 0 ? exposure[0].payout : 0; // The single worst case scenario payout for one number
            
            // Sales by Type
            const salesByType = useMemo(() => {
                const grp = {};
                transactions.forEach(t => { if(!grp[t.type]) grp[t.type] = 0; grp[t.type] += t.amount; });
                return Object.entries(grp).sort((a,b) => b[1] - a[1]);
            }, [transactions]);

            const handleCalculateRewards = () => {
                let totalPayout = 0;
                const winners = [];
                
                transactions.forEach(t => {
                    let win = false;
                    let rate = 0;
                    // Check against SPECIFIC INPUTS from winningNumbers
                    if(t.type === '3 ตัวบน' && winningNumbers.top3 && t.number === winningNumbers.top3) { win = true; rate = payoutRates.top3; }
                    if(t.type === '3 ตัวล่าง' && winningNumbers.bottom3 && t.number === winningNumbers.bottom3) { win = true; rate = payoutRates.bottom3; }
                    if(t.type === '3 ตัวหน้า' && winningNumbers.front3 && winningNumbers.front3.includes(t.number)) { win = true; rate = payoutRates.front3; } // Allow simple include check for now
                    if(t.type === '3 ตัวโต๊ด' && winningNumbers.tod3 && checkPermutation(t.number, winningNumbers.tod3)) { win = true; rate = payoutRates.tod3; }
                    if(t.type === '3 ตัวกลับ' && winningNumbers.return3 && checkPermutation(t.number, winningNumbers.return3)) { win = true; rate = payoutRates.return3; }
                    
                    if(t.type === '2 ตัวบน' && winningNumbers.top2 && t.number === winningNumbers.top2) { win = true; rate = payoutRates.top2; }
                    if(t.type === '2 ตัวล่าง' && winningNumbers.bottom2 && t.number === winningNumbers.bottom2) { win = true; rate = payoutRates.bottom2; }
                    // 2 Return Check: check permutation against the return2 value
                    if(t.type === '2 ตัวกลับ' && winningNumbers.return2 && checkPermutation(t.number, winningNumbers.return2)) { win = true; rate = payoutRates.return2; } 
                    
                    if(t.type === 'วิ่งบน' && winningNumbers.runTop && winningNumbers.runTop.includes(t.number)) { win = true; rate = payoutRates.runTop; }
                    if(t.type === 'วิ่งล่าง' && winningNumbers.runBottom && winningNumbers.runBottom.includes(t.number)) { win = true; rate = payoutRates.runBottom; }

                    if(win) {
                        const pay = t.amount * rate;
                        totalPayout += pay;
                        winners.push({ ...t, winAmount: pay });
                    }
                });
                
                setCalculatedResults({ totalPayout, winners });
            };

            const profitLoss = netIncome - (calculatedResults ? calculatedResults.totalPayout : 0);

            // Auto-fill helpers (Updated Logic)
            const handleReward1Change = (val) => {
                // Ensure only numbers
                const cleanVal = val.replace(/[^0-9]/g, '');
                const newWin = { ...winningNumbers, reward1: cleanVal };
                
                if (cleanVal.length === 6) {
                    const last3 = cleanVal.slice(-3);
                    const last2 = cleanVal.slice(-2);
                    
                    newWin.top3 = last3;
                    newWin.tod3 = last3;
                    newWin.return3 = last3;
                    
                    newWin.top2 = last2;
                    newWin.return2 = last2;
                    
                    newWin.runTop = Array.from(new Set(last3.split(''))).join(',');
                }
                setWinningNumbers(newWin);
            };

            const handleTop3Change = (val) => {
                const newWin = { ...winningNumbers, top3: val };
                if (val.length === 3) {
                    // Only update derivatives if user changes Top3 manually (optional, but good UX)
                    newWin.tod3 = val;
                    newWin.return3 = val;
                    newWin.top2 = val.slice(-2);
                    newWin.return2 = val.slice(-2);
                    newWin.runTop = Array.from(new Set(val.split(''))).join(',');
                }
                setWinningNumbers(newWin);
            };

            const handleTop2Change = (val) => {
                const newWin = { ...winningNumbers, top2: val, return2: val };
                setWinningNumbers(newWin);
            }

            const handleBottom2Change = (val) => {
                const newWin = { ...winningNumbers, bottom2: val };
                if (val.length === 2) {
                    newWin.runBottom = Array.from(new Set(val.split(''))).join(',');
                }
                setWinningNumbers(newWin);
            };

            return (
                <div className="min-h-screen bg-zinc-950 text-zinc-100 pb-10 font-sans">
                    {/* Header */}
                    <div className="bg-zinc-900 border-b border-zinc-800 px-6 py-4 flex justify-between items-center sticky top-0 z-10">
                        <div className="flex items-center gap-2 text-amber-500 font-bold text-xl"><Activity /> OWNER DASHBOARD</div>
                        <div className="flex items-center gap-4">
                             <button onClick={onResetData} className="flex items-center gap-2 text-xs bg-red-900/50 hover:bg-red-800 text-red-200 px-3 py-1.5 rounded-lg border border-red-800/50 transition-colors"><Trash2 size={14} /> ล้างระบบ</button>
                             <div className="h-6 w-px bg-zinc-700"></div>
                             <div className="text-zinc-400 text-sm">ผู้ดูแล: {leaders.length} สาย</div>
                             <div className="h-6 w-px bg-zinc-700"></div>
                             <button onClick={onLogout} className="flex items-center gap-2 text-zinc-400 hover:text-white text-sm"><LogOut size={16} /> ออกจากระบบ</button>
                        </div>
                    </div>

                    <div className="flex flex-col md:flex-row max-w-7xl mx-auto p-4 md:p-6 gap-6">
                        {/* Sidebar Navigation */}
                        <div className="w-full md:w-64 flex-shrink-0 space-y-2">
                            <button onClick={() => setTab('dashboard')} className={`w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 font-medium transition-all ${tab === 'dashboard' ? 'bg-amber-600 text-black shadow-lg shadow-amber-500/20' : 'text-zinc-400 hover:bg-zinc-800'}`}><BarChart3 size={18} /> ภาพรวม (Dashboard)</button>
                            <button onClick={() => setTab('transactions')} className={`w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 font-medium transition-all ${tab === 'transactions' ? 'bg-amber-600 text-black shadow-lg shadow-amber-500/20' : 'text-zinc-400 hover:bg-zinc-800'}`}><ClipboardList size={18} /> รายการขายทั้งหมด</button>
                            <button onClick={() => setTab('rewards')} className={`w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 font-medium transition-all ${tab === 'rewards' ? 'bg-amber-600 text-black shadow-lg shadow-amber-500/20' : 'text-zinc-400 hover:bg-zinc-800'}`}><Trophy size={18} /> ประกาศผลรางวัล</button>
                            <button onClick={() => setTab('rates')} className={`w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 font-medium transition-all ${tab === 'rates' ? 'bg-amber-600 text-black shadow-lg shadow-amber-500/20' : 'text-zinc-400 hover:bg-zinc-800'}`}><Settings size={18} /> ตั้งราคาจ่าย</button>
                            <button onClick={() => setTab('leaders')} className={`w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 font-medium transition-all ${tab === 'leaders' ? 'bg-amber-600 text-black shadow-lg shadow-amber-500/20' : 'text-zinc-400 hover:bg-zinc-800'}`}><Users size={18} /> รายชื่อหัวสาย</button>
                        </div>

                        {/* Main Content */}
                        <div className="flex-1 space-y-6">
                            
                            {/* TAB: DASHBOARD */}
                            {tab === 'dashboard' && (
                                <div className="space-y-6 animate-fade-in">
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                        <div className="bg-zinc-900 p-5 rounded-2xl border border-zinc-800">
                                            <div className="text-zinc-500 text-xs uppercase tracking-wider mb-2">ยอดขายรวม</div>
                                            <div className="text-3xl font-bold text-white">{formatCurrency(totalSales)}</div>
                                            <div className="text-xs text-zinc-500 mt-2">{transactions.length} บิล</div>
                                        </div>
                                        <div className="bg-zinc-900 p-5 rounded-2xl border border-zinc-800">
                                            <div className="text-zinc-500 text-xs uppercase tracking-wider mb-2">คอมมิชชั่นรวม</div>
                                            <div className="text-3xl font-bold text-red-400">-{formatCurrency(totalCommission)}</div>
                                            <div className="text-xs text-zinc-500 mt-2">เฉลี่ย {totalSales > 0 ? ((totalCommission/totalSales)*100).toFixed(1) : 0}%</div>
                                        </div>
                                        <div className="bg-zinc-900 p-5 rounded-2xl border border-zinc-800 relative overflow-hidden">
                                            <div className="text-zinc-500 text-xs uppercase tracking-wider mb-2">จ่ายสูงสุด (ประมาณการ)</div>
                                            <div className="text-3xl font-bold text-amber-500">{formatCurrency(maxLiability)}</div>
                                            <div className="text-xs text-zinc-500 mt-2">ความเสี่ยงสูงสุดจุดเดียว</div>
                                            <div className="absolute top-0 right-0 p-4 opacity-10"><AlertTriangle size={48} /></div>
                                        </div>
                                        <div className="bg-gradient-to-br from-green-900 to-emerald-950 p-5 rounded-2xl border border-green-800 relative overflow-hidden">
                                            <div className="text-green-300 text-xs uppercase tracking-wider mb-2">คงเหลือสุทธิ (ก่อนจ่าย)</div>
                                            <div className="text-3xl font-bold text-white">{formatCurrency(netIncome)}</div>
                                            <div className="text-xs text-green-400/70 mt-2">ยอดขาย - คอมมิชชั่น</div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                        {/* Risk / Top Numbers */}
                                        <div className="bg-zinc-900 rounded-2xl border border-zinc-800 p-6">
                                            <h3 className="font-bold text-amber-500 flex items-center gap-2 mb-4"><AlertTriangle size={18} /> เลขเสี่ยงยอดนิยม (Top 5 Risk)</h3>
                                            <div className="space-y-3">
                                                {exposure.slice(0, 5).map((item, idx) => (
                                                    <div key={idx} className="flex items-center justify-between p-3 bg-zinc-800/40 rounded-xl border border-zinc-800">
                                                        <div className="flex items-center gap-3">
                                                            <div className="w-10 h-10 rounded-lg bg-zinc-800 flex items-center justify-center font-bold text-white font-mono border border-zinc-700">{item.number}</div>
                                                            <div>
                                                                <div className="text-sm text-zinc-300">{item.type}</div>
                                                                <div className="text-xs text-zinc-500">ยอดซื้อ {formatCurrency(item.amount)}</div>
                                                            </div>
                                                        </div>
                                                        <div className="text-right">
                                                            <div className="text-xs text-zinc-500 mb-1">ต้องจ่าย</div>
                                                            <div className="font-bold text-red-400">{formatCurrency(item.payout)}</div>
                                                        </div>
                                                    </div>
                                                ))}
                                                {exposure.length === 0 && <div className="text-zinc-600 text-center py-4">ไม่มีข้อมูล</div>}
                                            </div>
                                        </div>

                                        {/* Sales by Type */}
                                        <div className="bg-zinc-900 rounded-2xl border border-zinc-800 p-6">
                                            <h3 className="font-bold text-zinc-300 flex items-center gap-2 mb-4"><PieChart size={18} /> สัดส่วนยอดขายตามประเภท</h3>
                                            <div className="space-y-2">
                                                {salesByType.map(([type, amount], idx) => (
                                                    <div key={idx} className="relative pt-1">
                                                        <div className="flex mb-1 items-center justify-between">
                                                            <div className="text-sm text-zinc-400">{type}</div>
                                                            <div className="text-right">
                                                                <span className="text-xs font-semibold inline-block text-white">{formatCurrency(amount)}</span>
                                                            </div>
                                                        </div>
                                                        <div className="overflow-hidden h-2 mb-2 text-xs flex rounded bg-zinc-800">
                                                            <div style={{ width: `${(amount / totalSales) * 100}%` }} className="shadow-none flex flex-col text-center whitespace-nowrap text-white justify-center bg-amber-600"></div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                    
                                    {/* Leader Summary */}
                                    <div className="bg-zinc-900 rounded-2xl border border-zinc-800 overflow-hidden">
                                        <div className="p-4 border-b border-zinc-800 font-bold text-zinc-300 flex items-center gap-2"><Users size={18} /> สรุปยอดจ่ายตามหัวสาย</div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-sm text-left">
                                                <thead className="bg-zinc-950/50 text-xs text-zinc-500 uppercase">
                                                    <tr>
                                                        <th className="px-6 py-3">หัวสาย</th>
                                                        <th className="px-6 py-3 text-right">ยอดขาย</th>
                                                        <th className="px-6 py-3 text-right">คอมมิชชั่น</th>
                                                        <th className="px-6 py-3 text-right">สุทธิ (ส่งเจ้าของ)</th>
                                                        <th className="px-6 py-3 text-right">จำนวนบิล</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-zinc-800">
                                                    {leaders.map(l => {
                                                        const lTx = transactions.filter(t => t.leaderId === l.id);
                                                        const lSales = lTx.reduce((sum, t) => sum + t.amount, 0);
                                                        const lComm = lSales * (l.commission / 100);
                                                        const lNet = lSales - lComm;
                                                        return (
                                                            <tr key={l.id} className="hover:bg-zinc-800/20">
                                                                <td className="px-6 py-4 font-medium text-white">{l.name} <span className="text-zinc-500 text-xs">({l.id})</span></td>
                                                                <td className="px-6 py-4 text-right text-zinc-300">{formatCurrency(lSales)}</td>
                                                                <td className="px-6 py-4 text-right text-red-400">-{formatCurrency(lComm)}</td>
                                                                <td className="px-6 py-4 text-right font-bold text-amber-500">{formatCurrency(lNet)}</td>
                                                                <td className="px-6 py-4 text-right text-zinc-500">{lTx.length}</td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB: TRANSACTIONS (NEW) */}
                            {tab === 'transactions' && (
                                <div className="bg-zinc-900 rounded-2xl border border-zinc-800 overflow-hidden animate-fade-in flex flex-col h-[75vh]">
                                    <div className="p-4 border-b border-zinc-800 font-bold text-zinc-300 flex items-center justify-between">
                                        <div className="flex items-center gap-2"><ClipboardList size={18} /> รายการขายทั้งหมด ({transactions.length})</div>
                                    </div>
                                    <div className="overflow-y-auto custom-scrollbar flex-1">
                                        <table className="w-full text-sm text-left">
                                            <thead className="text-xs text-zinc-500 uppercase bg-zinc-950/50 sticky top-0">
                                                <tr>
                                                    <th className="px-6 py-3">เวลา</th>
                                                    <th className="px-6 py-3">ลูกค้า</th>
                                                    <th className="px-6 py-3">หัวสาย/คนคีย์</th>
                                                    <th className="px-6 py-3">เลข</th>
                                                    <th className="px-6 py-3">ประเภท</th>
                                                    <th className="px-6 py-3 text-right">จำนวนเงิน</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-zinc-800">
                                                {[...transactions].reverse().map((tx) => (
                                                    <tr key={tx.id} className="hover:bg-zinc-800/20">
                                                        <td className="px-6 py-3 text-zinc-500 whitespace-nowrap">{tx.timestamp}</td>
                                                        <td className="px-6 py-3 text-white">{tx.customerName} <span className="text-zinc-600 text-xs">({tx.customerPhone})</span></td>
                                                        <td className="px-6 py-3 text-zinc-400">{tx.leaderId} <span className="text-zinc-600">/ {tx.sender}</span></td>
                                                        <td className="px-6 py-3 font-mono font-bold text-lg text-white">{tx.number}</td>
                                                        <td className="px-6 py-3"><span className="bg-zinc-800 text-zinc-300 px-2 py-1 rounded text-xs border border-zinc-700">{tx.type}</span></td>
                                                        <td className="px-6 py-3 text-right font-bold text-amber-500">{formatCurrency(tx.amount)}</td>
                                                    </tr>
                                                ))}
                                                {transactions.length === 0 && (
                                                    <tr>
                                                        <td colSpan="6" className="text-center py-12 text-zinc-600">
                                                            <div className="flex flex-col items-center gap-2">
                                                                <ClipboardList size={32} className="opacity-20" />
                                                                <span>ยังไม่มีรายการขาย</span>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {/* TAB: REWARDS & PROFIT */}
                            {tab === 'rewards' && (
                                <div className="space-y-6 animate-fade-in">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="bg-zinc-900 p-6 rounded-2xl border border-zinc-800 space-y-4 h-fit">
                                            <h3 className="font-bold text-amber-500 flex items-center gap-2 mb-4"><Trophy size={18} /> กรอกผลรางวัล</h3>
                                            
                                            {/* Top Prize Input */}
                                            <div className="p-3 rounded-xl bg-amber-900/10 border border-amber-500/30 mb-4">
                                                <label className="text-xs text-amber-500 mb-1 block font-bold">รางวัลที่ 1 (6 ตัว)</label>
                                                <input type="text" value={winningNumbers.reward1 || ''} onChange={e => handleReward1Change(e.target.value)} className="w-full bg-zinc-900 border border-amber-500/50 rounded-lg p-3 text-center font-mono text-2xl font-bold text-white tracking-widest focus:border-amber-500 outline-none" placeholder="xxxxxx" maxLength="6" />
                                                <div className="text-[10px] text-amber-500/60 text-center mt-1">กรอกครบ 6 ตัว ระบบจะดึงเลขไปใส่ช่องอื่นให้อัตโนมัติ</div>
                                            </div>

                                            {/* GROUP 3 Digits */}
                                            <div className="space-y-3 p-3 rounded-xl bg-zinc-950/50 border border-zinc-800">
                                                <div className="text-xs text-zinc-500 font-bold mb-2 uppercase tracking-widest">ประเภท 3 ตัว</div>
                                                <div className="grid grid-cols-3 gap-3">
                                                    <div><label className="text-[10px] text-zinc-400 mb-1 block">3 ตัวบน</label><input type="text" value={winningNumbers.top3 || ''} onChange={e => handleTop3Change(e.target.value)} className="w-full bg-zinc-900 border border-zinc-700 rounded p-2 text-center font-mono font-bold text-amber-500" placeholder="xxx" /></div>
                                                    <div><label className="text-[10px] text-zinc-400 mb-1 block">3 ตัวโต๊ด</label><input type="text" value={winningNumbers.tod3 || ''} onChange={e => setWinningNumbers({...winningNumbers, tod3: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded p-2 text-center font-mono text-zinc-300" placeholder="xxx" /></div>
                                                    <div><label className="text-[10px] text-zinc-400 mb-1 block">3 ตัวกลับ</label><input type="text" value={winningNumbers.return3 || ''} onChange={e => setWinningNumbers({...winningNumbers, return3: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded p-2 text-center font-mono text-zinc-300" placeholder="xxx" /></div>
                                                </div>
                                                <div className="grid grid-cols-2 gap-3 mt-3">
                                                    <div><label className="text-[10px] text-zinc-400 mb-1 block">3 ตัวล่าง</label><input type="text" value={winningNumbers.bottom3 || ''} onChange={e => setWinningNumbers({...winningNumbers, bottom3: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded p-2 text-center font-mono text-zinc-300" placeholder="xxx" /></div>
                                                    <div><label className="text-[10px] text-zinc-400 mb-1 block">3 ตัวหน้า</label><input type="text" value={winningNumbers.front3 || ''} onChange={e => setWinningNumbers({...winningNumbers, front3: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded p-2 text-center font-mono text-zinc-300" placeholder="xxx" /></div>
                                                </div>
                                            </div>

                                            {/* GROUP 2 Digits */}
                                            <div className="space-y-3 p-3 rounded-xl bg-zinc-950/50 border border-zinc-800">
                                                <div className="text-xs text-zinc-500 font-bold mb-2 uppercase tracking-widest">ประเภท 2 ตัว</div>
                                                <div className="grid grid-cols-3 gap-3">
                                                    <div><label className="text-[10px] text-zinc-400 mb-1 block">2 ตัวบน</label><input type="text" value={winningNumbers.top2 || ''} onChange={e => handleTop2Change(e.target.value)} className="w-full bg-zinc-900 border border-zinc-700 rounded p-2 text-center font-mono font-bold text-amber-500" placeholder="xx" /></div>
                                                    <div><label className="text-[10px] text-zinc-400 mb-1 block">2 ตัวล่าง</label><input type="text" value={winningNumbers.bottom2 || ''} onChange={e => handleBottom2Change(e.target.value)} className="w-full bg-zinc-900 border border-zinc-700 rounded p-2 text-center font-mono font-bold text-amber-500" placeholder="xx" /></div>
                                                    <div><label className="text-[10px] text-zinc-400 mb-1 block">2 ตัวกลับ</label><input type="text" value={winningNumbers.return2 || ''} onChange={e => setWinningNumbers({...winningNumbers, return2: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded p-2 text-center font-mono text-zinc-300" placeholder="xx" /></div>
                                                </div>
                                            </div>

                                            {/* GROUP Run */}
                                            <div className="space-y-3 p-3 rounded-xl bg-zinc-950/50 border border-zinc-800">
                                                <div className="text-xs text-zinc-500 font-bold mb-2 uppercase tracking-widest">เลขวิ่ง</div>
                                                <div className="grid grid-cols-2 gap-3">
                                                    <div><label className="text-[10px] text-zinc-400 mb-1 block">วิ่งบน</label><input type="text" value={winningNumbers.runTop || ''} onChange={e => setWinningNumbers({...winningNumbers, runTop: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded p-2 text-center font-mono text-zinc-300" placeholder="x" /></div>
                                                    <div><label className="text-[10px] text-zinc-400 mb-1 block">วิ่งล่าง</label><input type="text" value={winningNumbers.runBottom || ''} onChange={e => setWinningNumbers({...winningNumbers, runBottom: e.target.value})} className="w-full bg-zinc-900 border border-zinc-700 rounded p-2 text-center font-mono text-zinc-300" placeholder="x" /></div>
                                                </div>
                                            </div>

                                            <button onClick={handleCalculateRewards} className="w-full bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg flex items-center justify-center gap-2 mt-2 active:scale-95 transition-all"><Calculator size={20} /> บันทึกและคำนวณผล</button>
                                        </div>

                                        <div className="space-y-6">
                                            <div className="bg-zinc-900 p-6 rounded-2xl border border-zinc-800 space-y-6">
                                                <h3 className="font-bold text-green-500 flex items-center gap-2"><Calculator size={18} /> วิเคราะห์กำไร/ขาดทุน</h3>
                                                <div className="space-y-4">
                                                    <div className="flex justify-between items-center border-b border-zinc-800 pb-2">
                                                        <span className="text-zinc-400">คงเหลือสุทธิ (ก่อนจ่าย)</span>
                                                        <span className="font-bold text-white">{formatCurrency(netIncome)}</span>
                                                    </div>
                                                    <div className="flex justify-between items-center border-b border-zinc-800 pb-2">
                                                        <span className="text-zinc-400">ยอดจ่ายจริง (ตามผลรางวัล)</span>
                                                        <span className="font-bold text-red-500">-{formatCurrency(calculatedResults ? calculatedResults.totalPayout : 0)}</span>
                                                    </div>
                                                    <div className={`p-4 rounded-xl text-center border ${profitLoss >= 0 ? 'bg-green-900/20 border-green-800 text-green-400' : 'bg-red-900/20 border-red-800 text-red-400'}`}>
                                                        <div className="text-sm font-medium mb-1">สรุปกำไร/ขาดทุน</div>
                                                        <div className="text-3xl font-bold">{formatCurrency(profitLoss)}</div>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Winners List */}
                                            <div className="bg-zinc-900 rounded-2xl border border-zinc-800 overflow-hidden h-[400px] flex flex-col">
                                                <div className="p-4 border-b border-zinc-800 font-bold text-zinc-300">รายการที่ถูกรางวัล ({calculatedResults ? calculatedResults.winners.length : 0})</div>
                                                <div className="overflow-y-auto custom-scrollbar flex-1">
                                                    {calculatedResults && calculatedResults.winners.length > 0 ? (
                                                        <table className="w-full text-sm text-left">
                                                            <thead className="bg-zinc-950/50 text-xs text-zinc-500 uppercase sticky top-0"><tr><th className="px-4 py-2">เลข</th><th className="px-4 py-2">ประเภท</th><th className="px-4 py-2">ลูกค้า</th><th className="px-4 py-2 text-right">เงินรางวัล</th></tr></thead>
                                                            <tbody className="divide-y divide-zinc-800">
                                                                {calculatedResults.winners.map(w => (
                                                                    <tr key={w.id}>
                                                                        <td className="px-4 py-2 font-mono font-bold text-white">{w.number}</td>
                                                                        <td className="px-4 py-2 text-zinc-400">{w.type}</td>
                                                                        <td className="px-4 py-2 text-zinc-300">{w.customerName}</td>
                                                                        <td className="px-4 py-2 text-right font-bold text-amber-500">{formatCurrency(w.winAmount)}</td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    ) : <div className="text-center py-12 text-zinc-600 flex flex-col items-center justify-center h-full"><Trophy size={32} className="opacity-20 mb-2" /><span>ยังไม่มีรายการที่ถูกรางวัล</span><span className="text-xs opacity-50">(กดปุ่มคำนวณเพื่อเริ่มตรวจสอบ)</span></div>}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB: RATES */}
                            {tab === 'rates' && (
                                <div className="bg-zinc-900 rounded-2xl border border-zinc-800 p-6 animate-fade-in">
                                    <h3 className="font-bold text-zinc-300 mb-6">ตั้งราคาจ่าย (บาทละ)</h3>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                                        {Object.entries(payoutRates).map(([key, val]) => (
                                            <div key={key}>
                                                <label className="text-xs text-zinc-500 mb-2 block">{RATE_TRANSLATIONS[key] || key}</label>
                                                <input type="number" value={val} onChange={(e) => setPayoutRates({...payoutRates, [key]: parseInt(e.target.value) || 0})} className="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-center font-bold text-amber-500 focus:border-amber-500 outline-none" />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* TAB: LEADERS */}
                            {tab === 'leaders' && (
                                <div className="bg-zinc-900 rounded-2xl border border-zinc-800 overflow-hidden animate-fade-in">
                                    <div className="p-4 border-b border-zinc-800 flex justify-between items-center">
                                        <h3 className="font-bold text-zinc-300">รายชื่อหัวสายทั้งหมด</h3>
                                        <button onClick={() => setShowAddLeaderModal(true)} className="text-xs bg-amber-600 text-black px-3 py-1.5 rounded-lg font-bold hover:bg-amber-500">เพิ่มหัวสาย</button>
                                    </div>
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-zinc-950/50 text-xs text-zinc-500 uppercase"><tr><th className="px-6 py-3">ID</th><th className="px-6 py-3">ชื่อ</th><th className="px-6 py-3 text-center">คอมมิชชั่น</th><th className="px-6 py-3 text-right">จัดการ</th></tr></thead>
                                        <tbody className="divide-y divide-zinc-800">
                                            {leaders.map(l => (
                                                <tr key={l.id} className="hover:bg-zinc-800/20">
                                                    <td className="px-6 py-4 font-mono text-zinc-400">{l.id}</td>
                                                    <td className="px-6 py-4 text-white font-medium">{l.name}</td>
                                                    <td className="px-6 py-4 text-center"><span className="bg-zinc-800 px-2 py-1 rounded text-xs">{l.commission}%</span></td>
                                                    <td className="px-6 py-4 text-right"><button onClick={() => setEditingLeader(l)} className="text-zinc-500 hover:text-white"><Settings size={16} /></button></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}

                        </div>
                    </div>
                    {showAddLeaderModal && <AddLeaderModal isOpen={showAddLeaderModal} onClose={() => setShowAddLeaderModal(false)} onSave={onAddLeader} />}
                    {editingLeader && <EditLeaderModal isOpen={!!editingLeader} onClose={() => setEditingLeader(null)} leader={editingLeader} onSave={onUpdateLeader} onDelete={onDeleteLeader} />}
                </div>
            );
        };

        // 6. APP ROOT
        const App = () => {
            const [view, setView] = useState('login');
            const [user, setUser] = useState(null);
            
            // Global State
            const [transactions, setTransactions] = useState(() => { const saved = localStorage.getItem('grand_transactions'); return saved ? JSON.parse(saved) : []; });
            const [payoutRates, setPayoutRates] = useState(DEFAULT_PAYOUT_RATES);
            // Added reward1 to initial state
            const [winningNumbers, setWinningNumbers] = useState({ reward1: '', top3: '', bottom3: '', front3: '', tod3: '', return3: '', top2: '', bottom2: '', return2: '', runTop: '', runBottom: '' });
            
            // Data Injection
            const [leaders, setLeaders] = useState(DEFAULT_LEADERS);
            const [owners] = useState(DEFAULT_OWNERS);
            const [operators, setOperators] = useState(DEFAULT_OPERATORS);

            useEffect(() => { localStorage.setItem('grand_transactions', JSON.stringify(transactions)); }, [transactions]);

            const handleLogin = (role, userData) => { setUser(userData); setView(role); };
            const handleLogout = () => { setUser(null); setView('login'); };
            const addTransaction = (newTxList) => { const txWithIds = newTxList.map((tx, idx) => ({ ...tx, id: Date.now() + idx, editHistory: [] })); setTransactions(prev => [...prev, ...txWithIds]); };
            const updateTransaction = (id, newNumber, newAmount) => { setTransactions(prev => prev.map(tx => { if (tx.id === id) { const oldHistory = tx.editHistory || []; const historyEntry = { timestamp: new Date().toLocaleString('th-TH'), oldNumber: tx.number, newNumber: newNumber, oldAmount: tx.amount, newAmount: parseInt(newAmount, 10) }; return { ...tx, number: newNumber, amount: parseInt(newAmount, 10), editHistory: [...oldHistory, historyEntry] }; } return tx; })); };
            const deleteTransaction = (id) => { setTransactions(prev => prev.filter(tx => tx.id !== id)); };

            const handleAddLeader = (newLeader) => {
                setLeaders(prev => [...prev, newLeader]);
            };

            const handleUpdateLeader = (id, updatedData) => {
                setLeaders(prev => prev.map(l => l.id === id ? { ...l, ...updatedData } : l));
            };

            const handleDeleteLeader = (id) => {
                setLeaders(prev => prev.filter(l => l.id !== id));
            };

            const handleAddOperator = (newOperator) => {
                setOperators(prev => [...prev, newOperator]);
            };

            const handleUpdateOperator = (username, updatedData) => {
                setOperators(prev => prev.map(op => op.username === username ? { ...op, ...updatedData } : op));
            };

            const handleDeleteOperator = (username) => {
                setOperators(prev => prev.filter(op => op.username !== username));
            };

            const resetData = () => {
                if(confirm('⚠️ คำเตือน: คุณต้องการล้างข้อมูลยอดขายทั้งหมดใช่หรือไม่?\nการกระทำนี้ไม่สามารถย้อนกลับได้')) {
                    setTransactions([]);
                    // Reset all winning numbers including reward1
                    setWinningNumbers({ reward1: '', top3: '', bottom3: '', front3: '', tod3: '', return3: '', top2: '', bottom2: '', return2: '', runTop: '', runBottom: '' });
                }
            };

            return (
                <div className="antialiased">
                    {view === 'login' && <LoginView onLogin={handleLogin} leaders={leaders} owners={owners} operators={operators} />}
                    {view === 'operator' && <OperatorView onLogout={handleLogout} onAddTransaction={addTransaction} onUpdateTransaction={updateTransaction} onDeleteTransaction={deleteTransaction} transactions={transactions} user={user} payoutRates={payoutRates} />}
                    {view === 'leader' && <LeaderView user={user} transactions={transactions} onLogout={handleLogout} onAddOperator={handleAddOperator} onUpdateOperator={handleUpdateOperator} onDeleteOperator={handleDeleteOperator} operators={operators} />}
                    {view === 'owner' && <OwnerView transactions={transactions} onLogout={handleLogout} leaders={leaders} payoutRates={payoutRates} setPayoutRates={setPayoutRates} winningNumbers={winningNumbers} setWinningNumbers={setWinningNumbers} onAddLeader={handleAddLeader} onUpdateLeader={handleUpdateLeader} onDeleteLeader={handleDeleteLeader} onResetData={resetData} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
