<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GRAND - ระบบจัดการเลข</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Sarabun', sans-serif;
        }

        /* Custom Animation for Toast */
        @keyframes bounce-short {
            0%, 100% { transform: translateY(-50%); }
            50% { transform: translateY(-65%); }
        }
        .animate-bounce-short {
            animation: bounce-short 0.5s ease-in-out 2;
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #18181b; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #3f3f46; 
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #52525b; 
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        // --- Icon Component Wrapper ---
        // Helper to render Lucide icons in React from the global lucide object
        const Icon = ({ name, size = 24, className }) => {
            const iconData = lucide.icons[name];
            if (!iconData) return null;

            return (
                <svg
                    width={size}
                    height={size}
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    className={className}
                >
                    {iconData.map((child, index) => {
                        const [tag, attrs] = child;
                        return React.createElement(tag, { ...attrs, key: index });
                    })}
                </svg>
            );
        };

        // Define specific icons used in the app
        const Users = (p) => <Icon name="Users" {...p} />;
        const TrendingUp = (p) => <Icon name="TrendingUp" {...p} />;
        const AlertTriangle = (p) => <Icon name="AlertTriangle" {...p} />;
        const LogOut = (p) => <Icon name="LogOut" {...p} />;
        const Save = (p) => <Icon name="Save" {...p} />;
        const Clock = (p) => <Icon name="Clock" {...p} />;
        const Search = (p) => <Icon name="Search" {...p} />;
        const ArrowLeft = (p) => <Icon name="ArrowLeft" {...p} />;
        const CheckCircle2 = (p) => <Icon name="CheckCircle2" {...p} />;
        const History = (p) => <Icon name="History" {...p} />;
        const Crown = (p) => <Icon name="Crown" {...p} />;
        const Layers = (p) => <Icon name="Layers" {...p} />;
        const User = (p) => <Icon name="User" {...p} />;
        const Send = (p) => <Icon name="Send" {...p} />;
        const UserPlus = (p) => <Icon name="UserPlus" {...p} />;
        const X = (p) => <Icon name="X" {...p} />;
        const Lock = (p) => <Icon name="Lock" {...p} />;
        const Key = (p) => <Icon name="Key" {...p} />;
        const Megaphone = (p) => <Icon name="Megaphone" {...p} />;
        const Coins = (p) => <Icon name="Coins" {...p} />;
        const Trophy = (p) => <Icon name="Trophy" {...p} />;
        const ArrowLeftRight = (p) => <Icon name="ArrowLeftRight" {...p} />;
        const PieChart = (p) => <Icon name="PieChart" {...p} />;
        const Activity = (p) => <Icon name="Activity" {...p} />;
        const Phone = (p) => <Icon name="Phone" {...p} />;
        const Briefcase = (p) => <Icon name="Briefcase" {...p} />;
        const FileText = (p) => <Icon name="FileText" {...p} />;
        const BookUser = (p) => <Icon name="BookUser" {...p} />;
        const CalendarDays = (p) => <Icon name="CalendarDays" {...p} />;
        const Pencil = (p) => <Icon name="Pencil" {...p} />;
        const Trash2 = (p) => <Icon name="Trash2" {...p} />;
        const FileClock = (p) => <Icon name="FileClock" {...p} />;
        const Wallet = (p) => <Icon name="Wallet" {...p} />;


        // --- Helper Functions ---
        const formatCurrency = (amount) => {
            if (isNaN(amount) || amount === null || amount === undefined) return '฿0';
            return new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB', minimumFractionDigits: 0 }).format(amount);
        };

        const safeParseInt = (val) => {
            if (val === '' || val === null || val === undefined) return '';
            const parsed = parseInt(val, 10);
            return isNaN(parsed) ? '' : parsed;
        };

        // --- COMPONENTS ---

        // 1. Login Component
        const LoginView = ({ onLogin, leaders, owners, operators }) => {
            const [role, setRole] = useState('leader'); 
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleLoginSubmit = () => {
                setError('');

                try {
                    if (role === 'leader') {
                        const foundLeader = leaders.find(l => 
                            l.id && username && l.id.toUpperCase() === username.toUpperCase() && l.password === password
                        );
                        
                        if (foundLeader) {
                            onLogin('leader', foundLeader); 
                        } else {
                            setError('รหัสหัวสาย หรือ รหัสผ่าน ไม่ถูกต้อง (ลองใช้ L88 / 1234)');
                        }
                    } 
                    else if (role === 'owner') {
                        const foundOwner = owners.find(o => 
                            o.id && username && o.id.toUpperCase() === username.toUpperCase() && o.password === password
                        );

                        if (foundOwner) { 
                            onLogin('owner');
                        } else {
                            setError('รหัสเจ้าของ หรือ รหัสผ่าน ไม่ถูกต้อง (ลองใช้ ADMIN / 1234)');
                        }
                    }
                    else if (role === 'operator') {
                        const foundOperator = operators.find(op => 
                            op.username && username && op.username.toUpperCase() === username.toUpperCase() && op.password === password
                        );

                        if (foundOperator) {
                            onLogin('operator', foundOperator);
                        } else {
                            setError('รหัสคนคีย์ หรือ รหัสผ่าน ไม่ถูกต้อง (ลองใช้ OP1 / 111)');
                        }
                    }
                } catch (err) {
                    console.error("Login Error:", err);
                    setError('เกิดข้อผิดพลาดในระบบล็อกอิน');
                }
            };

            const getRoleLabel = (r) => {
                switch(r) {
                    case 'operator': return 'คนคีย์';
                    case 'leader': return 'หัวสาย';
                    case 'owner': return 'เจ้าของ';
                    default: return r;
                }
            }

            return (
                <div className="min-h-screen bg-zinc-950 flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-zinc-900 via-zinc-950 to-black font-sans">
                <div className="bg-zinc-900/80 backdrop-blur-md w-full max-w-sm rounded-2xl shadow-2xl shadow-black border border-amber-500/20 p-8 space-y-6 relative overflow-hidden">
                    
                    <div className="absolute -top-10 -right-10 w-32 h-32 bg-amber-500/10 rounded-full blur-3xl"></div>
                    <div className="absolute -bottom-10 -left-10 w-32 h-32 bg-amber-500/10 rounded-full blur-3xl"></div>

                    <div className="text-center space-y-2 relative z-10">
                    <div className="bg-gradient-to-br from-amber-400 to-yellow-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-amber-900/50">
                        <Crown className="w-8 h-8 text-black" />
                    </div>
                    <h1 className="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-200">
                        THE GRAND
                    </h1>
                    <p className="text-zinc-500 text-sm tracking-widest uppercase">ระบบจัดการหวยออนไลน์</p>
                    </div>

                    {/* Role Selector Tabs */}
                    <div className="flex bg-zinc-950 p-1 rounded-xl border border-zinc-800 relative z-10">
                        {['operator', 'leader', 'owner'].map((r) => (
                            <button
                                key={r}
                                onClick={() => { setRole(r); setError(''); setUsername(''); setPassword(''); }}
                                className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${
                                    role === r 
                                    ? 'bg-zinc-800 text-amber-400 shadow-sm' 
                                    : 'text-zinc-500 hover:text-zinc-300'
                                }`}
                            >
                                {getRoleLabel(r)}
                            </button>
                        ))}
                    </div>

                    <div className="space-y-4 relative z-10">
                        {/* Login Form for ALL Roles */}
                        <div>
                            <label className="block text-xs font-medium text-amber-500/80 mb-1">
                                {role === 'leader' ? 'รหัสหัวสาย (Leader ID)' : role === 'owner' ? 'รหัสเจ้าของ (Owner ID)' : 'รหัสคนคีย์ (Operator ID)'}
                            </label>
                            <div className="relative">
                                <User className="absolute left-3 top-3 w-5 h-5 text-zinc-600" />
                                <input 
                                    type="text" 
                                    value={username}
                                    onChange={(e) => setUsername(e.target.value)}
                                    className="w-full pl-10 pr-4 py-3 rounded-lg bg-zinc-950 border border-zinc-800 text-zinc-100 focus:ring-1 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all placeholder-zinc-700 uppercase"
                                    placeholder={role === 'leader' ? "เช่น L88" : role === 'owner' ? "เช่น ADMIN" : "เช่น OP1"}
                                />
                            </div>
                        </div>
                        <div>
                            <label className="block text-xs font-medium text-amber-500/80 mb-1">รหัสผ่าน</label>
                            <div className="relative">
                                <Key className="absolute left-3 top-3 w-5 h-5 text-zinc-600" />
                                <input 
                                    type="password" 
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full pl-10 pr-4 py-3 rounded-lg bg-zinc-950 border border-zinc-800 text-zinc-100 focus:ring-1 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all placeholder-zinc-700"
                                    placeholder="••••"
                                />
                            </div>
                        </div>

                        {error && (
                            <div className="text-red-500 text-xs text-center font-medium bg-red-500/10 py-2 rounded-lg border border-red-500/20">
                                {error}
                            </div>
                        )}

                        <button 
                            onClick={handleLoginSubmit}
                            className="w-full bg-gradient-to-r from-amber-600 via-yellow-500 to-amber-600 text-black font-bold py-3.5 rounded-xl shadow-lg shadow-amber-900/20 hover:shadow-amber-500/20 transition-all active:scale-95 flex items-center justify-center gap-2"
                        >
                            เข้าสู่ระบบ ({getRoleLabel(role)})
                        </button>
                    </div>
                </div>
                </div>
            );
        };

        // 2. Operator View
        const OperatorView = ({ onLogout, onAddTransaction, onUpdateTransaction, onDeleteTransaction, transactions, user }) => {
            const [number, setNumber] = useState('');
            const [amount, setAmount] = useState('');
            const [selectedTypes, setSelectedTypes] = useState(['2top']); 
            
            // Auto-fill Leader ID from logged-in user info
            const [leaderId, setLeaderId] = useState(user?.leaderId || 'L88'); 
            
            const [customerName, setCustomerName] = useState('');
            const [customerPhone, setCustomerPhone] = useState('');
            const [showSuggestions, setShowSuggestions] = useState(false);

            // States for Customer History Modal
            const [showCustomerList, setShowCustomerList] = useState(false);
            const [selectedHistoryCustomer, setSelectedHistoryCustomer] = useState(null);

            // States for Edit Transaction Modal
            const [editingTx, setEditingTx] = useState(null);
            const [editNumber, setEditNumber] = useState('');
            const [editAmount, setEditAmount] = useState('');
            const [editType, setEditType] = useState('');

            // States for Edit History Modal
            const [historyTx, setHistoryTx] = useState(null);

            const [showToast, setShowToast] = useState(false);
            const [toastMessage, setToastMessage] = useState('');

            // Group Definitions - REVISED
            const group2 = ['2top', '2bottom', '2tod']; 
            const group3 = ['3top', '3tod', '3bottom']; 
            const groupRun = ['runTop', 'runBottom']; 

            // Calculate Operator's own transactions
            const myTransactions = useMemo(() => {
                return (transactions || []).filter(tx => tx.sender === (user?.username || 'Operator')).sort((a,b) => b.id - a.id);
            }, [transactions, user]);

            const myRecentTransactions = myTransactions.slice(0, 5);

            // Extract unique customers
            const uniqueCustomers = useMemo(() => {
                const customers = {};
                myTransactions.forEach(tx => {
                    if (tx.customerName) {
                        if (!customers[tx.customerName]) {
                            customers[tx.customerName] = { 
                                name: tx.customerName, 
                                phone: tx.customerPhone || '',
                                totalSpent: 0,
                                lastTx: tx.timestamp
                            };
                        }
                        customers[tx.customerName].totalSpent += (tx.amount || 0);
                    }
                });
                return Object.values(customers).sort((a,b) => b.totalSpent - a.totalSpent);
            }, [myTransactions]);

            // Filter suggestions
            const customerSuggestions = useMemo(() => {
                if (!customerName) return [];
                return uniqueCustomers.filter(c => c.name.includes(customerName) && c.name !== customerName);
            }, [customerName, uniqueCustomers]);

            // Transactions for selected history customer
            const historyCustomerTransactions = useMemo(() => {
                if (!selectedHistoryCustomer) return [];
                return myTransactions.filter(tx => tx.customerName === selectedHistoryCustomer.name);
            }, [myTransactions, selectedHistoryCustomer]);

            // Determine current max length based on selection
            const currentMaxLength = useMemo(() => {
                if (selectedTypes.length > 0) {
                    if (group2.includes(selectedTypes[0])) return 2;
                    if (groupRun.includes(selectedTypes[0])) return 1; 
                }
                return 3; 
            }, [selectedTypes]);

            // Adjust number when switching groups
            useEffect(() => {
                if (number.length > currentMaxLength) {
                    setNumber(number.slice(0, currentMaxLength));
                }
            }, [currentMaxLength, number]);

            const handleSave = () => {
                if (!number || !amount || selectedTypes.length === 0 || !leaderId || !customerName || !customerPhone) return;

                const numericAmount = parseInt(amount, 10);
                if(isNaN(numericAmount) || numericAmount <= 0) return;
                
                const newTxList = [];
                const now = new Date();
                const timestampStr = now.toLocaleString('th-TH', { 
                    year: 'numeric', month: '2-digit', day: '2-digit', 
                    hour: '2-digit', minute: '2-digit', second: '2-digit',
                    hour12: false 
                });

                selectedTypes.forEach(type => {
                    newTxList.push({
                        number: number,
                        amount: numericAmount,
                        type: getTypeLabel(type),
                        leaderId: leaderId.toUpperCase(),
                        customerName: customerName,
                        customerPhone: customerPhone,
                        sender: user?.username || 'Operator',
                        timestamp: timestampStr
                    });
                });

                onAddTransaction(newTxList);

                setNumber('');
                setAmount('');
                
                setToastMessage('บันทึกสำเร็จ');
                setShowToast(true);
                setTimeout(() => setShowToast(false), 2000);
            };

            const selectCustomer = (cust) => {
                setCustomerName(cust.name);
                setCustomerPhone(cust.phone);
                setShowSuggestions(false);
            };

            const toggleType = (value) => {
                setSelectedTypes(prev => {
                    if (prev.includes(value)) {
                        if (prev.length === 1) return prev; 
                        return prev.filter(t => t !== value);
                    }

                    const isGroup2 = group2.includes(value);
                    const isGroupRun = groupRun.includes(value);
                    
                    const hasGroup2 = prev.some(t => group2.includes(t));
                    const hasGroup3 = prev.some(t => group3.includes(t));
                    const hasGroupRun = prev.some(t => groupRun.includes(t));

                    if (isGroup2) {
                        if (hasGroup3 || hasGroupRun) return [value];
                        return [...prev, value];
                    }
                    
                    if (isGroupRun) {
                        if (hasGroup2 || hasGroup3) return [value];
                        return [...prev, value];
                    }

                    if (hasGroup2 || hasGroupRun) return [value];
                    return [...prev, value];
                });
            };

            const handleEditClick = (tx) => {
                setEditingTx(tx);
                setEditNumber(tx.number);
                setEditAmount(tx.amount.toString());
                setEditType(tx.type); 
            };

            const handleUpdateSave = () => {
                if (!editingTx || !editNumber || !editAmount) return;
                const numAmount = parseInt(editAmount, 10);
                if(isNaN(numAmount) || numAmount <= 0) return;

                onUpdateTransaction({
                    ...editingTx,
                    number: editNumber,
                    amount: numAmount,
                });

                setEditingTx(null);
                setToastMessage('แก้ไขรายการสำเร็จ');
                setShowToast(true);
                setTimeout(() => setShowToast(false), 2000);
            };

            const handleDeleteClick = (id) => {
                if (window.confirm('ยืนยันการลบรายการนี้?')) {
                    onDeleteTransaction(id);
                    setToastMessage('ลบรายการสำเร็จ');
                    setShowToast(true);
                    setTimeout(() => setShowToast(false), 2000);
                }
            };

            const getTypeLabel = (t) => {
                switch(t) {
                case '2top': return '2 ตัวบน';
                case '2bottom': return '2 ตัวล่าง';
                case '2tod': return '2 ตัวโต๊ด'; 
                case '3top': return '3 ตัวบน';
                case '3tod': return '3 ตัวโต๊ด';
                case '3bottom': return '3 ตัวล่าง';
                case 'runTop': return 'วิ่งบน';
                case 'runBottom': return 'วิ่งล่าง';
                default: return t;
                }
            };

            const TypeButton = ({ value, label, subLabel }) => {
                const isSelected = selectedTypes.includes(value);
                return (
                <button
                    onClick={() => toggleType(value)}
                    className={`flex-1 p-3 rounded-xl border transition-all duration-200 flex flex-col items-center justify-center relative overflow-hidden group ${
                    isSelected
                        ? 'border-amber-500 bg-amber-500/20 text-amber-400 shadow-[0_0_15px_rgba(245,158,11,0.3)]' 
                        : 'border-zinc-800 bg-zinc-900 text-zinc-500 hover:bg-zinc-800 hover:border-zinc-700'
                    }`}
                >
                    <span className={`font-bold text-sm sm:text-base tracking-wide ${isSelected ? 'scale-105' : ''}`}>{label}</span>
                    {subLabel && <span className="text-[10px] opacity-70">{subLabel}</span>}
                    {isSelected && (
                    <div className="absolute top-1 right-1 animate-in zoom-in duration-200">
                        <CheckCircle2 className="w-3 h-3 text-amber-500" />
                    </div>
                    )}
                </button>
                );
            };

            const projectedCount = selectedTypes.length;

            return (
                <div className="min-h-screen bg-zinc-950 pb-20 text-zinc-100 font-sans">
                {/* Header */}
                <div className="bg-zinc-900/80 backdrop-blur border-b border-zinc-800 px-4 py-3 sticky top-0 z-10 flex justify-between items-center">
                    <div>
                    <h2 className="font-bold text-amber-500 text-lg flex items-center gap-2">
                        <Crown className="w-5 h-5" /> GRAND
                    </h2>
                    <span className="text-xs text-zinc-500 flex items-center gap-1">
                        <Clock className="w-3 h-3 text-amber-600" /> ปิดรับ 10:00 น.
                    </span>
                    </div>
                    <div className="flex items-center gap-2">
                        <div className="text-right hidden sm:block">
                            <div className="text-xs text-zinc-400">{user?.name || 'Operator'}</div>
                            <div className="text-[10px] text-amber-500">ID: {user?.username}</div>
                        </div>
                        <button onClick={onLogout} className="p-2 bg-zinc-800 rounded-full text-zinc-400 hover:text-white border border-zinc-700">
                            <LogOut className="w-5 h-5" />
                        </button>
                    </div>
                </div>

                <div className="p-4 max-w-md mx-auto space-y-4">

                    {/* 1. ROUTING */}
                    <div className="bg-zinc-900 rounded-2xl p-4 shadow-xl border border-zinc-800">
                        <div className="flex items-center justify-between gap-2 mb-3 text-amber-500/80">
                            <div className="flex items-center gap-2">
                                <Send className="w-4 h-4" />
                                <span className="text-xs font-bold uppercase tracking-widest">ข้อมูลการส่งโพย</span>
                            </div>
                            <button 
                                onClick={() => setShowCustomerList(true)}
                                className="flex items-center gap-1 bg-zinc-800 hover:bg-zinc-700 px-2 py-1 rounded-md text-[10px] text-zinc-300 border border-zinc-700 transition-colors"
                            >
                                <BookUser className="w-3 h-3" />
                                รายชื่อลูกค้า
                            </button>
                        </div>
                        
                        <div className="space-y-3">
                            <div>
                                <label className="block text-[10px] font-medium text-zinc-500 mb-1">
                                    ส่งเข้าหัวสาย (Leader ID) <span className="text-red-500">*</span>
                                </label>
                                <div className="relative">
                                    <div className="absolute left-3 top-2.5 text-amber-500 font-bold text-xs">ID:</div>
                                    <input 
                                        type="text" 
                                        value={leaderId}
                                        readOnly // Lock the leader ID based on login
                                        className="w-full pl-10 pr-4 py-2 bg-zinc-950/50 border border-zinc-800 rounded-lg text-zinc-400 font-mono font-bold outline-none cursor-not-allowed uppercase"
                                    />
                                    <div className="absolute right-3 top-2.5 text-zinc-600 text-[10px]">
                                        <Lock size={12} />
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-3 pt-1 border-t border-zinc-800/50">
                                <div className="relative">
                                    <label className="block text-[10px] font-medium text-zinc-500 mb-1">
                                        ชื่อลูกค้า <span className="text-red-500">*</span>
                                    </label>
                                    <input 
                                        type="text" 
                                        value={customerName}
                                        onChange={(e) => {
                                            setCustomerName(e.target.value);
                                            setShowSuggestions(true);
                                        }}
                                        onFocus={() => setShowSuggestions(true)}
                                        placeholder="ระบุชื่อ"
                                        className="w-full px-3 py-2 bg-zinc-950 border border-zinc-800 rounded-lg text-zinc-300 text-xs focus:border-zinc-600 outline-none transition-colors"
                                    />
                                    {/* Customer Autocomplete Dropdown */}
                                    {showSuggestions && customerSuggestions.length > 0 && (
                                        <div className="absolute top-full left-0 right-0 z-50 bg-zinc-800 border border-zinc-700 rounded-lg mt-1 shadow-xl max-h-40 overflow-y-auto">
                                            {customerSuggestions.map((cust, idx) => (
                                                <div 
                                                    key={idx}
                                                    onClick={() => selectCustomer(cust)}
                                                    className="px-3 py-2 hover:bg-zinc-700 cursor-pointer text-xs text-zinc-300 flex justify-between"
                                                >
                                                    <span>{cust.name}</span>
                                                    <span className="text-zinc-500 text-[10px]">{cust.phone}</span>
                                                </div>
                                            ))}
                                        </div>

                                </div>
                                <div>
                                    <label className="block text-[10px] font-medium text-zinc-500 mb-1">

                                        type="tel" 
                                        value={customerPhone}
                                        onChange={(e) => setCustomerPhone(e.target.value)}

                                    />
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    {/* 2. BETTING INPUT */}
                    <div className="bg-zinc-900 rounded-2xl p-5 shadow-xl border border-zinc-800 space-y-5 relative overflow-hidden">
                        <div className="space-y-2">
                            {/* 2 Digits Group */}
                            <div className="grid grid-cols-3 gap-2">
                                <TypeButton value="2top" label="2 บน" />
                                <TypeButton value="2bottom" label="2 ล่าง" />
                                <TypeButton value="2tod" label="2 โต๊ด" />
                            </div>
                            {/* 3 Digits Group - Updated with 3Bottom */}
                            <div className="grid grid-cols-3 gap-2">
                                <TypeButton value="3top" label="3 บน" />
                                <TypeButton value="3bottom" label="3 ล่าง" />
                                <TypeButton value="3tod" label="3 โต๊ด" />
                            </div>
                            {/* Run Group */}
                            <div className="grid grid-cols-2 gap-2">
                                <TypeButton value="runTop" label="วิ่งบน" />
                                <TypeButton value="runBottom" label="วิ่งล่าง" />
                            </div>
                        </div>

                        <div className="grid grid-cols-5 gap-3 items-end">
                            <div className="col-span-3">
                                <label className="text-xs font-semibold text-zinc-500 ml-1 mb-1 flex justify-between">
                                    <span>ตัวเลข ({currentMaxLength} หลัก)</span>
                                </label>
                                <div className="relative">
                                    <input 
                                    type="tel" 
                                    value={number}
                                    onChange={(e) => setNumber(e.target.value.replace(/[^0-9]/g, '').slice(0, currentMaxLength))} 
                                    placeholder={currentMaxLength === 2 ? "00" : (currentMaxLength === 1 ? "0" : "000")}
                                    className="w-full text-4xl font-bold text-center py-4 bg-zinc-950 border-b border-zinc-700 focus:border-amber-500 outline-none rounded-t-lg tracking-[0.2em] text-white placeholder-zinc-800 transition-colors"
                                    />
                                </div>
                            </div>
                            <div className="col-span-2">
                                <label className="text-xs font-semibold text-zinc-500 ml-1 mb-1 block">ราคา (บาท)</label>
                                <input 
                                type="tel" 
                                value={amount}
                                onChange={(e) => setAmount(e.target.value.replace(/[^0-9]/g, ''))} 
                                placeholder="0"
                                className="w-full text-4xl font-bold text-center py-4 bg-zinc-950 border-b border-zinc-700 focus:border-amber-500 outline-none rounded-t-lg text-amber-400 placeholder-zinc-800 transition-colors"
                                />
                            </div>
                        </div>

                        <div className="pt-2">
                            <button 
                            onClick={handleSave}
                            className="w-full bg-gradient-to-r from-amber-600 via-yellow-500 to-amber-600 active:from-amber-700 active:to-amber-700 text-black py-4 rounded-xl text-lg font-bold shadow-lg shadow-amber-900/20 flex items-center justify-center gap-2 transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:grayscale"
                            disabled={!number || !amount || selectedTypes.length === 0 || !leaderId || !customerName || !customerPhone}
                            >
                            {projectedCount > 1 ? (
                                <>
                                <Layers className="w-5 h-5" />
                                บันทึก {projectedCount} รายการ
                                </>
                            ) : (
                                <>
                                <Save className="w-5 h-5" />
                                บันทึก
                                </>
                            )}
                            </button>
                        </div>
                    </div>

                    {/* Recent Transactions */}
                    <div>
                        <div className="flex justify-between items-center px-2 mb-2 border-b border-zinc-800 pb-2">
                            <h3 className="font-semibold text-zinc-400 text-sm uppercase tracking-wider flex items-center gap-2">
                                <History className="w-4 h-4" />
                                รายการล่าสุด (สด)
                            </h3>
                        </div>
                        {myRecentTransactions.length === 0 ? (
                            <div className="text-center py-8 text-zinc-600 text-sm">ยังไม่มีรายการล่าสุด</div>
                        ) : (
                            <div className="bg-zinc-900 rounded-2xl shadow-lg border border-zinc-800 overflow-hidden divide-y divide-zinc-800">
                                {myRecentTransactions.map((tx) => (
                                    <div key={tx.id} className="p-4 flex justify-between items-center hover:bg-zinc-800/50 transition-colors group">
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center font-bold text-white text-lg shadow-inner border border-zinc-700 shrink-0">
                                                {tx.number}
                                            </div>
                                            <div>
                                                <div className="text-sm font-medium text-zinc-200">{tx.type}</div>
                                                <div className="flex items-center gap-2 mb-1">
                                                    <span className="text-xs text-zinc-500 flex items-center gap-1">
                                                        <CalendarDays className="w-3 h-3" /> {tx.timestamp}
                                                    </span>
                                                    <span className="text-[10px] bg-zinc-800 text-amber-500 px-1.5 rounded border border-zinc-700">
                                                        ส่งไป: {tx.leaderId}
                                                    </span>
                                                </div>
                                                {/* Added Customer Details */}
                                                <div className="flex items-center gap-1 text-[10px] text-zinc-400">
                                                    <User size={10} />
                                                    <span>{tx.customerName}</span>
                                                    {tx.customerPhone && <span className="text-zinc-600">({tx.customerPhone})</span>}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <div className="font-bold text-amber-400 font-mono tracking-tight">
                                                +{formatCurrency(tx.amount).replace('฿','')}
                                            </div>
                                            {/* EDIT & DELETE BUTTONS & HISTORY BUTTON */}
                                            <div className="flex gap-1 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                                                {tx.editHistory && tx.editHistory.length > 0 && (
                                                    <button 
                                                        onClick={() => setHistoryTx(tx)}
                                                        className="bg-zinc-700 p-1.5 rounded text-zinc-300 hover:text-white hover:bg-orange-600 transition-colors"
                                                        title="ดูประวัติการแก้ไข"
                                                    >
                                                        <FileClock size={14} />
                                                    </button>
                                                )}
                                                <button 
                                                    onClick={() => handleEditClick(tx)}
                                                    className="bg-zinc-700 p-1.5 rounded text-zinc-300 hover:text-white hover:bg-blue-600 transition-colors"
                                                >
                                                    <Pencil size={14} />
                                                </button>
                                                <button 
                                                    onClick={() => handleDeleteClick(tx.id)}
                                                    className="bg-zinc-700 p-1.5 rounded text-zinc-300 hover:text-white hover:bg-red-600 transition-colors"
                                                >
                                                    <Trash2 size={14} />
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>

                {/* --- CUSTOMER LIST MODAL --- */}
                {showCustomerList && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                        <div className="bg-zinc-900 w-full max-w-md rounded-2xl border border-amber-500/20 shadow-2xl flex flex-col max-h-[80vh]">
                            <div className="flex justify-between items-center p-4 border-b border-zinc-800">
                                <h3 className="font-bold text-white flex items-center gap-2">
                                    <BookUser className="w-5 h-5 text-amber-500" />
                                    สมุดรายชื่อลูกค้า
                                </h3>
                                <button onClick={() => setShowCustomerList(false)} className="text-zinc-500 hover:text-white transition-colors">
                                    <X className="w-6 h-6" />
                                </button>
                            </div>
                            <div className="p-4 overflow-y-auto custom-scrollbar">
                                {uniqueCustomers.length === 0 ? (
                                    <div className="text-center py-8 text-zinc-600 border border-zinc-800 border-dashed rounded-lg text-xs">
                                        ยังไม่มีประวัติลูกค้า
                                    </div>
                                ) : (
                                    <div className="space-y-2">
                                        {uniqueCustomers.map((cust, idx) => (
                                            <div 
                                                key={idx} 
                                                onClick={() => setSelectedHistoryCustomer(cust)}
                                                className="bg-zinc-950 p-3 rounded-lg border border-zinc-800 flex justify-between items-center cursor-pointer hover:bg-zinc-800 transition-colors"
                                            >
                                                <div>
                                                    <div className="text-sm font-bold text-zinc-200">{cust.name}</div>
                                                    <div className="text-xs text-zinc-500">{cust.phone || 'ไม่ระบุเบอร์'}</div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-xs text-amber-500 font-mono">{formatCurrency(cust.totalSpent)}</div>
                                                    <div className="text-[10px] text-zinc-600">ยอดสะสม</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                )}

                {/* --- CUSTOMER HISTORY DETAIL MODAL --- */}
                {selectedHistoryCustomer && (
                    <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm">
                        <div className="bg-zinc-900 w-full max-w-md rounded-2xl border border-amber-500/20 shadow-2xl flex flex-col max-h-[80vh]">
                            <div className="flex justify-between items-center p-4 border-b border-zinc-800 bg-zinc-900 rounded-t-2xl">
                                <div>
                                    <h3 className="font-bold text-white flex items-center gap-2">
                                        <History className="w-5 h-5 text-amber-500" />
                                        ประวัติ: <span className="text-amber-100">{selectedHistoryCustomer.name}</span>
                                    </h3>
                                    <div className="text-xs text-zinc-500 mt-1">{selectedHistoryCustomer.phone}</div>
                                </div>
                                <button onClick={() => setSelectedHistoryCustomer(null)} className="text-zinc-500 hover:text-white transition-colors bg-zinc-800 p-1 rounded-full">
                                    <X className="w-5 h-5" />
                                </button>
                            </div>
                            <div className="p-4 overflow-y-auto custom-scrollbar bg-zinc-950">
                                {historyCustomerTransactions.length === 0 ? (
                                    <p className="text-center text-zinc-500">ไม่พบรายการ</p>
                                ) : (
                                    <div className="space-y-2">
                                        {historyCustomerTransactions.map(tx => (
                                            <div key={tx.id} className="bg-zinc-900 p-3 rounded-lg border border-zinc-800 flex justify-between items-center">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center font-bold text-white text-lg shadow-inner border border-zinc-700">
                                                        {tx.number}
                                                    </div>
                                                    <div>
                                                        <div className="text-sm text-zinc-300 font-medium">{tx.type}</div>
                                                        <div className="text-[10px] text-zinc-500 flex items-center gap-1">
                                                            <CalendarDays className="w-3 h-3" /> {tx.timestamp}
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="font-bold text-amber-500 text-lg font-mono tracking-tight">{formatCurrency(tx.amount)}</div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <div className="p-4 border-t border-zinc-800 bg-zinc-900 rounded-b-2xl">
                                <div className="flex justify-between items-center text-sm font-bold">
                                    <span className="text-zinc-400">ยอดรวมทั้งหมด</span>
                                    <span className="text-white text-lg">{formatCurrency(selectedHistoryCustomer.totalSpent)}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                )}

                {/* --- EDIT TRANSACTION MODAL --- */}
                {editingTx && (
                    <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                        <div className="bg-zinc-900 w-full max-w-sm rounded-2xl border border-amber-500/20 shadow-2xl animate-in zoom-in-95 duration-200">
                            <div className="flex justify-between items-center p-4 border-b border-zinc-800">
                                <h3 className="font-bold text-white flex items-center gap-2">
                                    <Pencil className="w-5 h-5 text-amber-500" />
                                    แก้ไขรายการ
                                </h3>
                                <button onClick={() => setEditingTx(null)} className="text-zinc-500 hover:text-white transition-colors">
                                    <X className="w-6 h-6" />
                                </button>
                            </div>
                            <div className="p-6 space-y-4">
                                <div>
                                    <label className="block text-xs font-medium text-zinc-400 mb-1">ตัวเลข</label>
                                    <input 
                                        type="tel" 
                                        value={editNumber}
                                        onChange={(e) => setEditNumber(e.target.value.replace(/[^0-9]/g, ''))}
                                        className="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white focus:border-amber-500 outline-none text-center text-xl font-bold tracking-widest"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-zinc-400 mb-1">ราคา</label>
                                    <input 
                                        type="tel" 
                                        value={editAmount}
                                        onChange={(e) => setEditAmount(e.target.value.replace(/[^0-9]/g, ''))}
                                        className="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white focus:border-amber-500 outline-none text-center text-xl font-bold text-amber-500"
                                    />
                                </div>
                                <div className="text-center text-xs text-zinc-500 pt-2">
                                    ประเภท: {editingTx.type} (ไม่สามารถเปลี่ยนประเภทได้)
                                </div>
                            </div>
                            <div className="p-4 pt-0 flex gap-3">
                                <button 
                                    onClick={() => setEditingTx(null)}
                                    className="flex-1 py-3 rounded-xl border border-zinc-700 text-zinc-400 font-medium hover:bg-zinc-800 transition-colors"
                                >
                                    ยกเลิก
                                </button>
                                <button 
                                    onClick={handleUpdateSave}
                                    className="flex-1 py-3 rounded-xl bg-amber-500 text-black font-bold hover:bg-amber-400 transition-colors"
                                >
                                    บันทึกการแก้ไข
                                </button>
                            </div>
                        </div>
                    </div>
                )}

                {/* --- EDIT HISTORY MODAL (NEW) --- */}
                {historyTx && (
                    <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                        <div className="bg-zinc-900 w-full max-w-sm rounded-2xl border border-amber-500/20 shadow-2xl animate-in zoom-in-95 duration-200">
                            <div className="flex justify-between items-center p-4 border-b border-zinc-800">
                                <h3 className="font-bold text-white flex items-center gap-2">
                                    <FileClock className="w-5 h-5 text-amber-500" />
                                    ประวัติการแก้ไข
                                </h3>
                                <button onClick={() => setHistoryTx(null)} className="text-zinc-500 hover:text-white transition-colors">
                                    <X className="w-6 h-6" />
                                </button>
                            </div>
                            <div className="p-4 max-h-[60vh] overflow-y-auto custom-scrollbar">
                                {(!historyTx.editHistory || historyTx.editHistory.length === 0) ? (
                                    <p className="text-center text-zinc-500 text-xs py-4">ไม่มีประวัติการแก้ไข</p>
                                ) : (
                                    <div className="space-y-3">
                                        {historyTx.editHistory.map((log, i) => (
                                            <div key={i} className="bg-zinc-950 p-3 rounded-lg border border-zinc-800">
                                                <div className="flex justify-between items-center text-[10px] text-zinc-500 mb-2">
                                                    <span>{log.timestamp}</span>
                                                    <span>โดย {log.editor}</span>
                                                </div>
                                                <div className="flex justify-between items-center">
                                                    <div className="text-xs text-zinc-300">
                                                        <span className="block text-[10px] text-zinc-500">เลขเดิม</span>
                                                        {log.prevNumber}
                                                    </div>
                                                    <div className="text-xs text-amber-500 font-mono text-right">
                                                        <span className="block text-[10px] text-zinc-500">ราคาเดิม</span>
                                                        {formatCurrency(log.prevAmount)}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                )}

                {showToast && (
                    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-amber-500 text-black px-6 py-3 rounded-full shadow-2xl shadow-amber-500/20 flex items-center gap-2 animate-bounce-short z-[80] font-bold whitespace-nowrap">
                    <CheckCircle2 className="w-5 h-5" />
                    <span>{toastMessage}</span>
                    </div>
                )}
                </div>
            );
        };

        // 3. Leader Dashboard
        const LeaderDashboard = ({ onLogout, transactions, leaderData, onAddOperator, myOperators }) => {
            const [searchTerm, setSearchTerm] = useState('');
            const [showAddOperatorModal, setShowAddOperatorModal] = useState(false);
            const [selectedCustomer, setSelectedCustomer] = useState(null); 
            
            // Add Operator Form State
            const [newOpName, setNewOpName] = useState('');
            const [newOpId, setNewOpId] = useState('');
            const [newOpPassword, setNewOpPassword] = useState('');
            const [showToast, setShowToast] = useState(false);

            const myLeaderId = leaderData?.id || "ไม่ระบุ";
            const myLeaderName = leaderData?.name || "หัวสาย";
            
            // Safe filter
            const myTransactions = (transactions || []).filter(tx => tx.leaderId === myLeaderId);
            
            const totalSales = myTransactions.reduce((sum, tx) => sum + (tx.amount || 0), 0);
            const activeAgents = [...new Set(myTransactions.map(tx => tx.customerName))].length; 

            const handleSaveOperator = () => {
                if(!newOpName || !newOpId || !newOpPassword) return;
                
                onAddOperator({
                    name: newOpName,
                    username: newOpId,
                    password: newOpPassword,
                    leaderId: myLeaderId
                });

                setShowAddOperatorModal(false);
                setNewOpName('');
                setNewOpId('');
                setNewOpPassword('');
                setShowToast(true);
                setTimeout(() => setShowToast(false), 3000);
            };

            const numberStats = useMemo(() => {
                const stats = {};
                myTransactions.forEach(tx => {
                    if (!stats[tx.number]) stats[tx.number] = 0;
                    stats[tx.number] += (tx.amount || 0);
                });
                return Object.entries(stats)
                    .sort(([, a], [, b]) => b - a)
                    .slice(0, 4)
                    .map(([number, amount]) => ({ number, amount, risk: amount > 5000 ? 'high' : 'medium' }));
            }, [myTransactions]);

            const customerStats = useMemo(() => {
                const stats = {};
                myTransactions.forEach(tx => {
                    const key = tx.customerName || 'ไม่ระบุชื่อ';
                    if (!stats[key]) stats[key] = { name: key, totalSales: 0, count: 0 };
                    stats[key].totalSales += (tx.amount || 0);
                    stats[key].count += 1;
                });
                return Object.values(stats)
                    .filter(c => c.name.toLowerCase().includes(searchTerm.toLowerCase()))
                    .sort((a, b) => b.totalSales - a.totalSales);
            }, [myTransactions, searchTerm]);

            const customerTransactions = useMemo(() => {
                if (!selectedCustomer) return [];
                return myTransactions.filter(tx => tx.customerName === selectedCustomer).sort((a,b) => b.id - a.id);
            }, [myTransactions, selectedCustomer]);

            return (
                <div className="min-h-screen bg-zinc-950 text-zinc-100 font-sans">
                    <div className="bg-gradient-to-b from-zinc-900 to-zinc-950 p-6 pb-12 rounded-b-[2rem] border-b border-zinc-800 relative">
                        <div className="flex justify-between items-start mb-6">
                            <div>
                                <h1 className="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-yellow-400 to-amber-200 flex items-center gap-2">
                                    {myLeaderName} <Crown className="w-5 h-5 text-amber-500 fill-amber-500/20" />
                                </h1>
                                <div className="flex items-center gap-2 mt-1">
                                    <span className="bg-zinc-800 text-amber-500 text-[10px] px-2 py-0.5 rounded border border-zinc-700 font-mono tracking-wider">
                                        ID: {myLeaderId}
                                    </span>
                                    <span className="text-zinc-500 text-xs">| ดูข้อมูลสด</span>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => setShowAddOperatorModal(true)}
                                    className="bg-zinc-800 border border-zinc-700 p-2 rounded-lg hover:bg-zinc-700 transition-colors text-amber-500"
                                    title="เพิ่มคนคีย์"
                                >
                                    <UserPlus className="w-5 h-5" />
                                </button>
                                <button onClick={onLogout} className="bg-zinc-800 border border-zinc-700 p-2 rounded-lg hover:bg-zinc-700 transition-colors text-zinc-400">
                                    <LogOut className="w-5 h-5" />
                                </button>
                            </div>
                        </div>
                        
                        <div className="absolute -bottom-10 left-4 right-4 grid grid-cols-2 gap-3">
                            <div className="bg-zinc-900 p-4 rounded-xl shadow-xl shadow-black border border-amber-500/30 backdrop-blur-sm">
                                <div className="text-xs text-zinc-500 mb-1">ยอดขายของฉัน</div>
                                <div className="text-xl font-bold text-white">{formatCurrency(totalSales)}</div>
                            </div>
                            <div className="bg-zinc-900 p-4 rounded-xl shadow-xl shadow-black border border-zinc-800 backdrop-blur-sm">
                                <div className="text-xs text-zinc-500 mb-1">จำนวนลูกค้า</div>
                                <div className="text-xl font-bold text-white">{activeAgents}</div>
                            </div>
                        </div>
                    </div>

                    <div className="mt-14 p-4 space-y-6 max-w-2xl mx-auto">
                        
                        {/* Live Risk Section */}
                        <div className="space-y-3">
                            <h3 className="font-bold text-zinc-400 flex items-center gap-2 text-sm uppercase tracking-wider">
                                <AlertTriangle className="w-4 h-4 text-red-500" />
                                เลขเสี่ยง (ยอดนิยม)
                            </h3>
                            {numberStats.length === 0 ? (
                                <div className="text-center py-4 text-zinc-600 border border-zinc-800 border-dashed rounded-lg text-xs">กำลังรอข้อมูล...</div>
                            ) : (
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                    {numberStats.map((item, idx) => (
                                        <div key={idx} className={`p-3 rounded-lg border backdrop-blur-sm ${
                                            item.risk === 'high' 
                                            ? 'bg-red-950/20 border-red-900/50 text-red-400' 
                                            : 'bg-amber-950/20 border-amber-900/50 text-amber-400'
                                        }`}>
                                            <div className="text-2xl font-black text-center tracking-wider text-white">{item.number}</div>
                                            <div className={`text-xs text-center font-medium opacity-80`}>
                                                {formatCurrency(item.amount)}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* My Operators List */}
                        <div className="space-y-3">
                            <h3 className="font-bold text-zinc-400 text-sm uppercase tracking-wider flex items-center gap-2">
                                <Briefcase className="w-4 h-4" />
                                คนคีย์ของฉัน
                            </h3>
                            {myOperators && myOperators.length > 0 ? (
                                <div className="grid grid-cols-2 gap-3">
                                    {myOperators.map((op, idx) => (
                                        <div key={idx} className="bg-zinc-900 p-3 rounded-lg border border-zinc-800 flex justify-between items-center">
                                            <div>
                                                <div className="text-sm font-bold text-zinc-300">{op.name}</div>
                                                <div className="text-xs text-zinc-500">ID: {op.username}</div>
                                            </div>
                                            <div className="text-xs text-amber-500 font-mono">PW: {op.password}</div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="text-center py-4 text-zinc-600 border border-zinc-800 border-dashed rounded-lg text-xs">
                                    ยังไม่มีคนคีย์
                                </div>
                            )}
                        </div>

                        {/* Transactions List */}
                        <div className="space-y-3">
                            <div className="flex justify-between items-end">
                                <h3 className="font-bold text-zinc-400 text-sm uppercase tracking-wider">รายการเข้า</h3>
                                <div className="relative w-40">
                                    <Search className="w-4 h-4 absolute left-3 top-2.5 text-zinc-500" />
                                    <input 
                                        type="text"
                                        placeholder="ค้นหาชื่อ..." 
                                        className="w-full pl-9 pr-3 py-2 bg-zinc-900 border border-zinc-800 rounded-lg text-sm focus:ring-1 focus:ring-amber-500 text-zinc-200 outline-none placeholder-zinc-700"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                    />
                                </div>
                            </div>
                            
                            <div className="bg-zinc-900 rounded-xl shadow-lg border border-zinc-800 overflow-hidden">
                                <div className="grid grid-cols-12 bg-zinc-950/50 p-3 text-xs font-semibold text-zinc-500 border-b border-zinc-800 uppercase">
                                    <div className="col-span-6">ลูกค้า</div>
                                    <div className="col-span-4 text-right">ยอดเงิน</div>
                                    <div className="col-span-2 text-center">รายการ</div>
                                </div>
                                {customerStats.length === 0 ? (
                                    <div className="p-8 text-center text-zinc-600 text-sm">ไม่มีข้อมูลรายการเข้าสำหรับหัวสาย {myLeaderId}</div>
                                ) : (
                                    <div className="divide-y divide-zinc-800 max-h-[400px] overflow-y-auto">
                                        {customerStats.map((child, idx) => (
                                            <div 
                                                key={idx} 
                                                onClick={() => setSelectedCustomer(child.name)} // Make clickable
                                                className="grid grid-cols-12 p-4 items-center hover:bg-zinc-800/50 transition-colors cursor-pointer group"
                                            >
                                                <div className="col-span-6 font-medium text-zinc-300 group-hover:text-amber-400 flex items-center gap-2">
                                                    {child.name}
                                                    <FileText className="w-3 h-3 text-zinc-500 group-hover:text-amber-500 opacity-0 group-hover:opacity-100 transition-opacity" />
                                                </div>
                                                <div className="col-span-4 text-right font-bold text-white font-mono">
                                                    {formatCurrency(child.totalSales)}
                                                </div>
                                                <div className="col-span-2 text-center text-zinc-500 text-xs">
                                                    {child.count}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* CUSTOMER DETAIL MODAL */}
                    {selectedCustomer && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="bg-zinc-900 w-full max-w-md rounded-2xl border border-amber-500/20 shadow-2xl flex flex-col max-h-[80vh]">
                                <div className="flex justify-between items-center p-4 border-b border-zinc-800">
                                    <h3 className="font-bold text-white flex items-center gap-2">
                                        <User className="w-5 h-5 text-amber-500" />
                                        ประวัติ: <span className="text-amber-100">{selectedCustomer}</span>
                                    </h3>
                                    <button onClick={() => setSelectedCustomer(null)} className="text-zinc-500 hover:text-white transition-colors">
                                        <X className="w-6 h-6" />
                                    </button>
                                </div>
                                <div className="p-4 overflow-y-auto custom-scrollbar">
                                    {customerTransactions.length === 0 ? (
                                        <p className="text-center text-zinc-500">ไม่พบรายการ</p>
                                    ) : (
                                        <div className="space-y-2">
                                            {customerTransactions.map(tx => (
                                                <div key={tx.id} className="bg-zinc-950 p-3 rounded-lg border border-zinc-800 flex justify-between items-center">
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center font-bold text-white text-lg shadow-inner border border-zinc-700">
                                                            {tx.number}
                                                        </div>
                                                        <div>
                                                            <div className="text-sm text-zinc-300 font-medium">{tx.type}</div>
                                                            <div className="text-[10px] text-zinc-500 flex items-center gap-1">
                                                                <CalendarDays className="w-3 h-3" /> {tx.timestamp}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="font-bold text-amber-500 text-lg font-mono tracking-tight">{formatCurrency(tx.amount)}</div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                                <div className="p-4 border-t border-zinc-800 bg-zinc-900/50 rounded-b-2xl">
                                    <div className="flex justify-between items-center text-sm font-bold">
                                        <span className="text-zinc-400">ยอดรวมทั้งหมด</span>
                                        <span className="text-white text-lg">{formatCurrency(customerTransactions.reduce((s,t)=>s+t.amount,0))}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ADD OPERATOR MODAL */}
                    {showAddOperatorModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="bg-zinc-900 w-full max-w-md rounded-2xl border border-amber-500/20 shadow-2xl animate-in zoom-in-95 duration-200">
                                <div className="flex justify-between items-center p-6 border-b border-zinc-800">
                                    <h3 className="text-xl font-bold text-white flex items-center gap-2">
                                        <UserPlus className="w-5 h-5 text-amber-500" />
                                        เพิ่มคนคีย์ใหม่
                                    </h3>
                                    <button onClick={() => setShowAddOperatorModal(false)} className="text-zinc-500 hover:text-white transition-colors">
                                        <X className="w-6 h-6" />
                                    </button>
                                </div>
                                
                                <div className="p-6 space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-zinc-400 mb-1">รหัสคนคีย์ (Operator ID) <span className="text-red-500">*</span></label>
                                        <input 
                                            type="text" 
                                            value={newOpId}
                                            onChange={(e) => setNewOpId(e.target.value.toUpperCase())}
                                            className="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white focus:border-amber-500 outline-none transition-colors uppercase"
                                            placeholder="เช่น OP..."
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-zinc-400 mb-1">รหัสผ่าน <span className="text-red-500">*</span></label>
                                        <input 
                                            type="password" 
                                            value={newOpPassword}
                                            onChange={(e) => setNewOpPassword(e.target.value)}
                                            className="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white focus:border-amber-500 outline-none transition-colors"
                                            placeholder="ตั้งรหัสผ่าน"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-zinc-400 mb-1">ชื่อเรียก <span className="text-red-500">*</span></label>
                                        <input 
                                            type="text" 
                                            value={newOpName}
                                            onChange={(e) => setNewOpName(e.target.value)}
                                            className="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white focus:border-amber-500 outline-none transition-colors"
                                            placeholder="กรอกชื่อคนคีย์"
                                        />
                                    </div>
                                </div>

                                <div className="p-6 pt-0 flex gap-3">
                                    <button 
                                        onClick={() => setShowAddOperatorModal(false)}
                                        className="flex-1 py-3 rounded-xl border border-zinc-700 text-zinc-400 font-medium hover:bg-zinc-800 transition-colors"
                                    >
                                        ยกเลิก
                                    </button>
                                    <button 
                                        onClick={handleSaveOperator}
                                        className="flex-1 py-3 rounded-xl bg-amber-500 text-black font-bold hover:bg-amber-400 transition-colors shadow-lg shadow-amber-500/20"
                                    >
                                        สร้างบัญชี
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showToast && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-amber-500 text-black px-6 py-3 rounded-full shadow-2xl shadow-amber-500/20 flex items-center gap-2 animate-bounce-short z-[60] font-bold">
                            <CheckCircle2 className="w-5 h-5" />
                            <span>สร้างคนคีย์สำเร็จ</span>
                        </div>
                    )}
                </div>
            );
        };

        // 4. Owner View
        const OwnerView = ({ 
            onLogout, 
            transactions, 
            leaders, 
            onAddLeader, 
            winningNumbers, 
            setWinningNumbers,
            payoutRates,
            setPayoutRates
        }) => {
            const [showAddModal, setShowAddModal] = useState(false);
            
            // Add Leader Form State
            const [newLeaderName, setNewLeaderName] = useState('');
            const [newLeaderPhone, setNewLeaderPhone] = useState('');
            const [newLeaderId, setNewLeaderId] = useState('');
            const [newLeaderPassword, setNewLeaderPassword] = useState('');

            const [totalPayout, setTotalPayout] = useState(0);
            const [leaderPayouts, setLeaderPayouts] = useState({}); // Stores payout per leader
            const [showToast, setShowToast] = useState(false);

            const totalVolume = (transactions || []).reduce((sum, tx) => sum + (tx.amount || 0), 0);

            // Calculate Global Top Numbers (Risky Numbers)
            const globalNumberStats = useMemo(() => {
                const stats = {};
                transactions.forEach(tx => {
                    if (!stats[tx.number]) stats[tx.number] = 0;
                    stats[tx.number] += (tx.amount || 0);
                });
                return Object.entries(stats)
                    .sort(([, a], [, b]) => b - a)
                    .slice(0, 8)
