                    .map(([number, amount]) => ({ number, amount, risk: amount > 10000 ? 'high' : 'medium' }));
            }, [transactions]);

            // Calculate Analysis Data
            const salesByType = useMemo(() => {
                const stats = { '2 ตัวบน': 0, '2 ตัวล่าง': 0, '3 ตัวบน': 0, '3 ตัวโต๊ด': 0, 'วิ่งบน': 0, 'วิ่งล่าง': 0 };
                transactions.forEach(tx => {
                    if (stats[tx.type] !== undefined) {
                        stats[tx.type] += (tx.amount || 0);
                    }
                });
                return stats;
            }, [transactions]);

            const profit = totalVolume - totalPayout;

            const handleSaveLeader = () => {
                if(!newLeaderName || !newLeaderId || !newLeaderPassword) return;
                onAddLeader({ 
                    name: newLeaderName, 
                    phone: newLeaderPhone, 
                    id: newLeaderId,
                    password: newLeaderPassword
                });
                setShowAddModal(false);
                setNewLeaderName('');
                setNewLeaderPhone('');
                setNewLeaderId('');
                setNewLeaderPassword('');
                setShowToast(true);
                setTimeout(() => setShowToast(false), 3000);
            }

            const handleAnnounce = () => {
                let payout = 0;
                const payoutsByLeader = {};

                (transactions || []).forEach(tx => {
                    let isWin = false;
                    // Standard Rules
                    if (tx.type === '3 ตัวบน' && tx.number === winningNumbers.top3) isWin = true;
                    if (tx.type === '2 ตัวบน' && winningNumbers.top3 && winningNumbers.top3.endsWith(tx.number)) isWin = true;
                    if (tx.type === '2 ตัวล่าง' && tx.number === winningNumbers.bottom2) isWin = true;
                    
                    // Tod Rules
                    if (tx.type === '3 ตัวโต๊ด' && winningNumbers.top3) {
                        const winSorted = winningNumbers.top3.split('').sort().join('');
                        const txSorted = tx.number.split('').sort().join('');
                        if(winSorted === txSorted) isWin = true;
                    }

                    // Running Number Rules
                    if (tx.type === 'วิ่งบน' && winningNumbers.top3 && winningNumbers.top3.includes(tx.number)) isWin = true;
                    if (tx.type === 'วิ่งล่าง' && winningNumbers.bottom2 && winningNumbers.bottom2.includes(tx.number)) isWin = true;

                    if (isWin) {
                        let rate = 0;
                        if (tx.type === '3 ตัวบน') rate = payoutRates.top3;
                        if (tx.type === '3 ตัวโต๊ด') rate = payoutRates.tod3;
                        if (tx.type === '2 ตัวบน') rate = payoutRates.top2;
                        if (tx.type === '2 ตัวล่าง') rate = payoutRates.bottom2;
                        if (tx.type === 'วิ่งบน') rate = payoutRates.runTop;
                        if (tx.type === 'วิ่งล่าง') rate = payoutRates.runBottom;
                        
                        const winAmount = (tx.amount || 0) * rate;
                        payout += winAmount;

                        // Accumulate per leader
                        if (!payoutsByLeader[tx.leaderId]) {
                            payoutsByLeader[tx.leaderId] = 0;
                        }
                        payoutsByLeader[tx.leaderId] += winAmount;
                    }
                });
                setTotalPayout(payout);
                setLeaderPayouts(payoutsByLeader);
                setShowToast(true);
                setTimeout(() => setShowToast(false), 3000);
            };

            return (
                <div className="min-h-screen bg-zinc-950 text-zinc-100 p-6 relative font-sans">
                    <div className="max-w-6xl mx-auto space-y-6">
                        <div className="flex justify-between items-center bg-zinc-900 border border-zinc-800 p-4 rounded-xl shadow-sm">
                            <div className="flex items-center gap-3">
                                <div className="p-2 bg-gradient-to-br from-amber-500 to-yellow-700 rounded-lg text-black">
                                    <Crown className="w-6 h-6" />
                                </div>
                                <h1 className="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-zinc-400">ระบบเจ้าของ (Owner)</h1>
                            </div>
                            <div className="flex items-center gap-3">
                                <button 
                                    onClick={() => setShowAddModal(true)}
                                    className="bg-amber-500/10 border border-amber-500/50 text-amber-400 px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-amber-500 hover:text-black transition-all"
                                >
                                    <UserPlus className="w-4 h-4" />
                                    <span className="hidden sm:inline text-sm font-bold">เพิ่มหัวสาย</span>
                                </button>
                                <button onClick={onLogout} className="text-sm text-red-500 font-medium hover:text-red-400 border border-zinc-800 p-2 rounded-lg hover:bg-zinc-800">
                                    <LogOut className="w-5 h-5" />
                                </button>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div className="bg-gradient-to-br from-amber-600 via-yellow-600 to-amber-800 text-black p-6 rounded-2xl shadow-lg shadow-amber-900/20 relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-4 opacity-10"><TrendingUp size={100} /></div>
                                <p className="opacity-70 mb-1 font-bold uppercase tracking-wider text-xs">ยอดขายรวม (สด)</p>
                                <h2 className="text-4xl font-black">{formatCurrency(totalVolume)}</h2>
                            </div>
                            <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-sm">
                                <div className="flex items-center gap-2 mb-2 text-zinc-500 text-xs uppercase tracking-wider">
                                    <Trophy className="w-4 h-4 text-amber-500" />
                                    ยอดจ่ายโดยประมาณ
                                </div>
                                <h2 className="text-3xl font-bold text-white">{formatCurrency(totalPayout)}</h2>
                                <p className="text-xs text-zinc-500 mt-2">อ้างอิงจากผลรางวัลที่ประกาศ</p>
                            </div>
                            <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-sm">
                                <p className="text-zinc-500 mb-1 text-xs uppercase tracking-wider">จำนวนหัวสาย</p>
                                <h2 className="text-3xl font-bold text-white">{leaders.length}</h2>
                            </div>
                        </div>

                        {/* --- PAYOUT BREAKDOWN SECTION (NEW) --- */}
                        <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-sm">
                            <div className="flex items-center gap-2 border-b border-zinc-800 pb-3 mb-4">
                                <Wallet className="w-5 h-5 text-amber-500" />
                                <h3 className="font-bold text-zinc-200 uppercase tracking-wider">สรุปยอดจ่ายแยกตามสาย (Payout Breakdown)</h3>
                            </div>
                            <div className="space-y-3">
                                {Object.keys(leaderPayouts).length === 0 ? (
                                    <div className="text-center py-8 text-zinc-600 border border-zinc-800 border-dashed rounded-lg text-xs">
                                        ยังไม่มีรายการถูกรางวัล หรือยังไม่ได้กดคำนวณ
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                        {Object.entries(leaderPayouts).sort(([,a],[,b]) => b-a).map(([lid, amount]) => {
                                            const leader = leaders.find(l => l.id === lid);
                                            return (
                                                <div key={lid} className="flex justify-between items-center bg-zinc-950 p-4 rounded-lg border border-zinc-800 hover:border-zinc-700 transition-colors">
                                                    <div className="flex items-center gap-3">
                                                        <div className="bg-zinc-800 w-10 h-10 rounded-full flex items-center justify-center text-amber-500 font-bold text-xs border border-zinc-700 shadow-inner">
                                                            {lid}
                                                        </div>
                                                        <div>
                                                            <div className="font-bold text-zinc-200">{leader ? leader.name : 'Unknown Leader'}</div>
                                                            <div className="text-xs text-zinc-500">{leader ? leader.phone : 'N/A'}</div>
                                                        </div>
                                                    </div>
                                                    <div className="text-right">
                                                        <div className="font-bold text-red-500 text-lg">{formatCurrency(amount)}</div>
                                                        <div className="text-[10px] text-zinc-500 uppercase tracking-wide">ต้องโอนจ่าย</div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* --- ANALYSIS SECTION (NEW) --- */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            {/* Profit Analysis */}
                            <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-sm">
                                <div className="flex items-center gap-2 border-b border-zinc-800 pb-3 mb-4">
                                    <Activity className="w-5 h-5 text-amber-500" />
                                    <h3 className="font-bold text-zinc-200">วิเคราะห์กำไร/ขาดทุน</h3>
                                </div>
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center">
                                        <span className="text-zinc-400">ยอดขายรวม</span>
                                        <span className="text-white font-bold">{formatCurrency(totalVolume)}</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-zinc-400">จ่ายรางวัล (คาดการณ์)</span>
                                        <span className="text-red-400 font-bold">-{formatCurrency(totalPayout)}</span>
                                    </div>
                                    <div className="h-px bg-zinc-800 my-2" />
                                    <div className="flex justify-between items-center">
                                        <span className="text-zinc-200 font-bold">กำไรสุทธิ</span>
                                        <span className={`text-2xl font-bold ${profit >= 0 ? 'text-green-500' : 'text-red-500'}`}>
                                            {formatCurrency(profit)}
                                        </span>
                                    </div>
                                </div>
                            </div>

                            {/* Sales Distribution */}
                            <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-sm">
                                <div className="flex items-center gap-2 border-b border-zinc-800 pb-3 mb-4">
                                    <PieChart className="w-5 h-5 text-amber-500" />
                                    <h3 className="font-bold text-zinc-200">สัดส่วนยอดขายตามประเภท</h3>
                                </div>
                                <div className="space-y-3">
                                    {Object.entries(salesByType).map(([type, amount]) => {
                                        const percent = totalVolume > 0 ? (amount / totalVolume) * 100 : 0;
                                        return (
                                            <div key={type} className="space-y-1">
                                                <div className="flex justify-between text-xs">
                                                    <span className="text-zinc-400">{type}</span>
                                                    <span className="text-zinc-200">{formatCurrency(amount)} ({percent.toFixed(1)}%)</span>
                                                </div>
                                                <div className="h-2 bg-zinc-800 rounded-full overflow-hidden">
                                                    <div 
                                                        className="h-full bg-amber-500" 
                                                        style={{ width: `${percent}%` }}
                                                    />
                                                </div>
                                            </div>
                                        )
                                    })}
                                </div>
                            </div>
                        </div>

                        {/* --- RISK MONITORING SECTION --- */}
                        <div className="space-y-3">
                            <h3 className="font-bold text-zinc-400 flex items-center gap-2 text-sm uppercase tracking-wider">
                                <AlertTriangle className="w-4 h-4 text-red-500" />
                                เลขเสี่ยงยอดนิยม (Global Top Risks)
                            </h3>
                            {globalNumberStats.length === 0 ? (
                                <div className="text-center py-8 text-zinc-600 border border-zinc-800 border-dashed rounded-lg text-xs">ยังไม่มีข้อมูลยอดขาย</div>
                            ) : (
                                <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3">
                                    {globalNumberStats.map((item, idx) => (
                                        <div key={idx} className={`p-3 rounded-lg border backdrop-blur-sm ${
                                            item.risk === 'high' 
                                            ? 'bg-red-950/20 border-red-900/50 text-red-400' 
                                            : 'bg-amber-950/20 border-amber-900/50 text-amber-400'
                                        }`}>
                                            <div className="text-xl font-black text-center tracking-wider text-white">{item.number}</div>
                                            <div className={`text-[10px] text-center font-medium opacity-80`}>
                                                {formatCurrency(item.amount)}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* --- MANAGEMENT SECTION --- */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            
                            {/* 1. RESULT ANNOUNCEMENT */}
                            <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-sm space-y-4">
                                <div className="flex items-center gap-2 border-b border-zinc-800 pb-3">
                                    <Megaphone className="w-5 h-5 text-amber-500" />
                                    <h3 className="font-bold text-zinc-200">ประกาศผลรางวัล</h3>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-medium text-zinc-500 mb-1">3 ตัวบน</label>
                                        <input 
                                            type="text" 
                                            maxLength={3}
                                            value={winningNumbers.top3}
                                            onChange={(e) => setWinningNumbers({...winningNumbers, top3: e.target.value.replace(/[^0-9]/g, '')})}
                                            className="w-full text-center text-2xl font-bold py-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white focus:border-amber-500 outline-none tracking-widest"
                                            placeholder="---"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-zinc-500 mb-1">2 ตัวล่าง</label>
                                        <input 
                                            type="text" 
                                            maxLength={2}
                                            value={winningNumbers.bottom2}
                                            onChange={(e) => setWinningNumbers({...winningNumbers, bottom2: e.target.value.replace(/[^0-9]/g, '')})}
                                            className="w-full text-center text-2xl font-bold py-3 bg-zinc-950 border border-zinc-700 rounded-xl text-white focus:border-amber-500 outline-none tracking-widest"
                                            placeholder="--"
                                        />
                                    </div>
                                </div>
                                <button 
                                    onClick={handleAnnounce}
                                    className="w-full py-3 bg-amber-500 text-black font-bold rounded-xl hover:bg-amber-400 transition-colors shadow-lg shadow-amber-500/20"
                                >
                                    ประกาศผล & คำนวณ
                                </button>
                            </div>

                            {/* 2. PAYOUT CONFIGURATION */}
                            <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-sm space-y-4">
                                <div className="flex items-center gap-2 border-b border-zinc-800 pb-3">
                                    <Coins className="w-5 h-5 text-amber-500" />
                                    <h3 className="font-bold text-zinc-200">ตั้งราคาจ่าย (บาทละ)</h3>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-[10px] text-zinc-500 mb-1">2 ตัว (บน/ล่าง)</label>
                                        <div className="flex items-center bg-zinc-950 border border-zinc-700 rounded-lg px-3">
                                            <span className="text-zinc-500 text-xs">฿</span>
                                            <input 
                                                type="number"
                                                value={payoutRates.top2}
                                                onChange={(e) => setPayoutRates({...payoutRates, top2: safeParseInt(e.target.value), bottom2: safeParseInt(e.target.value)})}
                                                className="w-full py-2 bg-transparent text-right text-white font-mono outline-none"
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-zinc-500 mb-1">3 ตัวบน</label>
                                        <div className="flex items-center bg-zinc-950 border border-zinc-700 rounded-lg px-3">
                                            <span className="text-zinc-500 text-xs">฿</span>
                                            <input 
                                                type="number"
                                                value={payoutRates.top3}
                                                onChange={(e) => setPayoutRates({...payoutRates, top3: safeParseInt(e.target.value)})}
                                                className="w-full py-2 bg-transparent text-right text-white font-mono outline-none"
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-zinc-500 mb-1">3 ตัวโต๊ด</label>
                                        <div className="flex items-center bg-zinc-950 border border-zinc-700 rounded-lg px-3">
                                            <span className="text-zinc-500 text-xs">฿</span>
                                            <input 
                                                type="number"
                                                value={payoutRates.tod3}
                                                onChange={(e) => setPayoutRates({...payoutRates, tod3: safeParseInt(e.target.value)})}
                                                className="w-full py-2 bg-transparent text-right text-white font-mono outline-none"
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-zinc-500 mb-1">วิ่งบน</label>
                                        <div className="flex items-center bg-zinc-950 border border-zinc-700 rounded-lg px-3">
                                            <span className="text-zinc-500 text-xs">฿</span>
                                            <input 
                                                type="number"
                                                value={payoutRates.runTop}
                                                onChange={(e) => setPayoutRates({...payoutRates, runTop: safeParseInt(e.target.value)})}
                                                className="w-full py-2 bg-transparent text-right text-white font-mono outline-none"
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-[10px] text-zinc-500 mb-1">วิ่งล่าง</label>
                                        <div className="flex items-center bg-zinc-950 border border-zinc-700 rounded-lg px-3">
                                            <span className="text-zinc-500 text-xs">฿</span>
                                            <input 
                                                type="number"
                                                value={payoutRates.runBottom}
                                                onChange={(e) => setPayoutRates({...payoutRates, runBottom: safeParseInt(e.target.value)})}
                                                className="w-full py-2 bg-transparent text-right text-white font-mono outline-none"
                                            />
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>

                        <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-sm">
                            <h3 className="font-bold text-zinc-400 mb-4 text-sm uppercase tracking-wider">รายชื่อหัวสาย (Leaders)</h3>
                            <div className="space-y-3">
                                {leaders.length === 0 ? <p className="text-zinc-600 text-sm">ยังไม่มีหัวสายลงทะเบียน</p> : 
                                leaders.map((leader, i) => {
                                    const vol = (transactions || []).filter(t => t.leaderId === leader.id).reduce((s,t) => s+(t.amount||0), 0);
                                    return (
                                        <div key={i} className="flex justify-between items-center bg-zinc-950 p-3 rounded-lg border border-zinc-800">
                                            <div className="flex items-center gap-3">
                                                <div className="bg-zinc-800 w-10 h-10 rounded-full flex items-center justify-center text-amber-500 font-bold text-xs border border-zinc-700">
                                                    {leader.id}
                                                </div>
                                                <div>
                                                    <div className="font-bold text-zinc-200">{leader.name}</div>
                                                    <div className="text-xs text-zinc-500">{leader.phone || 'ไม่ระบุเบอร์'}</div>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <div className="font-bold text-amber-400">{formatCurrency(vol)}</div>
                                                <div className="text-[10px] text-zinc-600">ยอดขาย</div>
                                            </div>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    </div>

                    {/* ADD LEADER MODAL */}
                    {showAddModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="bg-zinc-900 w-full max-w-md rounded-2xl border border-amber-500/20 shadow-2xl animate-in zoom-in-95 duration-200">
                                <div className="flex justify-between items-center p-6 border-b border-zinc-800">
                                    <h3 className="text-xl font-bold text-white flex items-center gap-2">
                                        <UserPlus className="w-5 h-5 text-amber-500" />
                                        เพิ่มหัวสายใหม่
                                    </h3>
                                    <button onClick={() => setShowAddModal(false)} className="text-zinc-500 hover:text-white transition-colors">
                                        <X className="w-6 h-6" />
                                    </button>
                                </div>
                                
                                <div className="p-6 space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-zinc-400 mb-1">รหัสหัวสาย <span className="text-red-500">*</span></label>
                                        <input 
                                            type="text" 
                                            value={newLeaderId}
                                            onChange={(e) => setNewLeaderId(e.target.value.toUpperCase())}
                                            className="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white focus:border-amber-500 outline-none transition-colors uppercase"
                                            placeholder="เช่น L..."
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-zinc-400 mb-1">รหัสผ่าน <span className="text-red-500">*</span></label>
                                        <input 
                                            type="password" 
                                            value={newLeaderPassword}
                                            onChange={(e) => setNewLeaderPassword(e.target.value)}
                                            className="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white focus:border-amber-500 outline-none transition-colors"
                                            placeholder="ตั้งรหัสผ่าน"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-zinc-400 mb-1">ชื่อ-นามสกุล <span className="text-red-500">*</span></label>
                                        <input 
                                            type="text" 
                                            value={newLeaderName}
                                            onChange={(e) => setNewLeaderName(e.target.value)}
                                            className="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white focus:border-amber-500 outline-none transition-colors"
                                            placeholder="กรอกชื่อหัวสาย"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-zinc-400 mb-1">เบอร์โทร</label>
                                        <input 
                                            type="tel" 
                                            value={newLeaderPhone}
                                            onChange={(e) => setNewLeaderPhone(e.target.value)}
                                            className="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white focus:border-amber-500 outline-none transition-colors"
                                            placeholder="08X-XXX-XXXX"
                                        />
                                    </div>
                                </div>

                                <div className="p-6 pt-0 flex gap-3">
                                    <button 
                                        onClick={() => setShowAddModal(false)}
                                        className="flex-1 py-3 rounded-xl border border-zinc-700 text-zinc-400 font-medium hover:bg-zinc-800 transition-colors"
                                    >
                                        ยกเลิก
                                    </button>
                                    <button 
                                        onClick={handleSaveLeader}
                                        className="flex-1 py-3 rounded-xl bg-amber-500 text-black font-bold hover:bg-amber-400 transition-colors shadow-lg shadow-amber-500/20"
                                    >
                                        สร้างบัญชี
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showToast && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-amber-500 text-black px-6 py-3 rounded-full shadow-2xl shadow-amber-500/20 flex items-center gap-2 animate-bounce-short z-[60] font-bold">
                            <CheckCircle2 className="w-5 h-5" />
                            <span>ทำรายการสำเร็จ</span>
                        </div>
                    )}
                </div>
            );
        };

        // --- Main App Logic ---
        const App = () => {
            const [currentRole, setCurrentRole] = useState(null); 
            const [currentLeaderData, setCurrentLeaderData] = useState(null); 
            const [currentUser, setCurrentUser] = useState(null); 
            
            // State Initialization
            const [transactions, setTransactions] = useState([]);
            const [leaders, setLeaders] = useState([
                { id: 'L88', name: 'คุณเฮง', phone: '081-111-2222', password: '1234' }
            ]);
            const [owners, setOwners] = useState([
                { id: 'ADMIN', name: 'Main Admin', password: '1234' }
            ]);
            const [operators, setOperators] = useState([
                { username: 'OP1', password: '111', name: 'น้องคีย์ 1', leaderId: 'L88' }
            ]);
            
            const [winningNumbers, setWinningNumbers] = useState({
                top3: '',
                bottom2: ''
            });
            const [payoutRates, setPayoutRates] = useState({
                top2: 90,
                bottom2: 90,
                top3: 900,
                tod3: 150,
                runTop: 3,
                runBottom: 4
            });

            const addTransaction = (newTxList) => {
                const processed = newTxList.map((tx, i) => ({
                    ...tx,
                    id: Date.now() + i,
                }));
                setTransactions(prev => [...processed, ...prev]);
            };

            const updateTransaction = (updatedTx) => {
                setTransactions(prev => prev.map(tx => {
                    if (tx.id === updatedTx.id) {
                        const changeLog = {
                            timestamp: new Date().toLocaleString('th-TH'),
                            prevNumber: tx.number,
                            prevAmount: tx.amount,
                            editor: 'Operator' 
                        };
                        return {
                            ...updatedTx,
                            editHistory: [changeLog, ...(tx.editHistory || [])] 
                        };
                    }
                    return tx;
                }));
            };

            const deleteTransaction = (id) => {
                setTransactions(prev => prev.filter(tx => tx.id !== id));
            };

            const addLeader = (leader) => {
                setLeaders(prev => [...prev, leader]);
            };

            const addOperator = (operator) => {
                setOperators(prev => [...prev, operator]);
            };

            const handleLogin = (role, userData = null) => {
                setCurrentRole(role);
                setCurrentUser(userData);
                if (role === 'leader' && userData) {
                    setCurrentLeaderData(userData);
                }
            };

            if (!currentRole) {
                return <LoginView onLogin={handleLogin} leaders={leaders} owners={owners} operators={operators} />;
            }

            return (
                <div className="font-sans text-zinc-100 antialiased bg-zinc-950 min-h-screen selection:bg-amber-500 selection:text-black">
                    <div className="fixed top-20 right-0 z-50 group">
                        <button className="bg-zinc-800 text-zinc-400 text-[10px] px-2 py-1 rounded-l opacity-30 hover:opacity-100 transition-opacity border border-zinc-700 border-r-0">
                            สลับตำแหน่ง (Demo)
                        </button>
                        <div className="hidden group-hover:flex flex-col absolute right-0 top-full bg-zinc-900 shadow-xl border border-zinc-700 rounded-l mt-1 w-32">
                            <button onClick={() => setCurrentRole(null)} className="px-4 py-3 hover:bg-zinc-800 text-left text-xs border-b border-zinc-800 text-zinc-300">ออกจากระบบ</button>
                        </div>
                    </div>

                    {currentRole === 'operator' && (
                        <OperatorView 
                            onLogout={() => setCurrentRole(null)} 
                            onAddTransaction={addTransaction}
                            onUpdateTransaction={updateTransaction}
                            onDeleteTransaction={deleteTransaction}
                            transactions={transactions}
                            user={currentUser}
                        />
                    )}
                    
                    {currentRole === 'leader' && (
                        <LeaderDashboard 
                            onLogout={() => setCurrentRole(null)} 
                            transactions={transactions} 
                            leaderData={currentLeaderData}
                            onAddOperator={addOperator}
                            myOperators={operators.filter(op => op.leaderId === currentLeaderData?.id)}
                        />
                    )}
                    
                    {currentRole === 'owner' && (
                        <OwnerView 
                            onLogout={() => setCurrentRole(null)} 
                            transactions={transactions}
                            leaders={leaders}
                            onAddLeader={addLeader}
                            winningNumbers={winningNumbers}
                            setWinningNumbers={setWinningNumbers}
                            payoutRates={payoutRates}
                            setPayoutRates={setPayoutRates}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
