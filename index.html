<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GRAND - ระบบจัดการเลข</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Sarabun', sans-serif;
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #18181b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #52525b; }
        
        /* Hide number input arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 selection:bg-amber-500 selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        // --- MOCK DATA & CONFIG ---
        const DEFAULT_LEADERS = [
            { id: 'LP88', name: 'หัวสาย 88', password: '1234', commission: 20 },
            { id: 'LP99', name: 'หัวสาย 99', password: '1234', commission: 25 }
        ];
        const DEFAULT_OWNERS = [{ id: 'Admin', name: 'เจ้าของใหญ่', password: '1234' }];
        const DEFAULT_OPERATORS = [{ username: 'OP1', name: 'น้องบี', password: '111', leaderId: 'LP88' }];
        
        const DEFAULT_PAYOUT_RATES = {
            top3: 900, tod3: 150, bottom3: 450, front3: 450, return3: 150,
            top2: 90, bottom2: 90, return2: 90,
            runTop: 3.2, runBottom: 4.2
        };

        // --- ICON WRAPPER ---
        const Icon = ({ name, size = 24, className, onClick }) => {
            // Safety check for Lucide availability
            if (!window.lucide || !window.lucide.icons) return null;
            
            const iconData = window.lucide.icons[name];
            if (!iconData) return null;
            
            return (
                <svg onClick={onClick} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {iconData.map((child, index) => {
                        const [tag, attrs] = child;
                        return React.createElement(tag, { ...attrs, key: index });
                    })}
                </svg>
            );
        };

        // Icon Shortcuts
        const LogOut = (p) => <Icon name="LogOut" {...p} />;
        const Clock = (p) => <Icon name="Clock" {...p} />;
        const Search = (p) => <Icon name="Search" {...p} />;
        const CheckCircle2 = (p) => <Icon name="CheckCircle2" {...p} />;
        const History = (p) => <Icon name="History" {...p} />;
        const Crown = (p) => <Icon name="Crown" {...p} />;
        const Layers = (p) => <Icon name="Layers" {...p} />;
        const User = (p) => <Icon name="User" {...p} />;
        const UserPlus = (p) => <Icon name="UserPlus" {...p} />;
        const Send = (p) => <Icon name="Send" {...p} />;
        const X = (p) => <Icon name="X" {...p} />;
        const Key = (p) => <Icon name="Key" {...p} />;
        const Trophy = (p) => <Icon name="Trophy" {...p} />;
        const PieChart = (p) => <Icon name="PieChart" {...p} />;
        const Activity = (p) => <Icon name="Activity" {...p} />;
        const Briefcase = (p) => <Icon name="Briefcase" {...p} />;
        const FileText = (p) => <Icon name="FileText" {...p} />;
        const BookUser = (p) => <Icon name="BookUser" {...p} />;
        const Pencil = (p) => <Icon name="Pencil" {...p} />;
        const Trash2 = (p) => <Icon name="Trash2" {...p} />;
        const FileClock = (p) => <Icon name="FileClock" {...p} />;
        const Wallet = (p) => <Icon name="Wallet" {...p} />;
        const Calculator = (p) => <Icon name="Calculator" {...p} />;
        const AlertTriangle = (p) => <Icon name="AlertTriangle" {...p} />;
        const Settings = (p) => <Icon name="Settings" {...p} />;
        const BarChart3 = (p) => <Icon name="BarChart3" {...p} />;
        const Users = (p) => <Icon name="Users" {...p} />;
        const Save = (p) => <Icon name="Save" {...p} />;
        const ChevronRight = (p) => <Icon name="ChevronRight" {...p} />;
        const ClipboardList = (p) => <Icon name="ClipboardList" {...p} />;
        const RefreshCw = (p) => <Icon name="RefreshCw" {...p} />;

        // --- HELPER FUNCTIONS ---
        const formatCurrency = (amount) => {
            if (isNaN(amount) || amount === null || amount === undefined) return '฿0';
            return new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB', minimumFractionDigits: 0 }).format(amount);
        };

        const checkPermutation = (num1, num2) => {
            if (!num1 || !num2 || num1.length !== num2.length) return false;
            return num1.split('').sort().join('') === num2.split('').sort().join('');
        };

        // --- COMPONENTS ---
        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
                    <div className="bg-zinc-900 border border-zinc-700 rounded-2xl w-full max-w-md max-h-[90vh] flex flex-col shadow-2xl">
                        <div className="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-800/50 rounded-t-2xl">
                            <h3 className="font-bold text-lg text-amber-500">{title}</h3>
                            <button onClick={onClose} className="p-1 rounded-full hover:bg-zinc-700 text-zinc-400 hover:text-white transition-colors"><X size={20} /></button>
                        </div>
                        <div className="p-4 overflow-y-auto custom-scrollbar flex-1">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const CustomerHistoryModal = ({ isOpen, onClose, customer, transactions }) => {
            if (!isOpen || !customer) return null;
            
            // Filter transactions for this customer
            const customerTx = transactions.filter(t => t.customerName === customer.name).sort((a,b) => b.id - a.id);
            const total = customerTx.reduce((sum, t) => sum + t.amount, 0);

            return (
                <Modal isOpen={isOpen} onClose={onClose} title={`ประวัติ: ${customer.name}`}>
                    <div className="space-y-4">
                        <div className="bg-zinc-950 p-4 rounded-xl border border-zinc-800 flex justify-between items-center sticky top-0 z-10 shadow-lg">
                             <div>
                                <div className="text-zinc-400 text-xs">ยอดซื้อรวมทั้งหมด</div>
                                <div className="text-2xl font-bold text-amber-500">{formatCurrency(total)}</div>
                             </div>
                             <div className="text-right">
                                <div className="text-zinc-500 text-xs">เบอร์โทรศัพท์</div>
                                <div className="text-zinc-300 font-mono">{customer.phone}</div>
                             </div>
                        </div>
                        
                        <div className="space-y-2">
                             <div className="text-xs text-zinc-400 px-1">รายการย้อนหลัง ({customerTx.length})</div>
                             {customerTx.length === 0 ? (
                                <div className="text-center py-12 text-zinc-600 bg-zinc-900/50 rounded-xl border border-dashed border-zinc-800">
                                    <div className="mb-2"><History size={24} className="mx-auto opacity-50" /></div>
                                    ไม่มีประวัติการซื้อ
                                </div>
                             ) : (
                                customerTx.map(tx => (
                                    <div key={tx.id} className="p-3 bg-zinc-800/30 border border-zinc-800 rounded-lg flex justify-between items-center hover:bg-zinc-800/60 transition-colors">
                                        <div>
                                            <div className="flex items-center gap-2 mb-1">
                                                <span className="font-mono font-bold text-xl text-white">{tx.number}</span>
                                                <span className="text-[10px] px-2 py-0.5 rounded bg-zinc-700 text-zinc-300 border border-zinc-600">{tx.type}</span>
                                            </div>
                                            <div className="text-[10px] text-zinc-500 flex items-center gap-1">
                                                <Clock size={10} /> {tx.timestamp}
                                            </div>
                                        </div>
                                        <div className="text-amber-500 font-bold font-mono text-lg">
                                            {formatCurrency(tx.amount)}
                                        </div>
                                    </div>
                                ))
                             )}
                        </div>
                    </div>
                </Modal>
            );
        };

        const AddLeaderModal = ({ isOpen, onClose, onSave }) => {
            const [formData, setFormData] = useState({ id: '', name: '', password: '', commission: '' });
            
            useEffect(() => {
                if (isOpen) setFormData({ id: '', name: '', password: '', commission: '' });
            }, [isOpen]);

            const handleSubmit = () => {
                if (!formData.id || !formData.name || !formData.password || !formData.commission) return alert('กรุณากรอกข้อมูลให้ครบ');
                onSave({ ...formData, commission: parseInt(formData.commission) });
                onClose();
            };

            if (!isOpen) return null;

            return (
                <Modal isOpen={isOpen} onClose={onClose} title="เพิ่มหัวสายใหม่">
                    <div className="space-y-4">
                        <div><label className="text-xs text-zinc-500">รหัสหัวสาย (ID)</label><input type="text" value={formData.id} onChange={e => setFormData({...formData, id: e.target.value.toUpperCase()})} className="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-white focus:border-amber-500 outline-none uppercase" placeholder="เช่น LP88" /></div>
                        <div><label className="text-xs text-zinc-500">ชื่อหัวสาย</label><input type="text" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-white focus:border-amber-500 outline-none" placeholder="ชื่อเรียก" /></div>
                        <div><label className="text-xs text-zinc-500">รหัสผ่าน</label><input type="text" value={formData.password} onChange={e => setFormData({...formData, password: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-white focus:border-amber-500 outline-none" placeholder="รหัสผ่านเข้าใช้งาน" /></div>
                        <div><label className="text-xs text-zinc-500">ค่าคอมมิชชั่น (%)</label><input type="number" value={formData.commission} onChange={e => setFormData({...formData, commission: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-white focus:border-amber-500 outline-none" placeholder="เช่น 20" /></div>
                        <button onClick={handleSubmit} className="w-full bg-amber-600 hover:bg-amber-500 text-black font-bold py-3 rounded-xl mt-2">ยืนยันการเพิ่ม</button>
                    </div>
                </Modal>
            );
        };

        const AddOperatorModal = ({ isOpen, onClose, onSave, leaderId }) => {
            const [formData, setFormData] = useState({ username: '', name: '', password: '', commission: '' });
            
            useEffect(() => {
                if (isOpen) setFormData({ username: '', name: '', password: '', commission: '' });
            }, [isOpen]);

            const handleSubmit = () => {
                if (!formData.username || !formData.name || !formData.password) return alert('กรุณากรอกข้อมูลให้ครบ');
                onSave({ 
                    ...formData, 
                    username: formData.username.toUpperCase(), 
                    leaderId,
                    commission: parseInt(formData.commission) || 0
                });
                onClose();
            };

            if (!isOpen) return null;

            return (
                <Modal isOpen={isOpen} onClose={onClose} title="เพิ่มคนคีย์ใหม่">
                    <div className="space-y-4">
                        <div className="bg-zinc-800/50 p-2 rounded text-xs text-zinc-400 mb-2">สังกัดหัวสาย: <span className="text-amber-500 font-bold">{leaderId}</span></div>
                        <div><label className="text-xs text-zinc-500">รหัสคนคีย์ (ID)</label><input type="text" value={formData.username} onChange={e => setFormData({...formData, username: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-white focus:border-amber-500 outline-none uppercase" placeholder="เช่น OP1" /></div>
                        <div><label className="text-xs text-zinc-500">ชื่อคนคีย์</label><input type="text" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-white focus:border-amber-500 outline-none" placeholder="ชื่อเรียก" /></div>
                        <div><label className="text-xs text-zinc-500">รหัสผ่าน</label><input type="text" value={formData.password} onChange={e => setFormData({...formData, password: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-white focus:border-amber-500 outline-none" placeholder="รหัสผ่านเข้าใช้งาน" /></div>
                        <div><label className="text-xs text-zinc-500">ค่าคอมมิชชั่น (%)</label><input type="number" value={formData.commission} onChange={e => setFormData({...formData, commission: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-white focus:border-amber-500 outline-none" placeholder="เช่น 5" /></div>
                        <button onClick={handleSubmit} className="w-full bg-amber-600 hover:bg-amber-500 text-black font-bold py-3 rounded-xl mt-2">ยืนยันการเพิ่ม</button>
                    </div>
                </Modal>
            );
        };

        const EditOperatorModal = ({ isOpen, onClose, operator, onSave, onDelete }) => {
            const [formData, setFormData] = useState({ name: '', password: '', commission: '' });
            
            useEffect(() => {
                if (operator) setFormData({ name: operator.name, password: operator.password, commission: operator.commission || 0 });
            }, [operator]);

            const handleSubmit = () => {
                if (!formData.name || !formData.password) return alert('กรุณากรอกข้อมูลให้ครบ');
                onSave(operator.username, { ...formData, commission: parseInt(formData.commission) || 0 });
                onClose();
            };
            
            const handleDelete = () => {
                if (confirm(`ยืนยันการลบคนคีย์ ${operator.username} (${operator.name}) ?\nการลบนี้จะไม่ส่งผลต่อประวัติบิลที่เคยส่งมา`)) {
                    onDelete(operator.username);
                    onClose();
                }
            };

            if (!isOpen || !operator) return null;

            return (
                <Modal isOpen={isOpen} onClose={onClose} title={`แก้ไขข้อมูล: ${operator.username}`}>
                    <div className="space-y-4">
                        <div><label className="text-xs text-zinc-500">ชื่อคนคีย์</label><input type="text" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-white focus:border-amber-500 outline-none" /></div>
                        <div><label className="text-xs text-zinc-500">รหัสผ่าน</label><input type="text" value={formData.password} onChange={e => setFormData({...formData, password: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-white focus:border-amber-500 outline-none" /></div>
                        <div><label className="text-xs text-zinc-500">ค่าคอมมิชชั่น (%)</label><input type="number" value={formData.commission} onChange={e => setFormData({...formData, commission: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-white focus:border-amber-500 outline-none" /></div>
                        
                        <div className="grid grid-cols-2 gap-3 pt-2">
                             <button onClick={handleDelete} className="w-full bg-red-900/50 hover:bg-red-800 border border-red-800 text-red-200 font-bold py-3 rounded-xl transition-colors">ลบคนคีย์</button>
                             <button onClick={handleSubmit} className="w-full bg-amber-600 hover:bg-amber-500 text-black font-bold py-3 rounded-xl transition-colors">บันทึก</button>
                        </div>
                    </div>
                </Modal>
            );
        };

        const EditLeaderModal = ({ isOpen, onClose, leader, onSave, onDelete }) => {
            const [formData, setFormData] = useState({ name: '', password: '', commission: '' });
            
            useEffect(() => {
                if (leader) setFormData({ name: leader.name, password: leader.password, commission: leader.commission });
            }, [leader]);

            const handleSubmit = () => {
                if (!formData.name || !formData.password || !formData.commission) return alert('กรุณากรอกข้อมูลให้ครบ');
                onSave(leader.id, { ...formData, commission: parseInt(formData.commission) });
                onClose();
            };
            
            const handleDelete = () => {
                if (confirm(`ยืนยันการลบหัวสาย ${leader.id} (${leader.name}) ?\nข้อมูลประวัติการขายของหัวสายนี้จะยังคงอยู่ แต่จะไม่สามารถเข้าใช้งานได้`)) {
                    onDelete(leader.id);
                    onClose();
                }
            };

            if (!isOpen || !leader) return null;

            return (
                <Modal isOpen={isOpen} onClose={onClose} title={`แก้ไขข้อมูล: ${leader.id}`}>
                    <div className="space-y-4">
                        <div><label className="text-xs text-zinc-500">ชื่อหัวสาย</label><input type="text" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-white focus:border-amber-500 outline-none" /></div>
                        <div><label className="text-xs text-zinc-500">รหัสผ่าน</label><input type="text" value={formData.password} onChange={e => setFormData({...formData, password: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-white focus:border-amber-500 outline-none" /></div>
                        <div><label className="text-xs text-zinc-500">ค่าคอมมิชชั่น (%)</label><input type="number" value={formData.commission} onChange={e => setFormData({...formData, commission: e.target.value})} className="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-white focus:border-amber-500 outline-none" /></div>
                        
                        <div className="grid grid-cols-2 gap-3 pt-2">
                             <button onClick={handleDelete} className="w-full bg-red-900/50 hover:bg-red-800 border border-red-800 text-red-200 font-bold py-3 rounded-xl transition-colors">ลบหัวสาย</button>
                             <button onClick={handleSubmit} className="w-full bg-amber-600 hover:bg-amber-500 text-black font-bold py-3 rounded-xl transition-colors">บันทึก</button>
                        </div>
                    </div>
                </Modal>
            );
        };

        const EditModal = ({ isOpen, onClose, transaction, onSave }) => {
            const [number, setNumber] = useState('');
            const [amount, setAmount] = useState('');
            
            useEffect(() => {
                if (transaction) {
                    setNumber(transaction.number);
                    setAmount(transaction.amount);
                }
            }, [transaction]);
            
            const handleSave = () => {
                if (!number || !amount) return;
                onSave(transaction.id, number, amount);
                onClose();
            };
            
            return (
                <Modal isOpen={isOpen} onClose={onClose} title="แก้ไขรายการ">
                    <div className="space-y-4">
                        <div>
                            <label className="text-xs text-zinc-500">เลขเดิม</label>
                            <div className="text-zinc-400 font-mono text-sm">{transaction?.number}</div>
                        </div>
                        <div>
                            <label className="text-xs text-zinc-500">เลขใหม่</label>
                            <input type="tel" value={number} onChange={e => setNumber(e.target.value.replace(/[^0-9]/g, ''))} className="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-xl font-bold text-center text-white focus:border-amber-500 outline-none" />
                        </div>
                        <div>
                            <label className="text-xs text-zinc-500">จำนวนเงิน</label>
                            <input type="tel" value={amount} onChange={e => setAmount(e.target.value.replace(/[^0-9]/g, ''))} className="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-xl font-bold text-center text-amber-500 focus:border-amber-500 outline-none" />
                        </div>
                        <button onClick={handleSave} className="w-full bg-amber-600 hover:bg-amber-500 text-black font-bold py-3 rounded-xl mt-2 transition-colors">บันทึกการแก้ไข</button>
                    </div>
                </Modal>
            );
        };

        const HistoryModal = ({ isOpen, onClose, transaction }) => {
            if (!transaction) return null;
            return (
                <Modal isOpen={isOpen} onClose={onClose} title="ประวัติการแก้ไข">
                     <div className="space-y-4">
                        <div className="bg-zinc-950 p-3 rounded-lg border border-zinc-800">
                            <div className="text-xs text-zinc-500 mb-1">สถานะปัจจุบัน</div>
                            <div className="flex justify-between items-center"><span className="text-xl font-bold font-mono">{transaction.number}</span><span className="text-lg font-bold text-amber-500">{formatCurrency(transaction.amount)}</span></div>
                        </div>
                        <div className="space-y-2">
                            <div className="text-xs text-zinc-400 font-medium">ประวัติการเปลี่ยนแปลง ({transaction.editHistory ? transaction.editHistory.length : 0})</div>
                            {transaction.editHistory && transaction.editHistory.length > 0 ? (
                                [...transaction.editHistory].reverse().map((hist, idx) => (
                                    <div key={idx} className="flex justify-between items-center p-3 bg-zinc-800/30 rounded-lg border border-zinc-800 text-sm">
                                        <div>
                                            <div className="flex items-center gap-2"><span className="font-mono text-zinc-300">{hist.oldNumber}</span><span className="text-zinc-600">→</span><span className="font-mono text-white">{hist.newNumber}</span></div>
                                            <div className="text-[10px] text-zinc-500">{hist.timestamp}</div>
                                        </div>
                                        <div className="text-right"><div className="text-zinc-500 line-through text-xs">{formatCurrency(hist.oldAmount)}</div><div className="text-amber-500/80">{formatCurrency(hist.newAmount)}</div></div>
                                    </div>
                                ))
                            ) : (<div className="text-center py-4 text-zinc-600 text-xs">ไม่พบประวัติการแก้ไข</div>)}
                        </div>
                     </div>
                </Modal>
            );
        };

        // 2. LOGIN VIEW
        const LoginView = ({ onLogin, leaders, owners, operators }) => {
            const [role, setRole] = useState('operator'); 
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleLoginSubmit = () => {
                setError('');
                try {
                    if (role === 'leader') {
                        const foundLeader = leaders.find(l => l.id.toUpperCase() === username.toUpperCase() && l.password === password);
                        if (foundLeader) onLogin('leader', foundLeader); else setError('รหัสหัวสาย หรือ รหัสผ่าน ไม่ถูกต้อง');
                    } else if (role === 'owner') {
                        const foundOwner = owners.find(o => o.id.toUpperCase() === username.toUpperCase() && o.password === password);
                        if (foundOwner) onLogin('owner', foundOwner); else setError('รหัสเจ้าของ หรือ รหัสผ่าน ไม่ถูกต้อง');
                    } else if (role === 'operator') {
                        const foundOperator = operators.find(op => op.username.toUpperCase() === username.toUpperCase() && op.password === password);
                        if (foundOperator) onLogin('operator', foundOperator); else setError('รหัสคนคีย์ หรือ รหัสผ่าน ไม่ถูกต้อง');
                    }
                } catch (err) { console.error("Login Error:", err); setError('เกิดข้อผิดพลาดในระบบล็อกอิน'); }
            };
            const getRoleLabel = (r) => r === 'operator' ? 'คนคีย์' : r === 'leader' ? 'หัวสาย' : 'เจ้าของ';

            return (
                <div className="min-h-screen bg-zinc-950 flex items-center justify-center p-4">
                    <div className="bg-zinc-900/80 backdrop-blur-md w-full max-w-sm rounded-2xl shadow-2xl border border-amber-500/20 p-8 space-y-6 relative overflow-hidden">
                        <div className="absolute -top-10 -right-10 w-32 h-32 bg-amber-500/10 rounded-full blur-3xl"></div>
                        <div className="absolute -bottom-10 -left-10 w-32 h-32 bg-amber-500/10 rounded-full blur-3xl"></div>
                        <div className="text-center space-y-2 relative z-10">
                            <div className="bg-gradient-to-br from-amber-400 to-yellow-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg"><Crown className="w-8 h-8 text-black" /></div>
                            <h1 className="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-200">THE GRAND</h1>
                            <p className="text-zinc-500 text-sm tracking-widest uppercase">ระบบจัดการเลข</p>
                        </div>
                        <div className="flex bg-zinc-950 p-1 rounded-xl border border-zinc-800 relative z-10">
                            {['operator', 'leader', 'owner'].map((r) => (
                                <button key={r} onClick={() => { setRole(r); setError(''); setUsername(''); setPassword(''); }} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${role === r ? 'bg-zinc-800 text-amber-400 shadow-sm' : 'text-zinc-500 hover:text-zinc-300'}`}>{getRoleLabel(r)}</button>
                            ))}
                        </div>
                        <div className="space-y-4 relative z-10">
                            <div>
                                <label className="block text-xs font-medium text-amber-500/80 mb-1">{role === 'leader' ? 'Leader ID' : role === 'owner' ? 'Owner ID' : 'Operator ID'}</label>
                                <div className="relative"><User className="absolute left-3 top-3 w-5 h-5 text-zinc-600" /><input type="text" value={username} onChange={(e) => setUsername(e.target.value)} className="w-full pl-10 pr-4 py-3 rounded-lg bg-zinc-950 border border-zinc-800 text-zinc-100 focus:border-amber-500 outline-none uppercase transition-colors" placeholder="ระบุ ID" /></div>
                            </div>
                            <div>
                                <label className="block text-xs font-medium text-amber-500/80 mb-1">รหัสผ่าน</label>
                                <div className="relative"><Key className="absolute left-3 top-3 w-5 h-5 text-zinc-600" /><input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full pl-10 pr-4 py-3 rounded-lg bg-zinc-950 border border-zinc-800 text-zinc-100 focus:border-amber-500 outline-none transition-colors" placeholder="••••" /></div>
                            </div>
                            {error && <div className="text-red-500 text-xs text-center bg-red-500/10 py-2 rounded-lg border border-red-500/20">{error}</div>}
                            <button onClick={handleLoginSubmit} className="w-full bg-gradient-to-r from-amber-600 via-yellow-500 to-amber-600 text-black font-bold py-3.5 rounded-xl shadow-lg hover:shadow-amber-500/20 transition-all active:scale-95 flex items-center justify-center gap-2">เข้าสู่ระบบ</button>
                        </div>
                    </div>
                </div>
            );
        };

        // 3. OPERATOR VIEW
        const OperatorView = ({ onLogout, onAddTransaction, onUpdateTransaction, onDeleteTransaction, transactions, user, payoutRates }) => {
            const [number, setNumber] = useState('');
            const [amount, setAmount] = useState('');
            const [selectedTypes, setSelectedTypes] = useState(['2top']); 
            const [leaderId, setLeaderId] = useState(user?.leaderId || 'LP88');
            const [customerName, setCustomerName] = useState('');
            const [customerPhone, setCustomerPhone] = useState('');
            const [showSuggestions, setShowSuggestions] = useState(false);
            const [showCustomerList, setShowCustomerList] = useState(false);
            const [editingTx, setEditingTx] = useState(null);
            const [historyTx, setHistoryTx] = useState(null);
            const [viewingCustomer, setViewingCustomer] = useState(null); // For history modal
            const [toastMessage, setToastMessage] = useState('');
            const [showToast, setShowToast] = useState(false);

            const group2 = ['2top', '2bottom', '2return'];
            const groupRun = ['runTop', 'runBottom']; 

            const myTransactions = useMemo(() => (transactions || []).filter(tx => tx.sender === (user?.username || 'Operator')).sort((a,b) => b.id - a.id), [transactions, user]);
            const myRecentTransactions = myTransactions.slice(0, 10);

            const uniqueCustomers = useMemo(() => {
                const customers = {};
                myTransactions.forEach(tx => {
                    if (tx.customerName) {
                        if (!customers[tx.customerName]) customers[tx.customerName] = { name: tx.customerName, phone: tx.customerPhone || '', totalSpent: 0 };
                        customers[tx.customerName].totalSpent += (tx.amount || 0);
                    }
                });
                return Object.values(customers).sort((a,b) => b.totalSpent - a.totalSpent);
            }, [myTransactions]);

            const customerSuggestions = useMemo(() => !customerName ? [] : uniqueCustomers.filter(c => c.name.includes(customerName) && c.name !== customerName), [customerName, uniqueCustomers]);

            const currentMaxLength = useMemo(() => {
                if (selectedTypes.length > 0) {
                    if (group2.includes(selectedTypes[0])) return 2;
                    if (groupRun.includes(selectedTypes[0])) return 1; 
                }
                return 3; 
            }, [selectedTypes]);

            useEffect(() => {
                if (number.length > currentMaxLength) setNumber(number.slice(0, currentMaxLength));
            }, [currentMaxLength, number]);

            const handleSave = () => {
                if (!number || !amount || selectedTypes.length === 0 || !leaderId || !customerName || !customerPhone) return;
                const numericAmount = parseInt(amount, 10);
                if(isNaN(numericAmount) || numericAmount <= 0) return;
                
                const newTxList = [];
                const timestampStr = new Date().toLocaleString('th-TH', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });

                selectedTypes.forEach(type => {
                    newTxList.push({ number: number, amount: numericAmount, type: getTypeLabel(type), leaderId: leaderId.toUpperCase(), customerName: customerName, customerPhone: customerPhone, sender: user?.username || 'Operator', timestamp: timestampStr });
                });
                onAddTransaction(newTxList);
                setNumber(''); setAmount(''); showToastMsg('บันทึกรายการสำเร็จ');
            };

            const toggleType = (value) => {
                setSelectedTypes(prev => {
                    if (prev.includes(value)) return prev.length === 1 ? prev : prev.filter(t => t !== value);
                    return [...prev, value];
                });
            };

            const getTypeLabel = (t) => {
                const map = { '2top': '2 ตัวบน', '2bottom': '2 ตัวล่าง', '2return': '2 ตัวกลับ', '3top': '3 ตัวบน', '3tod': '3 ตัวโต๊ด', '3bottom': '3 ตัวล่าง', '3front': '3 ตัวหน้า', '3return': '3 ตัวกลับ', 'runTop': 'วิ่งบน', 'runBottom': 'วิ่งล่าง' };
                return map[t] || t;
            };
            
            const getPayoutRate = (typeValue) => {
                const map = { '2top': payoutRates.top2, '2bottom': payoutRates.bottom2, '2return': payoutRates.return2, '3top': payoutRates.top3, '3tod': payoutRates.tod3, '3bottom': payoutRates.bottom3, '3front': payoutRates.front3, '3return': payoutRates.return3, 'runTop': payoutRates.runTop, 'runBottom': payoutRates.runBottom };
                return map[typeValue] || 0;
            };

            const showToastMsg = (msg) => { setToastMessage(msg); setShowToast(true); setTimeout(() => setShowToast(false), 2000); };
            const handleUpdateTx = (id, newNum, newAmt) => { onUpdateTransaction(id, newNum, newAmt); showToastMsg('แก้ไขสำเร็จ'); };
            const handleDelete = (id) => { if(confirm('ยืนยันการลบ?')) { onDeleteTransaction(id); showToastMsg('ลบรายการสำเร็จ'); } }

            const TypeButton = ({ value, label }) => {
                const isSelected = selectedTypes.includes(value);
                const rate = getPayoutRate(value);
                return (
                    <button onClick={() => toggleType(value)} className={`flex-1 p-2 sm:p-3 rounded-xl border transition-all flex flex-col items-center justify-center relative overflow-hidden group ${isSelected ? 'border-amber-500 bg-amber-500/20 text-amber-400 shadow-[0_0_15px_rgba(245,158,11,0.3)]' : 'border-zinc-800 bg-zinc-900 text-zinc-500 hover:bg-zinc-800'}`}>
                        <span className="font-bold text-xs sm:text-sm">{label}</span>
                        <span className="text-[9px] sm:text-[10px] text-zinc-500">จ่าย {rate}</span>
                        {isSelected && <div className="absolute top-1 right-1"><CheckCircle2 className="w-3 h-3 text-amber-500" /></div>}
                    </button>
                );
            };

            const CustomerModal = useMemo(() => <div className={`fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in ${showCustomerList ? '' : 'hidden'}`}>
                <div className="bg-zinc-900 border border-zinc-700 rounded-2xl w-full max-w-md max-h-[80vh] flex flex-col shadow-2xl">
                    <div className="p-4 border-b border-zinc-800 flex justify-between items-center"><h3 className="font-bold text-amber-500">รายชื่อลูกค้า</h3><button onClick={() => setShowCustomerList(false)}><X size={20} /></button></div>
                    <div className="p-4 overflow-y-auto custom-scrollbar space-y-2">
                        {uniqueCustomers.map((c, idx) => (
                            <div key={idx} className="p-3 bg-zinc-800/50 hover:bg-zinc-800 border border-zinc-700/50 rounded-lg flex justify-between items-center group relative">
                                <div className="flex-1 cursor-pointer" onClick={() => { setCustomerName(c.name); setCustomerPhone(c.phone); setShowCustomerList(false); }}>
                                    <div><div className="font-bold text-zinc-200">{c.name}</div><div className="text-xs text-zinc-500">{c.phone}</div></div>
                                </div>
                                
                                <div className="flex items-center gap-3">
                                    <div className="text-right cursor-pointer" onClick={() => { setCustomerName(c.name); setCustomerPhone(c.phone); setShowCustomerList(false); }}>
                                        <div className="text-xs text-zinc-400">ยอดรวม</div>
                                        <div className="text-amber-500 font-bold">{formatCurrency(c.totalSpent)}</div>
                                    </div>
                                    <button onClick={(e) => { e.stopPropagation(); setViewingCustomer(c); setShowCustomerList(false); }} className="p-2 rounded-full hover:bg-zinc-700 text-zinc-500 hover:text-amber-400 transition-colors border border-transparent hover:border-zinc-600" title="ดูประวัติ">
                                        <FileClock size={18} />
                                    </button>
                                </div>
                            </div>
                        ))}
                        {uniqueCustomers.length === 0 && <div className="text-center text-zinc-500 py-4">ไม่พบข้อมูลลูกค้า</div>}
                    </div>
                </div>
            </div>, [showCustomerList, uniqueCustomers]);

            return (
                <div className="min-h-screen bg-zinc-950 pb-20 text-zinc-100 font-sans">
                    <div className="bg-zinc-900/80 backdrop-blur border-b border-zinc-800 px-4 py-3 sticky top-0 z-10 flex justify-between items-center shadow-md">
                        <div><h2 className="font-bold text-amber-500 text-lg flex items-center gap-2"><Crown className="w-5 h-5" /> GRAND</h2><span className="text-xs text-zinc-500 flex items-center gap-1"><Clock className="w-3 h-3" /> ปิดรับ 15:20 น.</span></div>
                        <div className="flex items-center gap-2">
                            <div className="text-right hidden sm:block"><div className="text-xs text-zinc-400">{user?.name}</div><div className="text-[10px] text-amber-500">ID: {user?.username}</div></div>
                            <button onClick={onLogout} className="p-2 bg-zinc-800 rounded-full text-zinc-400 hover:text-white border border-zinc-700 hover:border-red-500/50 transition-colors"><LogOut className="w-5 h-5" /></button>
                        </div>
                    </div>

                    <div className="p-3 sm:p-4 max-w-md mx-auto space-y-4">
                        <div className="bg-zinc-900 rounded-2xl p-4 shadow-xl border border-zinc-800">
                             <div className="flex items-center justify-between gap-2 mb-3 text-amber-500/80">
                                <div className="flex items-center gap-2"><Send className="w-4 h-4" /><span className="text-xs font-bold uppercase tracking-widest">ข้อมูลการส่ง</span></div>
                                <button onClick={() => setShowCustomerList(true)} className="flex items-center gap-1 bg-zinc-800 hover:bg-zinc-700 px-2 py-1 rounded-md text-[10px] text-zinc-300 border border-zinc-700"><BookUser className="w-3 h-3" /> ลูกค้าเก่า</button>
                             </div>
                             <div className="space-y-3">
                                 <div className="grid grid-cols-2 gap-3 pt-1 border-t border-zinc-800/50">
                                    <div className="relative">
                                        <label className="block text-[10px] font-medium text-zinc-500 mb-1">ชื่อลูกค้า <span className="text-red-500">*</span></label>
                                        <input type="text" value={customerName} onChange={(e) => { setCustomerName(e.target.value); setShowSuggestions(true); }} onFocus={() => setShowSuggestions(true)} placeholder="ระบุชื่อ" className="w-full px-3 py-2 bg-zinc-950 border border-zinc-800 rounded-lg text-zinc-300 text-xs focus:border-zinc-600 outline-none" />
                                        {showSuggestions && customerSuggestions.length > 0 && (<div className="absolute top-full left-0 right-0 z-50 bg-zinc-800 border border-zinc-700 rounded-lg mt-1 shadow-xl max-h-40 overflow-y-auto">{customerSuggestions.map((cust, idx) => (<div key={idx} onClick={() => { setCustomerName(cust.name); setCustomerPhone(cust.phone); setShowSuggestions(false); }} className="px-3 py-2 hover:bg-zinc-700 cursor-pointer text-xs text-zinc-300 flex justify-between"><span>{cust.name}</span><span className="text-zinc-500 text-[10px]">{cust.phone}</span></div>))}</div>)}
                                    </div>
                                    <div><label className="block text-[10px] font-medium text-zinc-500 mb-1">เบอร์โทร <span className="text-red-500">*</span></label><input type="tel" value={customerPhone} onChange={(e) => setCustomerPhone(e.target.value)} placeholder="ระบุเบอร์" className="w-full px-3 py-2 bg-zinc-950 border border-zinc-800 rounded-lg text-zinc-300 text-xs focus:border-zinc-600 outline-none" /></div>
                                 </div>
                             </div>
                        </div>
                        
                        <div className="bg-zinc-900 rounded-2xl p-4 sm:p-5 shadow-xl border border-zinc-800 space-y-4 relative overflow-hidden">
                            <div className="grid grid-cols-5 gap-3 items-start">
                                <div className="col-span-3">
                                    <label className="text-xs font-semibold text-zinc-400 ml-1 mb-1 block">ตัวเลข ({currentMaxLength} หลัก)</label>
                                    <input type="tel" value={number} onChange={(e) => setNumber(e.target.value.replace(/[^0-9]/g, '').slice(0, currentMaxLength))} placeholder={currentMaxLength===2?"00":currentMaxLength===1?"0":"000"} className="w-full text-4xl font-bold text-center py-3 bg-zinc-950 border border-zinc-700 rounded-xl focus:border-amber-500 outline-none tracking-[0.2em] text-white placeholder-zinc-800 transition-colors shadow-inner font-mono" />
                                </div>
                                <div className="col-span-2">
                                    <label className="text-xs font-semibold text-zinc-400 ml-1 mb-1 block">ราคา (บาท)</label>
                                    <input type="tel" value={amount} onChange={(e) => setAmount(e.target.value.replace(/[^0-9]/g, ''))} placeholder="0" className="w-full text-4xl font-bold text-center py-3 bg-zinc-950 border border-zinc-700 rounded-xl focus:border-amber-500 outline-none text-amber-500 placeholder-zinc-800 transition-colors shadow-inner" />
                                </div>
                            </div>
                            <div className="space-y-3 pt-2 border-t border-zinc-800/50">
                                <div><div className="text-[10px] text-zinc-500 mb-1 pl-1">ประเภท 3 ตัว</div><div className="grid grid-cols-3 gap-2 mb-2"><TypeButton value="3top" label="3 บน" /><TypeButton value="3bottom" label="3 ล่าง" /><TypeButton value="3tod" label="3 โต๊ด" /></div><div className="grid grid-cols-2 gap-2"><TypeButton value="3front" label="3 หน้า" /><TypeButton value="3return" label="3 กลับ" /></div></div>
                                <div><div className="text-[10px] text-zinc-500 mb-1 pl-1">ประเภท 2 ตัว</div><div className="grid grid-cols-3 gap-2"><TypeButton value="2top" label="2 บน" /><TypeButton value="2bottom" label="2 ล่าง" /><TypeButton value="2return" label="2 กลับ" /></div></div>
                                <div><div className="text-[10px] text-zinc-500 mb-1 pl-1">เลขวิ่ง</div><div className="grid grid-cols-2 gap-2"><TypeButton value="runTop" label="วิ่งบน" /><TypeButton value="runBottom" label="วิ่งล่าง" /></div></div>
                            </div>
                            <div className="pt-2"><button onClick={handleSave} className="w-full bg-gradient-to-r from-amber-600 via-yellow-500 to-amber-600 active:from-amber-700 active:to-amber-700 text-black py-4 rounded-xl text-lg font-bold shadow-lg flex items-center justify-center gap-2 transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:grayscale" disabled={!number || !amount || selectedTypes.length === 0 || !leaderId || !customerName || !customerPhone}><Layers className="w-5 h-5" /> บันทึก {selectedTypes.length} รายการ</button></div>
                        </div>

                        <div className="pb-10">
                            <div className="flex justify-between items-center px-2 mb-2 border-b border-zinc-800 pb-2"><h3 className="font-semibold text-zinc-400 text-sm uppercase flex items-center gap-2"><History className="w-4 h-4" /> รายการล่าสุด</h3><div className="text-xs text-zinc-600">แสดง 10 รายการล่าสุด</div></div>
                            {myRecentTransactions.length === 0 ? (<div className="text-center py-8 text-zinc-600 text-sm bg-zinc-900/50 rounded-xl border border-dashed border-zinc-800">ยังไม่มีรายการล่าสุด</div>) : (
                                <div className="bg-zinc-900 rounded-2xl shadow-lg border border-zinc-800 overflow-hidden divide-y divide-zinc-800/50">
                                    {myRecentTransactions.map((tx) => (
                                        <div key={tx.id} className="p-3 sm:p-4 flex justify-between items-center hover:bg-zinc-800/50 transition-colors group">
                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center font-bold text-white text-lg shadow-inner border border-zinc-700 shrink-0 font-mono">{tx.number}</div>
                                                <div>
                                                    <div className="text-sm font-medium text-zinc-200">{tx.type}</div>
                                                    <div className="flex items-center gap-2 mb-1"><span className="text-[10px] text-zinc-500 flex items-center gap-1"><Clock size={10} /> {tx.timestamp}</span></div>
                                                    <div className="flex items-center gap-1 text-[10px] text-zinc-400"><User size={10} /><span>{tx.customerName}</span></div>
                                                </div>
                                            </div>
                                            <div className="flex flex-col items-end gap-1">
                                                <div className="font-bold text-amber-400 font-mono tracking-tight">{formatCurrency(tx.amount)}</div>
                                                <div className="flex gap-1 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                                                    {tx.editHistory?.length > 0 && <button onClick={() => setHistoryTx(tx)} className="bg-zinc-700 p-1.5 rounded text-zinc-300 hover:text-white hover:bg-orange-600 transition-colors"><FileClock size={14} /></button>}
                                                    <button onClick={() => setEditingTx(tx)} className="bg-zinc-700 p-1.5 rounded text-zinc-300 hover:text-white hover:bg-blue-600 transition-colors"><Pencil size={14} /></button>
                                                    <button onClick={() => handleDelete(tx.id)} className="bg-zinc-700 p-1.5 rounded text-zinc-300 hover:text-white hover:bg-red-600 transition-colors"><Trash2 size={14} /></button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                    {showToast && (<div className="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-amber-500 text-black px-4 py-2 rounded-lg shadow-lg font-bold text-sm animate-fade-in z-50">{toastMessage}</div>)}
                    <EditModal isOpen={!!editingTx} onClose={() => setEditingTx(null)} transaction={editingTx} onSave={handleUpdateTx} />
                    <HistoryModal isOpen={!!historyTx} onClose={() => setHistoryTx(null)} transaction={historyTx} />
                    <CustomerHistoryModal isOpen={!!viewingCustomer} onClose={() => setViewingCustomer(null)} customer={viewingCustomer} transactions={myTransactions} />
                    {CustomerModal}
                </div>
            );
        };

        // 4. LEADER VIEW
        const LeaderView = ({ user, transactions, onLogout, onAddOperator, onUpdateOperator, onDeleteOperator, operators }) => {
            const [showAddOperatorModal, setShowAddOperatorModal] = useState(false);
            const [editingOperator, setEditingOperator] = useState(null);
            
            // Filter operators for this leader
            const myOperators = useMemo(() => (operators || []).filter(op => op.leaderId === user.id), [operators, user]);
            
            const myTransactions = useMemo(() => transactions.filter(t => t.leaderId === user.id).sort((a,b) => b.id - a.id), [transactions, user]);
            const stats = useMemo(() => {
                const total = myTransactions.reduce((acc, t) => acc + t.amount, 0);
                const comm = total * ((user.commission || 20) / 100);
                const net = total - comm;
                return { total, comm, net };
            }, [myTransactions, user]);
            const transactionsByType = useMemo(() => {
                const grouped = {};
                myTransactions.forEach(t => { if (!grouped[t.type]) grouped[t.type] = 0; grouped[t.type] += t.amount; });
                return grouped;
            }, [myTransactions]);

            return (
                <div className="min-h-screen bg-zinc-950 text-zinc-100 pb-10 font-sans">
                     <div className="bg-zinc-900 border-b border-zinc-800 px-6 py-4 flex justify-between items-center sticky top-0 z-10">
                        <div><div className="flex items-center gap-2 text-amber-500 font-bold text-xl"><Briefcase /> HEAD OF LINE</div><div className="text-xs text-zinc-500">ID: {user.id} | Comm: {user.commission}%</div></div>
                        <div className="flex items-center gap-4">
                            <button onClick={() => setShowAddOperatorModal(true)} className="flex items-center gap-2 text-xs bg-amber-600/20 hover:bg-amber-600/40 text-amber-500 px-3 py-1.5 rounded-lg border border-amber-600/50 transition-colors">
                                <UserPlus size={14} /> เพิ่มคนคีย์
                            </button>
                            <div className="h-6 w-px bg-zinc-700"></div>
