<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GRAND - ระบบจัดการเลข</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Sarabun', sans-serif;
        }
        .animate-bounce-short {
            animation: bounce-short 0.5s ease-in-out 2;
        }
        @keyframes bounce-short {
            0%, 100% { transform: translateY(-50%); }
            50% { transform: translateY(-65%); }
        }
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #18181b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #52525b; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        // --- Icon Component Wrapper ---
        const Icon = ({ name, size = 24, className }) => {
            const iconData = lucide.icons[name];
            if (!iconData) return null;
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {iconData.map((child, index) => {
                        const [tag, attrs] = child;
                        return React.createElement(tag, { ...attrs, key: index });
                    })}
                </svg>
            );
        };

        const Users = (p) => <Icon name="Users" {...p} />;
        const TrendingUp = (p) => <Icon name="TrendingUp" {...p} />;
        const AlertTriangle = (p) => <Icon name="AlertTriangle" {...p} />;
        const LogOut = (p) => <Icon name="LogOut" {...p} />;
        const Save = (p) => <Icon name="Save" {...p} />;
        const Clock = (p) => <Icon name="Clock" {...p} />;
        const Search = (p) => <Icon name="Search" {...p} />;
        const CheckCircle2 = (p) => <Icon name="CheckCircle2" {...p} />;
        const History = (p) => <Icon name="History" {...p} />;
        const Crown = (p) => <Icon name="Crown" {...p} />;
        const Layers = (p) => <Icon name="Layers" {...p} />;
        const User = (p) => <Icon name="User" {...p} />;
        const Send = (p) => <Icon name="Send" {...p} />;
        const UserPlus = (p) => <Icon name="UserPlus" {...p} />;
        const X = (p) => <Icon name="X" {...p} />;
        const Lock = (p) => <Icon name="Lock" {...p} />;
        const Key = (p) => <Icon name="Key" {...p} />;
        const Megaphone = (p) => <Icon name="Megaphone" {...p} />;
        const Coins = (p) => <Icon name="Coins" {...p} />;
        const Trophy = (p) => <Icon name="Trophy" {...p} />;
        const PieChart = (p) => <Icon name="PieChart" {...p} />;
        const Activity = (p) => <Icon name="Activity" {...p} />;
        const Phone = (p) => <Icon name="Phone" {...p} />;
        const Briefcase = (p) => <Icon name="Briefcase" {...p} />;
        const FileText = (p) => <Icon name="FileText" {...p} />;
        const BookUser = (p) => <Icon name="BookUser" {...p} />;
        const CalendarDays = (p) => <Icon name="CalendarDays" {...p} />;
        const Pencil = (p) => <Icon name="Pencil" {...p} />;
        const Trash2 = (p) => <Icon name="Trash2" {...p} />;
        const FileClock = (p) => <Icon name="FileClock" {...p} />;
        const Wallet = (p) => <Icon name="Wallet" {...p} />;
        const ArrowLeftRight = (p) => <Icon name="ArrowLeftRight" {...p} />;

        // --- Helper Functions ---
        const formatCurrency = (amount) => {
            if (isNaN(amount) || amount === null || amount === undefined) return '฿0';
            return new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB', minimumFractionDigits: 0 }).format(amount);
        };

        const safeParseInt = (val) => {
            if (val === '' || val === null || val === undefined) return '';
            const parsed = parseInt(val, 10);
            return isNaN(parsed) ? '' : parsed;
        };

        const generatePermutations = (str) => {
            if (!str || str.length < 2) return [str];
            const result = new Set();
            if (str.length === 2) {
                result.add(str); result.add(str[1] + str[0]);
            } else if (str.length === 3) {
                const c = str.split('');
                result.add(c[0]+c[1]+c[2]); result.add(c[0]+c[2]+c[1]);
                result.add(c[1]+c[0]+c[2]); result.add(c[1]+c[2]+c[0]);
                result.add(c[2]+c[0]+c[1]); result.add(c[2]+c[1]+c[0]);
            } else { result.add(str); }
            return [...result];
        };

        // --- COMPONENTS ---

        // 1. Login Component
        const LoginView = ({ onLogin, leaders, owners, operators }) => {
            const [role, setRole] = useState('leader'); 
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleLoginSubmit = () => {
                setError('');
                try {
                    if (role === 'leader') {
                        const foundLeader = leaders.find(l => l.id && username && l.id.toUpperCase() === username.toUpperCase() && l.password === password);
                        if (foundLeader) onLogin('leader', foundLeader); else setError('รหัสหัวสาย หรือ รหัสผ่าน ไม่ถูกต้อง');
                    } else if (role === 'owner') {
                        const foundOwner = owners.find(o => o.id && username && o.id.toUpperCase() === username.toUpperCase() && o.password === password);
                        if (foundOwner) onLogin('owner'); else setError('รหัสเจ้าของ หรือ รหัสผ่าน ไม่ถูกต้อง');
                    } else if (role === 'operator') {
                        const foundOperator = operators.find(op => op.username && username && op.username.toUpperCase() === username.toUpperCase() && op.password === password);
                        if (foundOperator) onLogin('operator', foundOperator); else setError('รหัสคนคีย์ หรือ รหัสผ่าน ไม่ถูกต้อง');
                    }
                } catch (err) { console.error("Login Error:", err); setError('เกิดข้อผิดพลาดในระบบล็อกอิน'); }
            };

            const getRoleLabel = (r) => r === 'operator' ? 'คนคีย์' : r === 'leader' ? 'หัวสาย' : 'เจ้าของ';

            return (
                <div className="min-h-screen bg-zinc-950 flex items-center justify-center p-4 font-sans">
                    <div className="bg-zinc-900/80 backdrop-blur-md w-full max-w-sm rounded-2xl shadow-2xl border border-amber-500/20 p-8 space-y-6 relative overflow-hidden">
                        <div className="absolute -top-10 -right-10 w-32 h-32 bg-amber-500/10 rounded-full blur-3xl"></div>
                        <div className="absolute -bottom-10 -left-10 w-32 h-32 bg-amber-500/10 rounded-full blur-3xl"></div>
                        <div className="text-center space-y-2 relative z-10">
                            <div className="bg-gradient-to-br from-amber-400 to-yellow-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                                <Crown className="w-8 h-8 text-black" />
                            </div>
                            <h1 className="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-200">THE GRAND</h1>
                            <p className="text-zinc-500 text-sm tracking-widest uppercase">ระบบจัดการเลข</p>
                        </div>
                        <div className="flex bg-zinc-950 p-1 rounded-xl border border-zinc-800 relative z-10">
                            {['operator', 'leader', 'owner'].map((r) => (
                                <button key={r} onClick={() => { setRole(r); setError(''); setUsername(''); setPassword(''); }} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${role === r ? 'bg-zinc-800 text-amber-400 shadow-sm' : 'text-zinc-500 hover:text-zinc-300'}`}>{getRoleLabel(r)}</button>
                            ))}
                        </div>
                        <div className="space-y-4 relative z-10">
                            <div>
                                <label className="block text-xs font-medium text-amber-500/80 mb-1">{role === 'leader' ? 'รหัสหัวสาย' : role === 'owner' ? 'รหัสเจ้าของ' : 'รหัสคนคีย์'}</label>
                                <div className="relative">
                                    <User className="absolute left-3 top-3 w-5 h-5 text-zinc-600" />
                                    <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} className="w-full pl-10 pr-4 py-3 rounded-lg bg-zinc-950 border border-zinc-800 text-zinc-100 focus:border-amber-500 outline-none uppercase" placeholder="ระบุ ID" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs font-medium text-amber-500/80 mb-1">รหัสผ่าน</label>
                                <div className="relative">
                                    <Key className="absolute left-3 top-3 w-5 h-5 text-zinc-600" />
                                    <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full pl-10 pr-4 py-3 rounded-lg bg-zinc-950 border border-zinc-800 text-zinc-100 focus:border-amber-500 outline-none" placeholder="••••" />
                                </div>
                            </div>
                            {error && <div className="text-red-500 text-xs text-center bg-red-500/10 py-2 rounded-lg border border-red-500/20">{error}</div>}
                            <button onClick={handleLoginSubmit} className="w-full bg-gradient-to-r from-amber-600 via-yellow-500 to-amber-600 text-black font-bold py-3.5 rounded-xl shadow-lg hover:shadow-amber-500/20 transition-all active:scale-95 flex items-center justify-center gap-2">เข้าสู่ระบบ</button>
                        </div>
                    </div>
                </div>
            );
        };

        // 2. Operator View
        const OperatorView = ({ onLogout, onAddTransaction, onUpdateTransaction, onDeleteTransaction, transactions, user, payoutRates }) => {
            const [number, setNumber] = useState('');
            const [amount, setAmount] = useState('');
            const [selectedTypes, setSelectedTypes] = useState(['2top']); 
            const [leaderId, setLeaderId] = useState(user?.leaderId || 'L88'); 
            const [customerName, setCustomerName] = useState('');
            const [customerPhone, setCustomerPhone] = useState('');
            const [showSuggestions, setShowSuggestions] = useState(false);
            const [showCustomerList, setShowCustomerList] = useState(false);
            const [selectedHistoryCustomer, setSelectedHistoryCustomer] = useState(null);
            const [editingTx, setEditingTx] = useState(null);
            const [editNumber, setEditNumber] = useState('');
            const [editAmount, setEditAmount] = useState('');
            const [historyTx, setHistoryTx] = useState(null);
            const [showToast, setShowToast] = useState(false);
            const [toastMessage, setToastMessage] = useState('');

            // Updated Groups
            const group2 = ['2top', '2bottom', '2return']; // 2 กลับ instead of 2 tod
            const group3 = ['3top', '3tod', '3bottom', '3front', '3return']; // Added 3return
            const groupRun = ['runTop', 'runBottom']; 

            const myTransactions = useMemo(() => (transactions || []).filter(tx => tx.sender === (user?.username || 'Operator')).sort((a,b) => b.id - a.id), [transactions, user]);
            const myRecentTransactions = myTransactions.slice(0, 5);

            const uniqueCustomers = useMemo(() => {
                const customers = {};
                myTransactions.forEach(tx => {
                    if (tx.customerName) {
                        if (!customers[tx.customerName]) customers[tx.customerName] = { name: tx.customerName, phone: tx.customerPhone || '', totalSpent: 0 };
                        customers[tx.customerName].totalSpent += (tx.amount || 0);
                    }
                });
                return Object.values(customers).sort((a,b) => b.totalSpent - a.totalSpent);
            }, [myTransactions]);

            const customerSuggestions = useMemo(() => !customerName ? [] : uniqueCustomers.filter(c => c.name.includes(customerName) && c.name !== customerName), [customerName, uniqueCustomers]);
            const historyCustomerTransactions = useMemo(() => !selectedHistoryCustomer ? [] : myTransactions.filter(tx => tx.customerName === selectedHistoryCustomer.name), [myTransactions, selectedHistoryCustomer]);

            const currentMaxLength = useMemo(() => {
                if (selectedTypes.length > 0) {
                    if (group2.includes(selectedTypes[0])) return 2;
                    if (groupRun.includes(selectedTypes[0])) return 1; 
                }
                return 3; 
            }, [selectedTypes]);

            useEffect(() => {
                if (number.length > currentMaxLength) setNumber(number.slice(0, currentMaxLength));
            }, [currentMaxLength, number]);

            const handleSave = () => {
                if (!number || !amount || selectedTypes.length === 0 || !leaderId || !customerName || !customerPhone) return;
                const numericAmount = parseInt(amount, 10);
                if(isNaN(numericAmount) || numericAmount <= 0) return;
                
                const newTxList = [];
                const timestampStr = new Date().toLocaleString('th-TH', { 
                    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false 
                });

                selectedTypes.forEach(type => {
                    newTxList.push({
                        number: number,
                        amount: numericAmount,
                        type: getTypeLabel(type),
                        leaderId: leaderId.toUpperCase(),
                        customerName: customerName,
                        customerPhone: customerPhone,
                        sender: user?.username || 'Operator',
                        timestamp: timestampStr
                    });
                });
                onAddTransaction(newTxList);
                setNumber(''); setAmount(''); 
                setToastMessage('บันทึกสำเร็จ'); setShowToast(true); setTimeout(() => setShowToast(false), 2000);
            };

            const toggleType = (value) => {
                setSelectedTypes(prev => {
                    if (prev.includes(value)) return prev.length === 1 ? prev : prev.filter(t => t !== value);
                    const isGroup2 = group2.includes(value);
                    const isGroupRun = groupRun.includes(value);
                    const hasGroup2 = prev.some(t => group2.includes(t));
                    const hasGroup3 = prev.some(t => group3.includes(t));
                    const hasGroupRun = prev.some(t => groupRun.includes(t));

                    if (isGroup2 && (hasGroup3 || hasGroupRun)) return [value];
                    if (isGroupRun && (hasGroup2 || hasGroup3)) return [value];
                    if (!isGroup2 && !isGroupRun && (hasGroup2 || hasGroupRun)) return [value];
                    return [...prev, value];
                });
            };

            const handleUpdateSave = () => {
                if (!editingTx || !editNumber || !editAmount) return;
                const numAmount = parseInt(editAmount, 10);
                if(isNaN(numAmount) || numAmount <= 0) return;
                onUpdateTransaction({ ...editingTx, number: editNumber, amount: numAmount });
                setEditingTx(null); setToastMessage('แก้ไขรายการสำเร็จ'); setShowToast(true); setTimeout(() => setShowToast(false), 2000);
            };

            const handleDeleteClick = (id) => {
                if (window.confirm('ยืนยันการลบรายการนี้?')) {
                    onDeleteTransaction(id); setToastMessage('ลบรายการสำเร็จ'); setShowToast(true); setTimeout(() => setShowToast(false), 2000);
                }
            };

            const getTypeLabel = (t) => {
                const map = {
                    '2top': '2 ตัวบน', '2bottom': '2 ตัวล่าง', '2return': '2 ตัวกลับ',
                    '3top': '3 ตัวบน', '3tod': '3 ตัวโต๊ด', '3bottom': '3 ตัวล่าง', '3front': '3 ตัวหน้า', '3return': '3 ตัวกลับ',
                    'runTop': 'วิ่งบน', 'runBottom': 'วิ่งล่าง'
                };
                return map[t] || t;
            };
            
            const getPayoutRate = (typeValue) => {
                const map = {
                    '2top': payoutRates.top2, '2bottom': payoutRates.bottom2, '2return': payoutRates.return2,
                    '3top': payoutRates.top3, '3tod': payoutRates.tod3, '3bottom': payoutRates.bottom3, '3front': payoutRates.front3, '3return': payoutRates.return3,
                    'runTop': payoutRates.runTop, 'runBottom': payoutRates.runBottom
                };
                return map[typeValue] || 0;
            };

            const TypeButton = ({ value, label }) => {
                const isSelected = selectedTypes.includes(value);
                const rate = getPayoutRate(value);
                return (
                    <button onClick={() => toggleType(value)} className={`flex-1 p-3 rounded-xl border transition-all flex flex-col items-center justify-center relative overflow-hidden group ${isSelected ? 'border-amber-500 bg-amber-500/20 text-amber-400 shadow-[0_0_15px_rgba(245,158,11,0.3)]' : 'border-zinc-800 bg-zinc-900 text-zinc-500 hover:bg-zinc-800'}`}>
                        <span className="font-bold text-sm">{label}</span>
                        <span className="text-[10px] text-zinc-500">จ่าย {rate}</span>
                        {isSelected && <div className="absolute top-1 right-1"><CheckCircle2 className="w-3 h-3 text-amber-500" /></div>}
                    </button>
                );
            };

            return (
                <div className="min-h-screen bg-zinc-950 pb-20 text-zinc-100 font-sans">
                    {/* Header */}
                    <div className="bg-zinc-900/80 backdrop-blur border-b border-zinc-800 px-4 py-3 sticky top-0 z-10 flex justify-between items-center">
                        <div>
                           <h2 className="font-bold text-amber-500 text-lg flex items-center gap-2"><Crown className="w-5 h-5" /> GRAND</h2>
                           <span className="text-xs text-zinc-500 flex items-center gap-1"><Clock className="w-3 h-3" /> ปิดรับ 10:00 น.</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <div className="text-right hidden sm:block">
                                <div className="text-xs text-zinc-400">{user?.name || 'Operator'}</div>
                                <div className="text-[10px] text-amber-500">ID: {user?.username}</div>
                            </div>
                            <button onClick={onLogout} className="p-2 bg-zinc-800 rounded-full text-zinc-400 hover:text-white border border-zinc-700"><LogOut className="w-5 h-5" /></button>
                        </div>
                    </div>

                    <div className="p-4 max-w-md mx-auto space-y-4">
                        {/* ROUTING */}
                        <div className="bg-zinc-900 rounded-2xl p-4 shadow-xl border border-zinc-800">
                             <div className="flex items-center justify-between gap-2 mb-3 text-amber-500/80">
                                <div className="flex items-center gap-2"><Send className="w-4 h-4" /><span className="text-xs font-bold uppercase tracking-widest">ข้อมูลการส่งโพย</span></div>
                                <button onClick={() => setShowCustomerList(true)} className="flex items-center gap-1 bg-zinc-800 hover:bg-zinc-700 px-2 py-1 rounded-md text-[10px] text-zinc-300 border border-zinc-700"><BookUser className="w-3 h-3" /> รายชื่อลูกค้า</button>
                             </div>
                             <div className="space-y-3">
                                 <div>
                                    <label className="block text-[10px] font-medium text-zinc-500 mb-1">ส่งเข้าหัวสาย (Leader ID)</label>
                                    <div className="relative">
                                        <div className="absolute left-3 top-2.5 text-amber-500 font-bold text-xs">ID:</div>
                                        <input type="text" value={leaderId} readOnly className="w-full pl-10 pr-4 py-2 bg-zinc-950/50 border border-zinc-800 rounded-lg text-zinc-400 font-mono font-bold outline-none cursor-not-allowed uppercase"/>
                                        <div className="absolute right-3 top-2.5 text-zinc-600 text-[10px]"><Lock size={12} /></div>
                                    </div>
                                 </div>
                                 <div className="grid grid-cols-2 gap-3 pt-1 border-t border-zinc-800/50">
                                    <div className="relative">
                                        <label className="block text-[10px] font-medium text-zinc-500 mb-1">ชื่อลูกค้า <span className="text-red-500">*</span></label>
                                        <input type="text" value={customerName} onChange={(e) => { setCustomerName(e.target.value); setShowSuggestions(true); }} onFocus={() => setShowSuggestions(true)} placeholder="ระบุชื่อ" className="w-full px-3 py-2 bg-zinc-950 border border-zinc-800 rounded-lg text-zinc-300 text-xs focus:border-zinc-600 outline-none" />
                                        {showSuggestions && customerSuggestions.length > 0 && (
                                            <div className="absolute top-full left-0 right-0 z-50 bg-zinc-800 border border-zinc-700 rounded-lg mt-1 shadow-xl max-h-40 overflow-y-auto">
                                                {customerSuggestions.map((cust, idx) => (
                                                    <div key={idx} onClick={() => { setCustomerName(cust.name); setCustomerPhone(cust.phone); setShowSuggestions(false); }} className="px-3 py-2 hover:bg-zinc-700 cursor-pointer text-xs text-zinc-300 flex justify-between">
                                                        <span>{cust.name}</span><span className="text-zinc-500 text-[10px]">{cust.phone}</span>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-medium text-zinc-500 mb-1">เบอร์โทร <span className="text-red-500">*</span></label>
                                        <input type="tel" value={customerPhone} onChange={(e) => setCustomerPhone(e.target.value)} placeholder="ระบุเบอร์" className="w-full px-3 py-2 bg-zinc-950 border border-zinc-800 rounded-lg text-zinc-300 text-xs focus:border-zinc-600 outline-none" />
                                    </div>
                                 </div>
                             </div>
                        </div>
                        
                        {/* 2. BETTING INPUT - ADJUSTED LAYOUT */}
                        <div className="bg-zinc-900 rounded-2xl p-5 shadow-xl border border-zinc-800 space-y-4 relative overflow-hidden">
                            <div className="grid grid-cols-5 gap-3 items-start">
                                <div className="col-span-3">
                                    <label className="text-xs font-semibold text-zinc-400 ml-1 mb-1 block">ตัวเลข ({currentMaxLength} หลัก)</label>
                                    <div className="relative">
                                        <input type="tel" value={number} onChange={(e) => setNumber(e.target.value.replace(/[^0-9]/g, '').slice(0, currentMaxLength))} placeholder={currentMaxLength===2?"00":currentMaxLength===1?"0":"000"} className="w-full text-4xl font-bold text-center py-3 bg-zinc-950 border border-zinc-700 rounded-xl focus:border-amber-500 outline-none tracking-[0.2em] text-white placeholder-zinc-800 transition-colors shadow-inner" />
                                    </div>
                                </div>
                                <div className="col-span-2">
                                    <label className="text-xs font-semibold text-zinc-400 ml-1 mb-1 block">ราคา</label>
                                    <input type="tel" value={amount} onChange={(e) => setAmount(e.target.value.replace(/[^0-9]/g, ''))} placeholder="0" className="w-full text-4xl font-bold text-center py-3 bg-zinc-950 border border-zinc-700 rounded-xl focus:border-amber-500 outline-none text-amber-500 placeholder-zinc-800 transition-colors shadow-inner" />
                                </div>
                            </div>
                            <div className="space-y-3 pt-2 border-t border-zinc-800/50">
                                <div>
                                    <div className="text-[10px] text-zinc-500 mb-1 pl-1">3 ตัว</div>
                                    <div className="grid grid-cols-3 gap-2 mb-2">
                                        <TypeButton value="3top" label="3 บน" />
                                        <TypeButton value="3bottom" label="3 ล่าง" />
                                        <TypeButton value="3tod" label="3 โต๊ด" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <TypeButton value="3front" label="3 หน้า" />
                                        <TypeButton value="3return" label="3 ตัวกลับ" />
                                    </div>
                                </div>
                                <div>
                                    <div className="text-[10px] text-zinc-500 mb-1 pl-1">2 ตัว</div>
                                    <div className="grid grid-cols-3 gap-2">
                                        <TypeButton value="2top" label="2 บน" />
                                        <TypeButton value="2bottom" label="2 ล่าง" />
                                        <TypeButton value="2return" label="2 กลับ" />
                                    </div>
                                </div>
                                <div>
                                    <div className="text-[10px] text-zinc-500 mb-1 pl-1">เลขวิ่ง</div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <TypeButton value="runTop" label="วิ่งบน" />
                                        <TypeButton value="runBottom" label="วิ่งล่าง" />
                                    </div>
                                </div>
                            </div>
                            <div className="pt-2">
                                <button onClick={handleSave} className="w-full bg-gradient-to-r from-amber-600 via-yellow-500 to-amber-600 active:from-amber-700 active:to-amber-700 text-black py-4 rounded-xl text-lg font-bold shadow-lg flex items-center justify-center gap-2 transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:grayscale" disabled={!number || !amount || selectedTypes.length === 0 || !leaderId || !customerName || !customerPhone}>
                                    <Layers className="w-5 h-5" /> บันทึก {selectedTypes.length} รายการ
                                </button>
                            </div>
                        </div>

                        {/* Recent Transactions */}
                        <div>
                            <div className="flex justify-between items-center px-2 mb-2 border-b border-zinc-800 pb-2">
                                <h3 className="font-semibold text-zinc-400 text-sm uppercase flex items-center gap-2"><History className="w-4 h-4" /> รายการล่าสุด</h3>
                            </div>
                            {myRecentTransactions.length === 0 ? (
                                <div className="text-center py-8 text-zinc-600 text-sm">ยังไม่มีรายการล่าสุด</div>
                            ) : (
                                <div className="bg-zinc-900 rounded-2xl shadow-lg border border-zinc-800 overflow-hidden divide-y divide-zinc-800">
                                    {myRecentTransactions.map((tx) => (
                                        <div key={tx.id} className="p-4 flex justify-between items-center hover:bg-zinc-800/50 transition-colors group">
                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center font-bold text-white text-lg shadow-inner border border-zinc-700 shrink-0">{tx.number}</div>
                                                <div>
                                                    <div className="text-sm font-medium text-zinc-200">{tx.type}</div>
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className="text-xs text-zinc-500 flex items-center gap-1"><CalendarDays className="w-3 h-3" /> {tx.timestamp}</span>
                                                    </div>
                                                    <div className="flex items-center gap-1 text-[10px] text-zinc-400"><User size={10} /><span>{tx.customerName}</span></div>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <div className="font-bold text-amber-400 font-mono tracking-tight">+{formatCurrency(tx.amount).replace('฿','')}</div>
                                                <div className="flex gap-1 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                                                    {tx.editHistory?.length > 0 && <button onClick={() => setHistoryTx(tx)} className="bg-zinc-700 p-1.5 rounded text-zinc-300 hover:text-white hover:bg-orange-600"><FileClock size={14} /></button>}
                                                    <button onClick={() => { setEditingTx(tx); setEditNumber(tx.number); setEditAmount(tx.amount.toString()); }} className="bg-zinc-700 p-1.5 rounded text-zinc-300 hover:text-white hover:bg-blue-600"><Pencil size={14} /></button>
                                                    <button onClick={() => handleDeleteClick(tx.id)} className="bg-zinc-700 p-1.5 rounded text-zinc-300 hover:text-white hover:bg-red-600"><Trash2 size={14} /></button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* MODALS */}
                    {showCustomerList && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="bg-zinc-900 w-full max-w-md rounded-2xl border border-amber-500/20 shadow-2xl flex flex-col max-h-[80vh]">
                                <div className="flex justify-between items-center p-4 border-b border-zinc-800">
                                    <h3 className="font-bold text-white flex items-center gap-2"><BookUser className="w-5 h-5 text-amber-500" /> สมุดรายชื่อลูกค้า</h3>
                                    <button onClick={() => setShowCustomerList(false)} className="text-zinc-500 hover:text-white"><X className="w-6 h-6" /></button>
                                </div>
                                <div className="p-4 overflow-y-auto custom-scrollbar">
                                    {uniqueCustomers.map((cust, idx) => (
                                        <div key={idx} onClick={() => { setSelectedHistoryCustomer(cust); setShowCustomerList(false); }} className="bg-zinc-950 p-3 mb-2 rounded-lg border border-zinc-800 flex justify-between items-center cursor-pointer hover:bg-zinc-800">
                                            <div><div className="text-sm font-bold text-zinc-200">{cust.name}</div><div className="text-xs text-zinc-500">{cust.phone || 'ไม่ระบุเบอร์'}</div></div>
                                            <div className="text-right"><div className="text-xs text-amber-500 font-mono">{formatCurrency(cust.totalSpent)}</div><div className="text-[10px] text-zinc-600">ยอดสะสม</div></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* EDIT MODAL */}
                    {editingTx && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                            <div className="bg-zinc-900 w-full max-w-sm rounded-2xl border border-amber-500/20 shadow-2xl">
                                <div className="flex justify-between items-center p-4 border-b border-zinc-800">
                                    <h3 className="font-bold text-white flex items-center gap-2"><Pencil className="w-5 h-5 text-amber-500" /> แก้ไขรายการ</h3>
                                    <button onClick={() => setEditingTx(null)} className="text-zinc-500 hover:text-white"><X className="w-6 h-6" /></button>
                                </div>
                                <div className="p-6 space-y-4">
                                    <div><label className="block text-xs font-medium text-zinc-400 mb-1">ตัวเลข</label><input type="tel" value={editNumber} onChange={(e) => setEditNumber(e.target.value.replace(/[^0-9]/g, ''))} className="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white text-center text-xl font-bold tracking-widest" /></div>
                                    <div><label className="block text-xs font-medium text-zinc-400 mb-1">ราคา</label><input type="tel" value={editAmount} onChange={(e) => setEditAmount(e.target.value.replace(/[^0-9]/g, ''))} className="w-full px-4 py-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white text-center text-xl font-bold text-amber-500" /></div>
                                </div>
                                <div className="p-4 pt-0 flex gap-3">
                                    <button onClick={() => setEditingTx(null)} className="flex-1 py-3 rounded-xl border border-zinc-700 text-zinc-400">ยกเลิก</button>
                                    <button onClick={handleUpdateSave} className="flex-1 py-3 rounded-xl bg-amber-500 text-black font-bold">บันทึก</button>
                                </div>
                            </div>
                        </div>
                    )}
                    
                    {/* CUSTOMER HISTORY MODAL */}
                    {selectedHistoryCustomer && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm">
                            <div className="bg-zinc-900 w-full max-w-md rounded-2xl border border-amber-500/20 shadow-2xl flex flex-col max-h-[80vh]">
                                <div className="flex justify-between items-center p-4 border-b border-zinc-800 bg-zinc-900 rounded-t-2xl">
                                    <div><h3 className="font-bold text-white flex items-center gap-2"><History className="w-5 h-5 text-amber-500" /> ประวัติ: {selectedHistoryCustomer.name}</h3></div>
                                    <button onClick={() => setSelectedHistoryCustomer(null)} className="text-zinc-500 hover:text-white"><X className="w-5 h-5" /></button>
                                </div>
                                <div className="p-4 overflow-y-auto custom-scrollbar bg-zinc-950">
                                    {historyCustomerTransactions.map(tx => (
                                        <div key={tx.id} className="bg-zinc-900 p-3 rounded-lg border border-zinc-800 flex justify-between items-center mb-2">
                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center font-bold text-white shadow-inner border border-zinc-700">{tx.number}</div>
                                                <div>
                                                    <div className="text-sm text-zinc-300 font-medium">{tx.type}</div>
                                                    <div className="text-[10px] text-zinc-500 flex items-center gap-1"><CalendarDays className="w-3 h-3" /> {tx.timestamp}</div>
                                                </div>
                                            </div>
                                            <div className="font-bold text-amber-500 text-lg font-mono tracking-tight">{formatCurrency(tx.amount)}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {showToast && <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-amber-500 text-black px-6 py-3 rounded-full shadow-2xl flex items-center gap-2 animate-bounce-short z-[80] font-bold"><CheckCircle2 className="w-5 h-5" /><span>{toastMessage}</span></div>}
                </div>
            );
        };

        // 3. Leader Dashboard (Simplified for brevity but functional)
        const LeaderDashboard = ({ onLogout, transactions, leaderData }) => {
            const myTransactions = transactions.filter(tx => tx.leaderId === leaderData?.id);
            const totalSales = myTransactions.reduce((sum, tx) => sum + (tx.amount || 0), 0);
            return (
                <div className="min-h-screen bg-zinc-950 text-zinc-100 font-sans p-6">
                    <div className="flex justify-between items-center mb-6">
                        <h1 className="text-xl font-bold text-amber-500">หัวสาย: {leaderData?.name}</h1>
                        <button onClick={onLogout}><LogOut /></button>
                    </div>
                    <div className="bg-zinc-900 p-6 rounded-xl border border-zinc-800 text-center">
                        <div className="text-zinc-500">ยอดขายรวม</div>
                        <div className="text-3xl font-bold text-white">{formatCurrency(totalSales)}</div>
                    </div>
                </div>
            );
        };

        // 4. Owner View
        const OwnerView = ({ onLogout, transactions, winningNumbers, setWinningNumbers, payoutRates, setPayoutRates }) => {
            const totalVolume = transactions.reduce((sum, tx) => sum + (tx.amount || 0), 0);
            
            // Winning check logic including "Reverse" types
            const calculatePayout = () => {
                let payout = 0;
                transactions.forEach(tx => {
                    let isWin = false;
                    // --- Check Win Logic ---
                    if (tx.type === '3top' && tx.number === winningNumbers.top3) isWin = true;
                    if (tx.type === '3tod' && winningNumbers.top3) {
                         const winSorted = winningNumbers.top3.split('').sort().join('');
                         const txSorted = tx.number.split('').sort().join('');
                         if(winSorted === txSorted) isWin = true;
                    }
                    if (tx.type === '3return' && winningNumbers.top3) {
                         // 3 Return usually means permutation win (same as tod but maybe diff rate)
                         const winSorted = winningNumbers.top3.split('').sort().join('');
                         const txSorted = tx.number.split('').sort().join('');
                         if(winSorted === txSorted) isWin = true;
                    }
                    if (tx.type === '2top' && winningNumbers.top3 && winningNumbers.top3.endsWith(tx.number)) isWin = true;
                    if (tx.type === '2bottom' && tx.number === winningNumbers.bottom2) isWin = true;
                    if (tx.type === '2return') {
                         // Win if REVERSE of bought number matches 2top OR 2bottom
                         const reversed = tx.number.split('').reverse().join('');
                         if (winningNumbers.top3 && winningNumbers.top3.endsWith(reversed)) isWin = true;
                         if (reversed === winningNumbers.bottom2) isWin = true;
                    }
                    
                    if (isWin) {
                        let rate = 0;
                        if(tx.type === '2top') rate = payoutRates.top2;
                        if(tx.type === '2bottom') rate = payoutRates.bottom2;
                        if(tx.type === '2return') rate = payoutRates.return2;
                        if(tx.type === '3top') rate = payoutRates.top3;
                        if(tx.type === '3tod') rate = payoutRates.tod3;
                        if(tx.type === '3return') rate = payoutRates.return3;
                        payout += (tx.amount * rate);
                    }
                });
                return payout;
            };

            return (
                <div className="min-h-screen bg-zinc-950 text-zinc-100 p-6 font-sans">
                     <div className="flex justify-between items-center mb-6">
                        <h1 className="text-xl font-bold text-amber-500">OWNER</h1>
                        <button onClick={onLogout}><LogOut /></button>
                    </div>
                    <div className="grid grid-cols-2 gap-4 mb-6">
                        <div className="bg-zinc-900 p-4 rounded-xl border border-zinc-800">
                            <div className="text-zinc-500 text-xs">ยอดขายรวม</div>
                            <div className="text-2xl font-bold">{formatCurrency(totalVolume)}</div>
                        </div>
                        <div className="bg-zinc-900 p-4 rounded-xl border border-zinc-800">
                             <div className="text-zinc-500 text-xs">จ่ายรางวัล (ประมาณการ)</div>
                             <div className="text-2xl font-bold text-red-500">{formatCurrency(calculatePayout())}</div>
                        </div>
                    </div>
                    
                    {/* Simplified Config UI */}
                    <div className="bg-zinc-900 p-4 rounded-xl border border-zinc-800">
                        <h3 className="font-bold mb-4 text-zinc-400">ตั้งค่าราคาจ่าย</h3>
                        <div className="grid grid-cols-2 gap-4 text-sm">
                            <div><label>2 ตัวกลับ</label><input type="number" value={payoutRates.return2} onChange={e=>setPayoutRates({...payoutRates, return2: safeParseInt(e.target.value)})} className="w-full bg-zinc-950 border border-zinc-700 rounded p-2 text-right"/></div>
                            <div><label>3 ตัวกลับ</label><input type="number" value={payoutRates.return3} onChange={e=>setPayoutRates({...payoutRates, return3: safeParseInt(e.target.value)})} className="w-full bg-zinc-950 border border-zinc-700 rounded p-2 text-right"/></div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App Logic ---
        const App = () => {
            const [currentRole, setCurrentRole] = useState(null); 
            const [currentLeaderData, setCurrentLeaderData] = useState(null); 
            const [currentUser, setCurrentUser] = useState(null); 
            
            const [transactions, setTransactions] = useState([]);
            const [leaders] = useState([{ id: 'L88', name: 'คุณเฮง', password: '1234' }]);
            const [owners] = useState([{ id: 'ADMIN', password: '1234' }]);
            const [operators] = useState([{ username: 'OP1', password: '111', name: 'น้องคีย์ 1', leaderId: 'L88' }]);
            
            const [winningNumbers, setWinningNumbers] = useState({ top3: '', bottom2: '' });
            const [payoutRates, setPayoutRates] = useState({ 
                top2: 90, bottom2: 90, return2: 90, 
                top3: 900, tod3: 150, bottom3: 450, front3: 450, return3: 150,
                runTop: 3, runBottom: 4 
            });

            const addTransaction = (newTxList) => {
                const processed = newTxList.map((tx, i) => ({ ...tx, id: Date.now() + i }));
                setTransactions(prev => [...processed, ...prev]);
            };

            const updateTransaction = (updatedTx) => {
                setTransactions(prev => prev.map(tx => tx.id === updatedTx.id ? { ...updatedTx, editHistory: [{timestamp: new Date().toLocaleString(), prevNumber: tx.number, prevAmount: tx.amount}, ...(tx.editHistory || [])] } : tx));
            };

            const deleteTransaction = (id) => setTransactions(prev => prev.filter(tx => tx.id !== id));

            const handleLogin = (role, userData = null) => {
                setCurrentRole(role);
                setCurrentUser(userData);
                if (role === 'leader') setCurrentLeaderData(userData);
            };

            if (!currentRole) return <LoginView onLogin={handleLogin} leaders={leaders} owners={owners} operators={operators} />;

            return (
                <div className="font-sans text-zinc-100 antialiased bg-zinc-950 min-h-screen selection:bg-amber-500 selection:text-black">
                     {currentRole === 'operator' && <OperatorView onLogout={() => setCurrentRole(null)} onAddTransaction={addTransaction} onUpdateTransaction={updateTransaction} onDeleteTransaction={deleteTransaction} transactions={transactions} user={currentUser} payoutRates={payoutRates} />}
                     {currentRole === 'leader' && <LeaderDashboard onLogout={() => setCurrentRole(null)} transactions={transactions} leaderData={currentLeaderData} />}
                     {currentRole === 'owner' && <OwnerView onLogout={() => setCurrentRole(null)} transactions={transactions} leaders={leaders} winningNumbers={winningNumbers} setWinningNumbers={setWinningNumbers} payoutRates={payoutRates} setPayoutRates={setPayoutRates} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
