<!DOCTYPE html>
<html lang="th" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>คนทำเว็บ - รับทำเว็บไซต์สไตล์โมเดิร์น</title>
    <meta name="description" content="บริการรับทำเว็บไซต์ Sale Page, E-commerce และเว็บองค์กร ด้วยดีไซน์ทันสมัย รองรับ SEO และโหลดเร็ว">

    <!-- Performance: Preconnect to CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://esm.sh">
    <link rel="preconnect" href="https://images.unsplash.com">
    
    <!-- Google Fonts: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100&display=swap" rel="stylesheet">
    
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.5s ease-out',
                        'tilt': 'tilt 10s infinite linear',
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        tilt: {
                            '0%, 50%, 100%': { transform: 'rotate(0deg)' },
                            '25%': { transform: 'rotate(1deg)' },
                            '75%': { transform: 'rotate(-1deg)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    },
                    screens: {
                        'xs': '475px',
                    }
                }
            }
        }
    </script>

    <!-- Import Map for React modules (Production Mode) -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0?dev=false",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?dev=false",
            "lucide-react": "https://esm.sh/lucide-react@0.263.1?dev=false"
        }
    }
    </script>
    
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #000;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden; /* Prevent horizontal scroll from animations */
        }
        /* Custom Scrollbar for Webkit (Chrome, Safari) */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        /* Firefox Scrollbar */
        * {
            scrollbar-width: thin;
            scrollbar-color: #333 #000;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- AOS Animation Library JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Code, Layout, Smartphone, Rocket, Check, Menu, X, 
            ArrowRight, Globe, Zap, MessageSquare, BarChart, 
            ShieldCheck, Clock, ExternalLink, Star, ChevronDown, ChevronUp, User
        } from 'lucide-react';

        const App = () => {
            const [isScrolled, setIsScrolled] = useState(false);
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            useEffect(() => {
                // Initialize AOS Animation
                AOS.init({
                    duration: 1000,
                    once: true,
                    offset: 50,
                    easing: 'ease-out-cubic',
                });

                const handleScroll = () => {
                    setIsScrolled(window.scrollY > 20);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                if (element) {
                    const offset = 80; // Compensate for fixed navbar
                    const elementPosition = element.getBoundingClientRect().top;
                    const offsetPosition = elementPosition + window.pageYOffset - offset;
                    
                    window.scrollTo({
                        top: offsetPosition,
                        behavior: 'smooth'
                    });
                }
                setIsMenuOpen(false);
            };

            return (
                <div className="min-h-screen bg-black text-white font-sans selection:bg-pink-500 selection:text-white overflow-x-hidden" style={{ fontFamily: "'Prompt', sans-serif" }}>
                
                    {/* Background Gradients (TikTok Style: Cyan & Pink) */}
                    <div className="fixed inset-0 z-0 pointer-events-none">
                        <div className="absolute top-[-10%] left-[-10%] w-64 h-64 md:w-96 md:h-96 bg-cyan-500/20 rounded-full blur-[80px] md:blur-[128px]"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-64 h-64 md:w-96 md:h-96 bg-pink-600/20 rounded-full blur-[80px] md:blur-[128px]"></div>
                    </div>

                    {/* Navigation */}
                    <nav className={`fixed w-full z-50 transition-all duration-300 ${isScrolled ? 'bg-black/80 backdrop-blur-md border-b border-white/10 py-3 md:py-4' : 'bg-transparent py-4 md:py-6'}`}>
                        <div className="container mx-auto px-4 md:px-6 flex justify-between items-center">
                        <div className="flex items-center space-x-2 group cursor-pointer" onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})} data-aos="fade-down" data-aos-duration="800">
                            {/* TikTok Logo Style Icon */}
                            <div className="relative w-9 h-9 md:w-10 md:h-10 flex items-center justify-center">
                            <div className="absolute inset-0 bg-cyan-400 rounded-xl translate-x-[-2px] translate-y-[-2px] mix-blend-screen opacity-70 group-hover:translate-x-[-4px] group-hover:translate-y-[-4px] transition-transform"></div>
                            <div className="absolute inset-0 bg-pink-500 rounded-xl translate-x-[2px] translate-y-[2px] mix-blend-screen opacity-70 group-hover:translate-x-[4px] group-hover:translate-y-[4px] transition-transform"></div>
                            <div className="relative z-10 w-9 h-9 md:w-10 md:h-10 bg-black border border-white/20 rounded-xl flex items-center justify-center">
                                <Code className="w-5 h-5 md:w-6 md:h-6 text-white" />
                            </div>
                            </div>
                            <span className="text-lg md:text-xl font-bold tracking-normal font-sans">คนทำ<span className="text-cyan-400 drop-shadow-[2px_2px_0px_rgba(236,72,153,0.5)]">เว็บ</span></span>
                        </div>

                        {/* Desktop Menu */}
                        <div className="hidden lg:flex items-center space-x-6 xl:space-x-8" data-aos="fade-down" data-aos-duration="800" data-aos-delay="100">
                            {['บริการของเรา', 'จุดเด่น', 'ผลงาน', 'ราคา', 'รีวิว', 'คำถามที่พบบ่อย'].map((item, index) => {
                                const ids = ['services', 'features', 'portfolio', 'pricing', 'testimonials', 'faq'];
                                return (
                                    <button 
                                        key={index}
                                        onClick={() => scrollToSection(ids[index])}
                                        className="text-gray-300 hover:text-white transition-colors text-sm font-bold tracking-normal font-sans"
                                    >
                                        {item}
                                    </button>
                                )
                            })}
                            <button className="px-5 py-2 xl:px-6 xl:py-2.5 bg-white text-black rounded-full font-bold hover:bg-cyan-50 transition-colors text-sm shadow-[4px_4px_0px_#00f2ea] hover:shadow-[2px_2px_0px_#00f2ea] hover:translate-x-[2px] hover:translate-y-[2px] active:shadow-none active:translate-x-[4px] active:translate-y-[4px] duration-200 tracking-normal font-sans">
                                ปรึกษาฟรี
                            </button>
                        </div>

                        {/* Mobile Menu Button */}
                        <button className="lg:hidden text-gray-300 p-2" onClick={() => setIsMenuOpen(!isMenuOpen)} aria-label="Toggle menu">
                            {isMenuOpen ? <X size={24} /> : <Menu size={24} />}
                        </button>
                        </div>

                        {/* Mobile Menu Dropdown */}
                        <div className={`lg:hidden absolute top-full left-0 w-full bg-black/95 backdrop-blur-xl border-b border-white/10 transition-all duration-300 overflow-hidden ${isMenuOpen ? 'max-h-96 opacity-100' : 'max-h-0 opacity-0'}`}>
                            <div className="p-6 flex flex-col space-y-4">
                                {['บริการของเรา', 'จุดเด่น', 'ผลงาน', 'ราคา', 'รีวิว', 'คำถามที่พบบ่อย'].map((item, index) => {
                                    const ids = ['services', 'features', 'portfolio', 'pricing', 'testimonials', 'faq'];
                                    return (
                                        <button 
                                            key={index} 
                                            onClick={() => scrollToSection(ids[index])}
                                            className="text-left text-gray-300 hover:text-cyan-400 py-2 font-bold tracking-normal font-sans text-lg active:text-cyan-400"
                                        >
                                            {item}
                                        </button>
                                    )
                                })}
                            </div>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <section className="relative z-10 pt-28 pb-12 md:pt-40 md:pb-24 lg:pt-48 lg:pb-32 px-4 md:px-6">
                        <div className="container mx-auto flex flex-col lg:flex-row items-center gap-12 lg:gap-20">
                            
                            {/* Left Content */}
                            <div className="lg:w-1/2 text-center lg:text-left z-20 relative" data-aos="fade-up" data-aos-duration="1000">
                                {/* Glow Effect Behind Text */}
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[140%] h-[140%] -z-10 pointer-events-none mix-blend-screen opacity-60">
                                    <div className="absolute left-1/4 top-1/2 -translate-y-1/2 w-32 h-32 md:w-64 md:h-64 bg-cyan-500 rounded-full blur-[80px] animate-pulse-slow"></div>
                                    <div className="absolute right-1/4 top-1/2 -translate-y-1/2 w-32 h-32 md:w-64 md:h-64 bg-pink-600 rounded-full blur-[80px] animate-pulse-slow" style={{animationDelay: '1s'}}></div>
                                </div>

                                <div className="inline-flex items-center space-x-2 bg-white/5 border border-white/10 rounded-full px-3 py-1 md:px-4 md:py-1.5 mb-6 md:mb-8 animate-fade-in-up hover:border-cyan-400/50 transition-colors cursor-default backdrop-blur-sm mx-auto lg:mx-0">
                                    <span className="relative flex h-2 w-2">
                                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-75"></span>
                                    <span className="relative inline-flex rounded-full h-2 w-2 bg-pink-500"></span>
                                    </span>
                                    <span className="text-[10px] md:text-xs font-bold text-white uppercase tracking-wider font-sans">รับทำเว็บไซต์สไตล์โมเดิร์น</span>
                                </div>
                                
                                <div className="relative">
                                    <h1 className="text-4xl sm:text-5xl md:text-7xl lg:text-8xl font-bold leading-tight mb-4 md:mb-6 tracking-normal drop-shadow-2xl">
                                        เปลี่ยนเว็บธรรมดา <br/>
                                        <span className="relative inline-block mt-1 md:mt-2">
                                            {/* Intense Glow specifically for the bottom text */}
                                            <span className="absolute -inset-4 bg-gradient-to-r from-cyan-500/40 via-purple-500/20 to-pink-600/40 blur-[40px] rounded-full -z-10 block"></span>
                                            <span className="relative text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-200 to-pink-500 drop-shadow-[0_0_15px_rgba(236,72,153,0.3)]">
                                                ให้ปังและทำเงิน
                                            </span>
                                        </span>
                                    </h1>
                                </div>
                                
                                <p className="text-base sm:text-lg md:text-xl text-gray-400 mb-8 md:mb-10 max-w-2xl mx-auto lg:mx-0 leading-relaxed tracking-normal px-2 lg:px-0">
                                    เลิกเสียเงินกับเว็บที่ "สวยแต่ขายไม่ได้" เราสร้างเว็บด้วยดีไซน์ที่ <span className="text-cyan-400 font-bold">หยุดนิ้วโป้ง</span> <br className="hidden md:block"/>
                                    รองรับ SEO ยิง Ads แม่นยำ และโหลดเร็วระดับ <span className="text-pink-500 font-bold">0.5 วินาที</span>
                                </p>
                                
                                <div className="flex flex-col sm:flex-row justify-center lg:justify-start space-y-4 sm:space-y-0 sm:space-x-6 px-4 sm:px-0">
                                    <button 
                                    onClick={() => scrollToSection('pricing')}
                                    className="px-6 py-3.5 md:px-8 md:py-4 bg-[#fe2c55] rounded-full font-bold text-white hover:bg-[#e61e45] transition-all duration-300 flex items-center justify-center group transform hover:-translate-y-1 shadow-[0_0_20px_rgba(254,44,85,0.4)] tracking-normal font-sans text-sm md:text-base w-full sm:w-auto"
                                    >
                                    ดูราคาโปรโมชั่น
                                    <ArrowRight className="ml-2 w-4 h-4 md:w-5 md:h-5 group-hover:translate-x-1 transition-transform" />
                                    </button>
                                    <button 
                                    onClick={() => scrollToSection('portfolio')}
                                    className="px-6 py-3.5 md:px-8 md:py-4 bg-white/10 border border-white/10 rounded-full font-bold text-white hover:bg-white/20 transition-all duration-300 backdrop-blur-sm flex items-center justify-center group tracking-normal font-sans text-sm md:text-base w-full sm:w-auto"
                                    >
                                    ดูตัวอย่าง
                                    <span className="ml-2 group-hover:text-cyan-400 transition-colors">▶</span>
                                    </button>
                                </div>

                                {/* Trust badges */}
                                <div className="mt-10 md:mt-12 flex flex-wrap justify-center lg:justify-start gap-4 md:gap-6 opacity-80" data-aos="fade-up" data-aos-delay="200">
                                    <div className="flex items-center space-x-2 text-gray-400 hover:text-cyan-400 transition-colors">
                                    <ShieldCheck className="w-4 h-4 md:w-5 md:h-5" />
                                    <span className="text-xs md:text-sm font-bold tracking-normal font-sans">รับประกัน 1 ปี</span>
                                    </div>
                                    <div className="flex items-center space-x-2 text-gray-400 hover:text-pink-500 transition-colors">
                                    <Rocket className="w-4 h-4 md:w-5 md:h-5" />
                                    <span className="text-xs md:text-sm font-bold tracking-normal font-sans">Google Speed 90+</span>
                                    </div>
                                    <div className="flex items-center space-x-2 text-gray-400 hover:text-white transition-colors">
                                    <Clock className="w-4 h-4 md:w-5 md:h-5" />
                                    <span className="text-xs md:text-sm font-bold tracking-normal font-sans">ส่งงาน 5-7 วัน</span>
                                    </div>
                                </div>
                            </div>

                            {/* Right Image Content - Visible on all devices now */}
                            <div className="w-full lg:w-1/2 relative z-10 animate-float mt-8 lg:mt-0 px-4 md:px-0" data-aos="fade-left" data-aos-duration="1000" data-aos-delay="300">
                                <div className="relative rounded-2xl overflow-hidden border border-white/10 shadow-2xl shadow-cyan-500/20 group transform lg:rotate-y-12 lg:hover:rotate-0 transition-transform duration-700 bg-black">
                                    <div className="absolute inset-0 bg-gradient-to-br from-cyan-500/10 to-pink-500/10 z-10 pointer-events-none"></div>
                                    <img 
                                        src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=75&w=1200&auto=format&fit=crop" 
                                        onError={(e) => {e.target.onerror = null; e.target.src="https://images.unsplash.com/photo-1512428559087-560fa5ce7d87?q=75&w=1200"}}
                                        alt="iPhone showing Growth Analytics and SEO Results" 
                                        fetchpriority="high"
                                        width="1200"
                                        height="800"
                                        className="w-full h-auto object-cover opacity-90 group-hover:opacity-100 transition-opacity"
                                    />
                                    {/* Floating elements - Hidden on very small screens */}
                                    <div className="hidden xs:flex absolute -bottom-4 -left-4 md:-bottom-6 md:-left-6 bg-black border border-white/10 p-3 md:p-4 rounded-xl shadow-xl items-center space-x-3 z-20 animate-bounce" style={{animationDuration: '3s'}}>
                                        <div className="bg-green-500/20 p-2 rounded-lg">
                                            <Zap className="text-green-500 w-5 h-5 md:w-6 md:h-6" />
                                        </div>
                                        <div>
                                            <p className="text-[10px] md:text-xs text-gray-400 font-sans">SEO Ranking</p>
                                            <p className="text-base md:text-lg font-bold text-white font-sans">#1 Page</p>
                                        </div>
                                    </div>
                                </div>
                                {/* Glow behind */}
                                <div className="absolute -inset-4 bg-gradient-to-r from-cyan-500 to-pink-500 rounded-full blur-[40px] md:blur-[80px] opacity-20 -z-10"></div>
                            </div>
                        </div>
                    </section>

                    {/* Comparison / Why Us Section */}
                    <section id="features" className="py-16 md:py-20 bg-white/5 relative z-10 border-y border-white/5 backdrop-blur-sm">
                        <div className="container mx-auto px-4 md:px-6">
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-10 md:gap-16 items-center">
                            <div data-aos="fade-right">
                            <h2 className="text-2xl md:text-3xl lg:text-5xl font-bold mb-4 md:mb-6 tracking-normal">ทำไมต้อง คนทำเว็บ? <br/> <span className="text-cyan-400">เราให้มากกว่าแค่เว็บ</span></h2>
                            <p className="text-gray-400 mb-6 md:mb-8 leading-relaxed text-base md:text-lg tracking-normal">
                                เราเข้าใจว่าคุณไม่ได้อยากได้แค่ "เว็บสวย" แต่อยากได้ "ยอดขาย" เราจึงออกแบบโครงสร้างเว็บให้รองรับการทำการตลาดออนไลน์ 100%
                            </p>
                            
                            <div className="space-y-4 md:space-y-6">
                                <FeatureRow 
                                title="เป็นเจ้าของ 100%" 
                                desc="ไม่มีสัญญาผูกมัด มอบ Source Code และสิทธิ์ความเป็นเจ้าของให้คุณทั้งหมด ต่ออายุเองได้ราคาถูก"
                                />
                                <FeatureRow 
                                title="Marketing Ready" 
                                desc="ติดตั้ง Facebook Pixel, Google Tag Manager และวางโครงสร้าง SEO ให้พร้อมยิงโฆษณาทันที"
                                />
                                <FeatureRow 
                                title="สอนใช้งานจนเป็น" 
                                desc="มีวิดีโอสอนการใช้งานหลังบ้าน และคู่มือภาษาไทย แก้ไขข้อมูลเองได้ง่ายๆ ไม่ต้องจ้างโปรแกรมเมอร์เพิ่ม"
                                />
                            </div>
                            </div>
                            <div className="relative group mt-8 lg:mt-0" data-aos="fade-left">
                            {/* Glitch Effect Border */}
                            <div className="absolute -inset-0.5 bg-gradient-to-r from-cyan-400 to-pink-500 rounded-2xl blur opacity-50 group-hover:opacity-100 transition duration-1000 group-hover:duration-200 animate-tilt"></div>
                            <div className="relative bg-black border border-white/10 rounded-2xl p-6 md:p-8 overflow-hidden">
                                <div className="flex items-center justify-between mb-4 md:mb-6 border-b border-white/10 pb-4">
                                <span className="text-gray-500 font-bold tracking-normal font-sans text-sm md:text-base">Competitors (ทั่วไป)</span>
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500 font-black text-sm md:text-lg tracking-normal font-sans">คนทำเว็บ (เรา)</span>
                                </div>
                                {/* Comparison Table */}
                                <div className="space-y-3 md:space-y-4">
                                <CompareRow label="ความเร็วโหลด" bad="ช้า (3-5 วิ)" good="เร็วมาก (< 1 วิ)" />
                                <CompareRow label="โครงสร้าง SEO" bad="พื้นฐาน / ไม่มี" good="Technical SEO" />
                                <CompareRow label="รองรับมือถือ" bad="อาจเพี้ยน" good="100% Responsive" />
                                <CompareRow label="ความเป็นเจ้าของ" bad="เช่ารายปี" good="ซื้อขาด" />
                                <CompareRow label="บริการหลังการขาย" bad="ติดต่อยาก" good="มี Line Support" />
                                </div>
                            </div>
                            </div>
                        </div>
                        </div>
                    </section>

                    {/* Services Grid */}
                    <section id="services" className="py-16 md:py-20 relative z-10">
                        <div className="container mx-auto px-4 md:px-6">
                        <div className="text-center mb-10 md:mb-16" data-aos="fade-up">
                            <h2 className="text-2xl md:text-3xl lg:text-5xl font-bold mb-3 md:mb-4 tracking-normal">บริการครบวงจร</h2>
                            <p className="text-gray-400 tracking-normal text-sm md:text-base">ตอบโจทย์ทุกธุรกิจ ตั้งแต่เริ่มต้น จนถึงระดับมหาชน</p>
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8">
                            <div data-aos="fade-up" data-aos-delay="0">
                                <ServiceCard

                                เราคือทีมผู้เชี่ยวชาญด้าน Digital Solution ที่มุ่งมั่นช่วยให้ธุรกิจ SME ไทยเติบโตด้วยเทคโนโลยีที่ทันสมัยและคุ้มค่าที่สุด
                            </p>
                            </div>
                            
                            <div>
                            <h4 className="text-white font-bold mb-4 tracking-normal">บริการ</h4>
                            <ul className="space-y-2 text-sm text-gray-500">
                                <li className="hover:text-cyan-400 cursor-pointer transition-colors tracking-normal">รับทำ Sale Page</li>
                                <li className="hover:text-cyan-400 cursor-pointer transition-colors tracking-normal">รับทำเว็บไซต์บริษัท</li>
                                <li className="hover:text-cyan-400 cursor-pointer transition-colors tracking-normal">ระบบ E-commerce</li>
                                <li className="hover:text-cyan-400 cursor-pointer transition-colors tracking-normal">บริการ SEO / Ads</li>
                            </ul>
                            </div>

                            <div>
                            <h4 className="text-white font-bold mb-4 tracking-normal">ช่วยเหลือ</h4>
                            <ul className="space-y-2 text-sm text-gray-500">
                                <li className="hover:text-pink-500 cursor-pointer transition-colors tracking-normal">แจ้งชำระเงิน</li>
                                <li className="hover:text-pink-500 cursor-pointer transition-colors tracking-normal">บทความความรู้</li>
                                <li className="hover:text-pink-500 cursor-pointer transition-colors tracking-normal">คู่มือการใช้งาน</li>
                                <li className="hover:text-pink-500 cursor-pointer transition-colors tracking-normal">ติดต่อเรา</li>
                            </ul>
                            </div>

                            <div>
                            <h4 className="text-white font-bold mb-4 tracking-normal">ติดต่อด่วน</h4>
                            <ul className="space-y-2 text-sm text-gray-500">
                                <li className="tracking-normal">123 อาคารสาทร, กรุงเทพฯ</li>
                                <li className="tracking-normal">hello@khonthamweb.com</li>
                                <li className="tracking-normal">โทร: 02-123-4567</li>
                                <li className="text-[#00B900] font-bold tracking-normal">Line: @khonthamweb</li>
                            </ul>
                            </div>
                        </div>
                        
                        <div className="border-t border-white/10 pt-8 flex flex-col md:flex-row justify-between items-center text-sm text-gray-600 gap-4 md:gap-0">
                            <p className="tracking-normal text-center md:text-left">© 2024 คนทำเว็บ Agency. สงวนลิขสิทธิ์.</p>
                            <div className="flex space-x-6 justify-center md:justify-end">
                            <span className="hover:text-white cursor-pointer transition-colors tracking-normal">นโยบายความเป็นส่วนตัว</span>
                            <span className="hover:text-white cursor-pointer transition-colors tracking-normal">เงื่อนไขการให้บริการ</span>
                            </div>
                        </div>
                        </div>
                    </footer>
                </div>
            );
        };

        // Sub-components

        const TestimonialCard = ({ quote, author, role, rating }) => (
            <div className="bg-black border border-white/10 p-6 md:p-8 rounded-2xl relative hover:border-cyan-400/30 transition-all hover:-translate-y-1">
                <div className="absolute top-6 right-6 md:top-8 md:right-8 text-white/10">
                    <MessageSquare className="w-8 h-8 md:w-10 md:h-10" />
                </div>
                <div className="flex text-yellow-400 mb-4">
                    {[...Array(rating)].map((_, i) => (
                        <Star key={i} size={16} fill="currentColor" />
                    ))}
                </div>
                <p className="text-gray-300 mb-6 relative z-10 leading-relaxed text-sm md:text-base">"{quote}"</p>
                <div className="flex items-center">
                    <div className="w-10 h-10 bg-gradient-to-tr from-cyan-500 to-pink-500 rounded-full flex items-center justify-center text-white font-bold mr-3 shrink-0">
                        {author.charAt(0)}
                    </div>
                    <div>
                        <h4 className="text-white font-bold text-sm">{author}</h4>
                        <p className="text-gray-500 text-xs">{role}</p>
                    </div>
                </div>
            </div>
        );

        const FaqItem = ({ question, answer }) => {
            const [isOpen, setIsOpen] = useState(false);
            return (
                <div className="border-b border-white/10 last:border-0">
                    <button 
                        className="w-full py-4 md:py-6 flex items-center justify-between text-left focus:outline-none group"
                        onClick={() => setIsOpen(!isOpen)}
                    >
                        <span className={`text-base md:text-lg font-bold transition-colors pr-4 ${isOpen ? 'text-cyan-400' : 'text-white group-hover:text-gray-300'}`}>
                            {question}
                        </span>
                        {isOpen ? <ChevronUp className="text-cyan-400 shrink-0" /> : <ChevronDown className="text-gray-500 shrink-0" />}
                    </button>
                    <div className={`overflow-hidden transition-all duration-300 ${isOpen ? 'max-h-96 opacity-100 pb-4 md:pb-6' : 'max-h-0 opacity-0'}`}>
                        <p className="text-gray-400 leading-relaxed text-sm md:text-base pr-4 md:pr-8">
                            {answer}
                        </p>
                    </div>
                </div>
            );
        };

        const PortfolioItem = ({ image, title, category }) => (
            <div className="group relative rounded-xl overflow-hidden border border-white/10 cursor-pointer">
                <div className="aspect-video overflow-hidden">
                    <img 
                        src={image} 
                        alt={title} 
                        loading="lazy"
                        width="800"
                        height="450"
                        className="object-cover w-full h-full transform group-hover:scale-110 transition-transform duration-700" 
                    />
                </div>
                <div className="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-4 md:p-6">
                    <h3 className="text-lg md:text-xl font-bold text-white transform translate-y-4 group-hover:translate-y-0 transition-transform duration-300 font-sans">{title}</h3>
                    <p className="text-cyan-400 text-xs md:text-sm transform translate-y-4 group-hover:translate-y-0 transition-transform duration-300 delay-75 font-medium font-sans">{category}</p>
                </div>
            </div>
        );

        const FeatureRow = ({ title, desc }) => (
            <div className="flex items-start group">
                <div className="flex-shrink-0 w-8 h-8 md:w-10 md:h-10 rounded-full bg-cyan-500/10 flex items-center justify-center mt-1 group-hover:bg-cyan-500/20 transition-colors">
                    <Check className="w-4 h-4 md:w-5 md:h-5 text-cyan-400" />
                </div>
                <div className="ml-3 md:ml-4">
                    <h3 className="text-base md:text-lg font-bold text-white mb-1 group-hover:text-cyan-400 transition-colors tracking-normal">{title}</h3>
                    <p className="text-gray-400 text-xs md:text-sm leading-relaxed tracking-normal">{desc}</p>
                </div>
            </div>
        );

        const CompareRow = ({ label, bad, good }) => (
            <div className="flex items-center justify-between py-2 md:py-3 border-b border-white/5 last:border-0 hover:bg-white/5 px-2 rounded transition-colors">
                <span className="text-gray-300 text-xs md:text-sm w-1/3 font-medium tracking-normal">{label}</span>
                <span className="text-red-400/70 text-[10px] md:text-xs w-1/3 text-center flex items-center justify-center gap-1 font-medium tracking-normal">
                <X size={12} /> {bad}
                </span>
                <span className="text-cyan-400 text-[10px] md:text-xs font-bold w-1/3 text-right flex items-center justify-end gap-1 shadow-cyan-500/50 drop-shadow-sm tracking-normal">
                <Check size={12} /> {good}
                </span>
            </div>
        );

        const ServiceCard = ({ icon, title, description }) => (
            <div className="bg-black border border-white/10 p-6 md:p-8 rounded-2xl hover:border-cyan-400/50 transition-all duration-300 group cursor-default h-full hover:-translate-y-1 hover:shadow-[0_0_20px_rgba(0,242,234,0.1)]">
                <div className="bg-white/5 w-12 h-12 md:w-16 md:h-16 rounded-xl flex items-center justify-center mb-4 md:mb-6 group-hover:scale-110 transition-transform duration-300 border border-white/10 group-hover:border-cyan-400/30">
                    {icon}
                </div>
                <h3 className="text-lg md:text-xl font-bold mb-2 md:mb-3 text-white group-hover:text-cyan-400 transition-colors tracking-normal">{title}</h3>
                <p className="text-gray-400 leading-relaxed text-xs md:text-sm group-hover:text-gray-300 transition-colors tracking-normal">
                    {description}
                </p>
            </div>
        );

        const PricingCard = ({ title, price, subtitle, description, features, isEnterprise, borderColor }) => (
            <div className={`bg-black border ${borderColor || 'border-white/10'} rounded-xl p-6 md:p-8 flex flex-col hover:border-cyan-400/50 transition-colors duration-300 h-full group hover:shadow-[0_0_30px_rgba(0,0,0,0.5)]`}>
                <h3 className="text-xl md:text-2xl font-bold text-white mb-1 tracking-normal">{title}</h3>
                <div className="flex items-baseline mb-1">
                    <span className="text-3xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500">฿{price}</span>
                    {price !== "Contact" && <span className="text-gray-500 ml-2 font-bold tracking-normal text-xs md:text-base">/ จบงาน</span>}
                </div>
                <p className="text-pink-500 text-xs md:text-sm font-bold mb-4 tracking-normal">{subtitle}</p>
                <p className="text-gray-400 text-xs md:text-sm mb-6 border-b border-white/10 pb-6 min-h-[60px] tracking-normal">
                    {description}
                </p>
                <ul className="space-y-3 md:space-y-4 mb-8 flex-1">
                    {features.map((feat, i) => (
                        <li key={i} className="flex items-start">
                            <div className="p-1 bg-white/5 rounded-full mr-3 mt-0.5 flex-shrink-0">
                                <Check className="w-3 h-3 text-gray-300 group-hover:text-cyan-400 transition-colors" />
                            </div>
                            <span className="text-gray-300 text-xs md:text-sm font-medium tracking-normal">{feat}</span>
                        </li>
                    ))}
                </ul>
                <button className={`w-full py-3 md:py-4 rounded-lg font-bold transition-colors ${isEnterprise ? 'bg-white/10 hover:bg-white/20 text-white' : 'bg-white/10 hover:bg-white/20 text-white'} tracking-normal font-sans text-sm md:text-base`}>
                    {isEnterprise ? 'ติดต่อขอใบเสนอราคา' : 'เลือกแพ็คเกจนี้'}
                </button>
            </div>
        );

        const StatItem = ({ number, label, color }) => (
            <div>
                <div className={`text-3xl md:text-4xl lg:text-6xl font-bold ${color} mb-1 md:mb-2 tracking-tighter drop-shadow-lg`}>
                    {number}
                </div>
                <div className="text-gray-500 text-xs md:text-sm font-semibold uppercase tracking-wider">{label}</div>
            </div>
        );

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
